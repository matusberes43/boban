<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Profil – PunisherEDNA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 40px;
      color: #111;
    }

    .card {
      max-width: 600px;
      margin: auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    .card img {
      width: 140px;
      height: 140px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .info {
      margin-top: 15px;
      font-size: 18px;
      line-height: 1.8;
      text-align: center;
    }

    .info a {
      color: #004080;
      text-decoration: none;
    }

    .info a:hover {
      text-decoration: underline;
    }

    .badge {
      margin-top: 20px;
      padding: 8px 18px;
      background-color: #004080;
      color: white;
      border-radius: 20px;
      font-weight: bold;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #111;
        color: #eee;
      }
      .card {
        background-color: #1e1e1e;
        color: white;
      }
      .badge {
        background-color: #66b2ff;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://i.postimg.cc/XqkHNGXr/IMG-9052.jpg" alt="Profilová fotka">
    <h1>PunisherEDNA</h1>
    <div class="info">
      <p><strong>Jméno:</strong> Matúš Bereš</p>
      <p><strong>Věk:</strong> 30</p>
      <p><strong>Bydliště:</strong> Hlavní město, Praha</p>
      <p><strong>Počet recenzí:</strong> 4620</p>
      <p><strong>Platformy:</strong> 
        <a href="https://www.csfd.cz/" target="_blank">čsfd.cz</a>, 
        <a href="https://www.edna.cz/" target="_blank">edna.cz</a>
      </p>
    </div>
    <div class="badge">Recenzent elitní ligy</div>
  </div>

</body>
</html>
