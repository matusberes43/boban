<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Profil PunisherEDNA</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      color: #111;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      background-color: white;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .profile-header img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 4px solid #2563eb;
    }

    h1 {
      margin-top: 20px;
      font-size: 28px;
      color: #2563eb;
    }

    .info {
      font-size: 18px;
      margin: 20px 0;
      line-height: 1.6;
    }

    .social-links {
      text-align: center;
      margin-top: 30px;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      margin: 10px;
      text-decoration: none;
      font-size: 18px;
      color: #2563eb;
      font-weight: bold;
      transition: color 0.3s;
    }

    .social-links a:hover {
      color: #1e40af;
    }

    .social-links .icon {
      width: 28px;
      height: 28px;
      margin-right: 8px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }

      .profile-header img {
        width: 120px;
        height: 120px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-header">
      <img src="https://i.postimg.cc/zv2zRHqp/IMG-1637.jpg" alt="Profilová fotka">
      <h1>PunisherEDNA</h1>
    </div>

    <div class="info">
      <p><strong>Jméno:</strong> Matúš Bereš</p>
      <p><strong>Věk:</strong> 30 let</p>
      <p><strong>Bydliště:</strong> Hlavní město, Praha</p>
      <p><strong>Počet recenzí:</strong> Automaticky počítáno</p>
      <p><strong>Platformy:</strong> ČSFD.cz, Edna.cz</p>
    </div>

    <div class="social-links">
      <h3>Moje profily</h3>
      <a href="https://www.csfd.cz/uzivatel/936529-punisheredna/prehled/" target="_blank">
        <img src="https://img.icons8.com/color/48/000000/csfd.png" alt="ČSFD" class="icon"> ČSFD.cz
      </a>
      <a href="https://www.edna.cz/uzivatele/punisher-bude-trestat/" target="_blank">
        <img src="https://img.icons8.com/fluency/48/000000/internet.png" alt="Edna" class="icon"> Edna.cz
      </a>
    </div>
  </div>
</body>
</html>
