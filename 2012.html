<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Profil PunisherEDNA</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 720px;
      margin: 60px auto;
      padding: 30px;
      background-color: #1e293b;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .profile-img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #facc15;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.4);
    }

    h1 {
      color: #facc15;
      font-size: 32px;
      margin: 20px 0 10px;
    }

    .info {
      background-color: #334155;
      padding: 20px;
      border-radius: 12px;
      margin-top: 25px;
      text-align: left;
    }

    .info p {
      font-size: 18px;
      margin: 10px 0;
    }

    .links {
      margin-top: 30px;
    }

    .links a {
      display: inline-block;
      margin: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: #0ea5e9;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }

      h1 {
        font-size: 26px;
      }

      .info p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://i.postimg.cc/zv2zRHqp/IMG-1637.jpg" alt="Profilová fotka" class="profile-img">
    <h1>PunisherEDNA</h1>

    <div class="info">
      <p><strong>Jméno:</strong> Matúš Bereš</p>
      <p><strong>Věk:</strong> 30 let</p>
      <p><strong>Bydliště:</strong> Hlavní město Praha</p>
      <p><strong>Počet recenzí:</strong> Dynamicky vypočítáváno</p>
      <p><strong>Platformy:</strong> ČSFD.cz, Edna.cz</p>
    </div>

    <div class="links">
      <a href="https://www.csfd.cz/uzivatel/936529-punisheredna/prehled/" target="_blank">ČSFD profil</a>
      <a href="https://www.edna.cz/uzivatele/punisher-bude-trestat/" target="_blank">Edna profil</a>
    </div>
  </div>
</body>
</html>
