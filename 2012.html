<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Profil PunisherEDNA</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f1f5f9;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      background-color: #1e293b;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      border-radius: 16px;
    }

    .profile-header {
      text-align: center;
    }

    .profile-header img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid #facc15;
      box-shadow: 0 0 15px rgba(250, 204, 21, 0.5);
    }

    h1 {
      font-size: 32px;
      margin-top: 20px;
      color: #facc15;
    }

    .info {
      margin: 30px 0;
      font-size: 18px;
      line-height: 1.7;
      background-color: #334155;
      padding: 20px;
      border-radius: 12px;
    }

    .info p {
      margin: 10px 0;
    }

    .social-links {
      text-align: center;
      margin-top: 30px;
    }

    .social-links a {
      display: inline-block;
      margin: 10px 15px;
      text-decoration: none;
      color: #38bdf8;
      font-weight: bold;
      font-size: 18px;
      transition: color 0.3s;
    }

    .social-links a:hover {
      color: #0ea5e9;
    }

    .social-links img.icon {
      width: 28px;
      height: 28px;
      vertical-align: middle;
      margin-right: 8px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
      .profile-header img {
        width: 120px;
        height: 120px;
      }
      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-header">
      <img src="https://i.postimg.cc/zv2zRHqp/IMG-1637.jpg" alt="Profilová fotka">
      <h1>PunisherEDNA</h1>
    </div>

    <div class="info">
      <p><strong>Jméno:</strong> Matúš Bereš</p>
      <p><strong>Věk:</strong> 30 let</p>
      <p><strong>Bydliště:</strong> Hlavní město Praha</p>
      <p><strong>Počet recenzí:</strong> Dynamicky počítáno</p>
      <p><strong>Platformy:</strong> ČSFD.cz, Edna.cz</p>
    </div>

    <div class="social-links">
      <a href="https://www.csfd.cz/uzivatel/936529-punisheredna/prehled/" target="_blank">
        <img src="https://img.icons8.com/ios-filled/50/facc15/tv.png" class="icon"> ČSFD.cz
      </a>
      <a href="https://www.edna.cz/uzivatele/punisher-bude-trestat/" target="_blank">
        <img src="https://img.icons8.com/ios-glyphs/30/facc15/web.png" class="icon"> Edna.cz
      </a>
    </div>
  </div>
</body>
</html>
