<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - PunisherEDNA</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s;
    }

    .card {
      background: linear-gradient(135deg, #ffffff, #f9fafb);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
      transition: background 0.3s, color 0.3s;
    }

    .card img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #22c55e;
      margin-bottom: 15px;
    }

    .card h2 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #1f2937;
    }

    .card p {
      margin: 6px 0;
      color: #4b5563;
      font-size: 16px;
    }

    .card strong {
      color: #111827;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      text-decoration: none;
      color: #3b82f6;
      font-weight: bold;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: #2563eb;
    }

    /* Dark mode */
    body.dark {
      background-color: #0f172a;
    }

    body.dark .card {
      background: #1e293b;
      color: #f1f5f9;
    }

    body.dark .card h2,
    body.dark .card p,
    body.dark .card strong {
      color: #f8fafc;
    }

    body.dark .back-link {
      color: #93c5fd;
    }

    body.dark .back-link:hover {
      color: #60a5fa;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://i.postimg.cc/zv2zRHqp/IMG-1637.jpg" alt="Profilová fotka">
    <h2>Matúš Bereš</h2>
    <p><strong>Věk:</strong> 30</p>
    <p><strong>Bydliště:</strong> Hlavní město Praha</p>
    <p><strong>Počet recenzí:</strong> 4615</p>
    <p><strong>Platformy:</strong> čsfd.cz, edna.cz</p>
    <a class="back-link" href="index.html">← Zpět do žebříčku</a>
  </div>

  <script>
    // Přepínání režimu podle systému
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.body.classList.add('dark');
    }
  </script>
</body>
</html>
