<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Profil PunisherEDNA</title>
  <style>
    :root {
      --background-dark: #252525;
      --surface-dark: #2d2d2d;
      --accent-color: #2ecc71;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
      --text-light: #f0f0f0;
      --border-dark: #3d3d3d;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background-dark);
      color: var(--text-light);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 720px;
      margin: 60px auto;
      padding: 30px;
      background-color: var(--surface-dark);
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .profile-img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--accent-color);
      box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
    }

    h1 {
      color: var(--accent-color);
      font-size: 32px;
      margin: 20px 0 10px;
    }

    .info {
      background-color: #333;
      padding: 20px;
      border-radius: 12px;
      margin-top: 25px;
      text-align: left;
    }

    .info p {
      font-size: 18px;
      margin: 12px 0;
      line-height: 1.5;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 20px;
      background-color: #3d3d3d;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .stat-box {
      flex: 1;
    }

    .stat-box h2 {
      color: var(--accent-color);
      margin: 0;
      font-size: 28px;
    }

    .stat-box p {
      margin: 5px 0 0;
      font-size: 15px;
      color: var(--text-light);
    }

    .links {
      margin-top: 30px;
    }

    .links a {
      display: inline-block;
      margin: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .links a:hover {
      color: #27ae60;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 20px;
      }

      h1 {
        font-size: 26px;
      }

      .info p {
        font-size: 16px;
      }

      .stats {
        flex-direction: column;
      }

      .stat-box {
        margin-bottom: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://i.postimg.cc/zv2zRHqp/IMG-1637.jpg" alt="Profilová fotka" class="profile-img">
    <h1>PunisherEDNA</h1>

    <div class="info">
      <p><strong>Jméno:</strong> Matúš Bereš</p>
      <p><strong>Věk:</strong> 30 let</p>
      <p><strong>Bydliště:</strong> Hlavní město Praha</p>
      <p><strong>Platformy:</strong> ČSFD.CZ - EDNA.CZ</p>
    </div>

    <div class="stats">
      <div class="stat-box">
        <h2>4967</h2>
        <p>Recenzí</p>
      </div>
      <div class="stat-box">
        <h2>24</h2>
        <p>Fanoušků</p>
      </div>
      <div class="stat-box">
        <h2>4964</h2>
        <p>Hodnocení</p>
      </div>
    </div>

    <div class="links">
      <a href="https://www.csfd.cz/uzivatel/936529-punisheredna/prehled/" target="_blank">ČSFD</a>
      <a href="https://www.edna.cz/uzivatele/punisher-bude-trestat/" target="_blank">EDNA</a>
    </div>
  </div>
</body>
</html>
