<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trollovací rozcestník</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #1b1b1b;
      --accent-color: #2ecc71;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
      --background-dark: #252525;
      --text-light: #f0f0f0;
      --surface-dark: #2d2d2d;
      --border-dark: #3d3d3d;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }

    body {
      background-color: var(--background-dark);
      color: var(--text-light);
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px 60px;
    }

    .button {
      margin: 20px 0;
      transition: transform 0.25s ease;
      width: 100%;
      max-width: 320px;
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface-dark);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-dark);
    }

    .button img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .button img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255,255,255,0.1);
    }

    .back-button {
      background-color: var(--surface-dark);
      color: var(--text-light);
      border: 1px solid var(--border-dark);
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 40px;
      transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
    }

    .back-button:hover {
      background-color: #3b1f1f;
      color: #ff3b3f;
      box-shadow: 0 0 12px rgba(255, 59, 63, 0.5);
      transform: scale(1.05);
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
      color: var(--text-light);
      background: var(--surface-dark);
      border-top: 1px solid var(--border-dark);
      margin-top: auto;
      width: 100%;
      position: relative;
    }

    @media (max-width: 480px) {
      .back-button {
        width: 100%;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <a href="index.html">
    <button class="back-button">Zpět na hlavní stránku</button>
  </a>

  <a class="button" href="trollcsfd.html">
    <img src="https://i.postimg.cc/3N7gxy62/E5-EC0-AAE-FBAB-4750-8-ED8-3624-C3999655.png" alt="TROLL CSFD"> 
  </a>

  <a class="button" href="trolledna.html">
    <img src="https://i.postimg.cc/Rh0jgXCs/9495-D555-9425-4-D51-8-E6-C-789131806009.png" alt="TROLL EDNA">
  </a>

  <footer>
    Copyright © 2025 Matúš Bereš, s.r.o. Všechna práva vyhrazena
  </footer>

</body>
</html>
