<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trollovací rozcestník</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #1b1b1b;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px;
    }

    .button {
      margin: 20px 0;
      transition: transform 0.25s ease;
      width: 100%;
      max-width: 320px;
    }

    .button img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      display: block;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .button img:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255,255,255,0.2);
    }

    .back-button {
      background-color: #2a2a2a;
      color: #dddddd;
      border: 1px solid #444;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 40px;
      transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
    }

    .back-button:hover {
      background-color: #3b1f1f;
      color: #ff3b3f;
      box-shadow: 0 0 12px rgba(255, 59, 63, 0.5);
      transform: scale(1.05);
    }

    @media (max-width: 480px) {
      .back-button {
        width: 100%;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <a href="index.html">
    <button class="back-button">Zpět na hlavní stránku</button>
  </a>

  <a class="button" href="trollcsfd.html">
    <img src="https://i.postimg.cc/3N7gxy62/E5-EC0-AAE-FBAB-4750-8-ED8-3624-C3999655.png" alt="TROLL CSFD"> 
  </a>

  <a class="button" href="trolledna.html">
    <img src="https://i.postimg.cc/Rh0jgXCs/9495-D555-9425-4-D51-8-E6-C-789131806009.png" alt="TROLL EDNA">
  </a>

</body>
</html>
