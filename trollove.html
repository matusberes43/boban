<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trollovací rozcestník</title>
  <style>
    body {
      background-color: #0e1624;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding-top: 30px;
    }

    .button {
      margin: 20px 0;
      transition: transform 0.2s ease;
    }

    .button:hover {
      transform: scale(1.05);
    }

    .button img {
      width: 320px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      display: block;
    }

    .back-button {
      background-color: #1f2a3a;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 40px;
      transition: background-color 0.3s ease;
    }

    .back-button:hover {
      background-color: #2d3b4d;
    }
  </style>
</head>
<body>

  <a href="index.html">
    <button class="back-button">Zpět na hlavní stránku</button>
  </a>

  <a class="button" href="trollcsfd.html">
    <img src="https://i.postimg.cc/3N7gxy62/E5-EC0-AAE-FBAB-4750-8-ED8-3624-C3999655.png" alt="TROLL CSFD"> 
  </a>

  <a class="button" href="trolledna.html">
    <img src="https://i.postimg.cc/Rh0jgXCs/9495-D555-9425-4-D51-8-E6-C-789131806009.png" alt="TROLL EDNA">
  </a>

</body>
</html>
