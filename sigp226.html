<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIG SAUER P226</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0A1624;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        img {
            width: 300px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .specs {
            background-color: #102C4A;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            width: 80%;
            max-width: 400px;
        }

        .specs p {
            margin: 10px 0;
            font-size: 16px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #6CFF47;
            margin: 20px 0;
        }

        .cart-button {
            padding: 12px 30px;
            background-color: #6CFF47;
            color: #0A1624;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }

        .cart-button:hover {
            background-color: #5BCC40;
        }
    </style>
</head>
<body>

    <!-- Názov modelu -->
    <h1>SIG SAUER P226</h1>

    <!-- Obrázok -->
    <img src="https://i.postimg.cc/Jhs9nwRW/IMG-7646.jpg" alt="SIG SAUER P226">

    <!-- Technické údaje -->
    <div class="specs">
        <p><strong>Kaliber:</strong> 9x19 mm</p>
        <p><strong>Kapacita zásobníka:</strong> 15 nábojov</p>
        <p><strong>Dĺžka hlavne:</strong> 112 mm</p>
        <p><strong>Hmotnosť:</strong> 870 g</p>
    </div>

    <!-- Cena -->
    <div class="price">Cena: 620 €</div>

    <!-- Tlačidlo Pridať do košíka -->
    <button class="cart-button">Pridať do košíka</button>

</body>
</html>
