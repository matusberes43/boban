<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blcha - Filmová databáza</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #3b0b17, #102d4a);
        }

        header {
            width: 100%;
            padding: 15px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            flex-wrap: wrap; /* Zajistí zalamování obsahu na menších displejích */
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        header nav {
            flex: 1;
            display: flex;
            justify-content: flex-end;
        }

        header nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        header nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 1rem;
            transition: color 0.3s;
        }

        header nav ul li a:hover {
            color: #ffcc00;
        }

        .container {
            text-align: center;
            margin-top: 120px; /* Posunutí kvůli fixnímu headeru */
            padding: 20px;
        }

        .container h1 {
            font-size: 4rem;
            font-weight: bold;
        }

        .container p {
            font-size: 1.5rem;
        }

        .icon {
            display: inline-block;
            margin-left: 10px;
            width: 30px;
            height: 30px;
            border: 2px solid white;
            border-radius: 5px;
            position: relative;
        }

        .icon::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 6px;
            width: 18px;
            height: 12px;
            border: 2px solid white;
        }

        /* MEDIA QUERIES */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            header nav ul {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            header nav ul li a {
                font-size: 1.2rem;
            }

            .container h1 {
                font-size: 3rem;
            }

            .container p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Blcha.com</div>
        <nav>
            <ul>
                <li><a href="#home">Domů</a></li>
                <li><a href="#movies">Filmy</a></li>
                <li><a href="#contact">Kontakt</a></li>
            </ul>
        </nav>
    </header>
    <div class="container">
        <h1>blcha.com</h1>
        <p>filmová databáza filmov <span class="icon"></span></p>
    </div>
</body>
</html>
