<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Modern Header</title>
</head>
<body>
    <header class="header">
        <!-- Left Section (Menu Icon) -->
        <div class="left-section">
            <i class="fas fa-bars menu-icon" aria-label="Menu"></i>
        </div>

        <!-- Center Logo -->
        <div class="logo">
            <img src="https://i.postimg.cc/VLP3mtXR/IMG-7653.png" alt="Company Logo">
        </div>

        <!-- Right Section (Cart and Login Icons) -->
        <div class="right-section">
            <i class="fas fa-shopping-cart cart-icon" aria-label="Shopping Cart"></i>
            <i class="fas fa-user login-icon" aria-label="User Login"></i>
        </div>
    </header>
</body>
</html>
