<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHAGUNS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0A1624;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container, .form-container {
            display: none;
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .container.active, .form-container.active {
            display: block;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            margin-bottom: 20px;
        }

        .categories p {
            font-size: 18px;
            margin: 10px 0;
            cursor: pointer;
        }

        .buttons a {
            display: inline-block;
            padding: 12px 35px;
            margin: 10px 5px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            color: #0A1624;
        }

        .join-button {
            background-color: #6CFF47;
        }

        .login-button {
            background-color: transparent;
            border: 2px solid #6CFF47;
            color: #ffffff;
        }

        .back-arrow {
            font-size: 24px;
            cursor: pointer;
            color: #ffffff;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Hlavná stránka -->
    <div class="container active" id="main-container">
        <h1>BLCHAGUNS</h1>
        <div class="categories">
            <p>PIŠTOLE</p>
            <p>ÚTOČNÉ PUŠKY</p>
            <p>ODSTREĽOVACIE PUŠKY</p>
            <p>REVOLVERY</p>
            <p>BROKOVNICE</p>
            <p>VZDUCHOVÉ ZBRANE</p>
            <p>PRÍSLUŠENSTVO</p>
        </div>
        <div class="buttons">
            <a href="#" class="join-button" onclick="showForm()">Join The Club</a>
            <a href="#" class="login-button">Login</a>
        </div>
    </div>

    <!-- Formulár na registráciu -->
    <div class="form-container" id="form-container">
        <div class="back-arrow" onclick="goBack()">&#8592; Späť</div>
        <h1>Create an Account</h1>
        <p>Formulár sa zobrazí tu...</p>
    </div>

    <!-- JavaScript -->
    <script>
        function showForm() {
            document.getElementById('main-container').classList.remove('active');
            document.getElementById('form-container').classList.add('active');
        }

        function goBack() {
            document.getElementById('form-container').classList.remove('active');
            document.getElementById('main-container').classList.add('active');
        }
    </script>

</body>
</html>
