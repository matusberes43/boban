<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Názov Vašej Stránky</title>
    <style>
        header {
            background-color: #f8f9fa;
            padding: 20px 0;
            text-align: center;
        }
        .logo {
            max-width: 200px; /* Alebo iná veľkosť, ktorá vyhovuje vášmu dizajnu */
            height: auto;
        }
        @media (max-width: 768px) {
            .logo {
                max-width: 150px; /* Zmenšená veľkosť loga na mobilných zariadeniach */
            }
        }
    </style>
</head>
<body>
    <header>
        <img class="logo" src="https://i.postimg.cc/tCkKBDNQ/IMG-7627.png" alt="Logo">
    </header>
</body>
</html>
