<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmová Databáza</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto p-4">
        <!-- Nadpis -->
        <h1 class="text-4xl font-bold text-center mb-8">Filmová Databáza</h1>

        <!-- Formulár na pridanie filmu -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-2xl font-semibold mb-4">Pridaj film</h2>
            <form id="addMovieForm" class="space-y-4">
                <input type="text" id="title" placeholder="Názov filmu" class="w-full p-2 border border-gray-300 rounded-lg" required>
                <input type="number" id="year" placeholder="Rok výroby" class="w-full p-2 border border-gray-300 rounded-lg" required>
                <input type="text" id="genre" placeholder="Žáner" class="w-full p-2 border border-gray-300 rounded-lg" required>
                <input type="number" id="rating" placeholder="Hodnotenie (0-10)" min="0" max="10" step="0.1" class="w-full p-2 border border-gray-300 rounded-lg" required>
                <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600">Pridať film</button>
            </form>
        </div>

        <!-- Filtre -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-2xl font-semibold mb-4">Filtre</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <input type="number" id="filterYearFrom" placeholder="Rok od" class="p-2 border border-gray-300 rounded-lg">
                <input type="number" id="filterYearTo" placeholder="Rok do" class="p-2 border border-gray-300 rounded-lg">
                <input type="text" id="filterGenre" placeholder="Žáner" class="p-2 border border-gray-300 rounded-lg">
                <input type="number" id="filterRating" placeholder="Hodnotenie od" min="0" max="10" step="0.1" class="p-2 border border-gray-300 rounded-lg">
            </div>
            <button id="applyFilters" class="mt-4 w-full bg-green-500 text-white p-2 rounded-lg hover:bg-green-600">Aplikovať filtre</button>
        </div>

        <!-- Zoznam filmov -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-2xl font-semibold mb-4">Zoznam filmov</h2>
            <div id="movieList" class="space-y-4">
                <!-- Tu sa zobrazia filmy -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
