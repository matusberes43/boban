<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Stock Prices in Real-Time</title>
</head>
<body>
    <h1>Real-Time Stock Prices</h1>
    <table>
        <thead>
            <tr>
                <th>Stock</th>
                <th>Current Price ($)</th>
                <th>Change from Previous Day</th>
            </tr>
        </thead>
        <tbody id="stock-data">
            <tr>
                <td>Albemarle (ALB)</td>
                <td id="alb-price">Loading...</td>
                <td id="alb-change">Loading...</td>
            </tr>
            <tr>
                <td>Nvidia (NVDA)</td>
                <td id="nvda-price">Loading...</td>
                <td id="nvda-change">Loading...</td>
            </tr>
            <tr>
                <td>Lam Research (LRCX)</td>
                <td id="lrcx-price">Loading...</td>
                <td id="lrcx-change">Loading...</td>
            </tr>
        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
