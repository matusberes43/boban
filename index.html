<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNISHER Race Countdown</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #e10600;
            padding: 15px;
        }

        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
        }

        .menu-icon div {
            height: 4px;
            background-color: white;
            border-radius: 5px;
        }

        .menu-icon div:nth-child(1){ width: 26px; }
        .menu-icon div:nth-child(2){ width: 32px; }
        .menu-icon div:nth-child(3){ width: 20px; }

        .logo-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: white;
            letter-spacing: 3px;
        }

        .profile-icon {
            background-color: #15171c;
            border-radius: 8px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-icon svg {
            width: 24px;
            height: 24px;
            stroke: white;
            stroke-width: 2px;
            fill: none;
        }

        .race-section {
            background: linear-gradient(135deg, #181818, #242424);
            padding: 20px;
            border-radius: 15px;
            margin: 20px;
            color: white;
            font-family: 'Orbitron', sans-serif;
        }

        .race-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .race-header .date {
            font-size: 16px;
            letter-spacing: 1px;
        }

        .location {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .location svg {
            width: 28px;
            height: 28px;
            stroke: white;
            fill: none;
        }

        .countdown {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            font-size: 32px;
        }

        .countdown-box div span{
            font-size: 12px;
            color: #aaa;
        }

        .sponsor-logo img{
            height: 45px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="menu-icon">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="logo-text">PUNISHER</div>
        <div class="profile-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3" stroke-width="2"></circle>
                <path d="M5.5 21a6.5 6.5 0 0113 0" stroke-width="2" fill="none"></path>
            </svg>
        </div>
    </nav>

    <div class="race-header race-info race-section">
        <div class="date">14 - 16 MAR</div>
        <div class="location">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l-1 6m9-6l-1 6m1-12a6 6 0 11-12 0 6 6 0 0112 0z" />
            </svg>
            <span>AUSTRALIA 2025</span>
        </div>
    </nav>

    <div class="race-header race-info">
        <span class="date">14 - 16 MAR</span>
    </div>

    <div class="race-header race-main">
        <div class="location">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21C8 16 5 13 5 9a7 7 0 1114 0c0 5-7 11-7 11s-7-6-7-11z"></path>
            </svg>
            <span>AUSTRALIA <b>2025</b></span>
        </div>
    </div>

    <div class="race-header race-countdown race-info">
        <div class="race-info grand-prix-box">
            <div class="grand-prix-title">GRAND PRIX WEEKEND</div>
            <div class="countdown">
                <div>07<span>HRS</span></div>
                <div>07<span>MINS</span></div>
                <div>21<span>SECS</span></div>
            </div>
            <div class="sponsor-logo">
                <img src="tag-heuer-logo.png" alt="TAG Heuer">
            </div>
    </div>

</body>
</html>
