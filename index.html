<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHAGUNS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0A1624;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .logo h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            letter-spacing: 3px;
            color: #ffffff;
            cursor: pointer;
        }

        .logo .rival {
            color: #6CFF47;
        }

        .categories p {
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            margin: 10px 0;
            cursor: pointer;
            transition: color 0.3s;
        }

        .categories p:hover {
            color: #6CFF47;
        }

        .buttons {
            margin-top: 50px;
        }

        .join-button, .login-button {
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
            color: #0A1624;
        }

        .join-button {
            background-color: #6CFF47;
        }

        .login-button {
            background-color: transparent;
            border: 2px solid #6CFF47;
            color: #ffffff;
        }

        /* Formulár na registráciu */
        .form-container {
            display: none;
            background-color: #0E2436;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            margin-top: 20px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #102C4A;
            border: none;
            border-radius: 5px;
            color: #ffffff;
        }

        .sign-up-button {
            width: 100%;
            padding: 15px;
            background-color: #6CFF47;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            color: #0A1624;
            cursor: pointer;
        }

        .back-arrow {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            color: #ffffff;
            cursor: pointer;
        }

        .back-arrow:hover {
            color: #6CFF47;
        }
    </style>
</head>
<body>
    <!-- Hlavná stránka -->
    <div class="container" id="main-container">
        <!-- Logo -->
        <div class="logo" onclick="reloadPage()">
            <h1><span class="grid">BLCHA</span><span class="rival">GUNS</span></h1>
        </div>

        <!-- Categories -->
        <div class="categories">
            <p>PIŠTOLE</p>
            <p>ÚTOČNÉ PUŠKY</p>
            <p>ODSTREĽOVACIE PUŠKY</p>
            <p>REVOLVERY</p>
            <p>BROKOVNICE</p>
            <p>VZDUCHOVÉ ZBRANE</p>
            <p>PRÍSLUŠENSTVO</p>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <a href="#" class="join-button" onclick="showForm()">Join The Club</a>
            <a href="#" class="login-button">Login</a>
        </div>
    </div>

    <!-- Formulár na registráciu -->
    <div class="form-container" id="form-container">
        <div class="back-arrow" onclick="goBack()">&#8592;</div>
        <h2>Create an Account</h2>
        <input type="text" placeholder="Choose a Username">
        <input type="email" placeholder="Enter Your Email Address">
        <input type="password" placeholder="Create a Password">
        <div class="sign-up-button">Sign Up</div>
    </div>

    <!-- JavaScript -->
    <script>
        // Znova načíta stránku po kliknutí na logo
        function reloadPage() {
            location.reload();
        }

        // Zobrazí formulár
        function showForm() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
        }

        // Vráti sa späť na hlavnú stránku
        function goBack() {
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
        }
    </script>
</body>
</html>
