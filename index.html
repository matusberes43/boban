  <style>
    :root {
      --primary-color: #1b1b1b;
      --accent-color: #2ecc71;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
      --background-dark: #252525;
      --text-light: #f0f0f0;
      --surface-dark: #2d2d2d;
      --border-dark: #3d3d3d;
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s ease;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--background-dark);
      color: var(--text-light);
      -webkit-user-select: none;
      user-select: none;
      height: 100%;
      overflow: auto;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .fixed-header {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: var(--surface-dark);
      border-bottom: 1px solid var(--border-dark);
      z-index: 999;
      position: relative; /* Pre centrovanie loga */
    }

    #menu-toggle {
      width: 1.5rem;
      height: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    #menu-toggle .bar {
      height: 3px;
      width: 100%;
      background-color: var(--text-light);
      border-radius: 2px;
      transition: var(--transition);
    }

    #menu-toggle.active .top {
      transform: rotate(45deg) translateY(7px);
    }

    #menu-toggle.active .middle {
      opacity: 0;
    }

    #menu-toggle.active .bottom {
      transform: rotate(-45deg) translateY(-7px);
    }

    #dropdown-menu {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      border-radius: 0 0 8px 8px;
      padding: 0.5rem 0;
      box-shadow: var(--shadow);
      z-index: 99;
      display: none;
      text-align: center;
    }

    #dropdown-menu.show {
      display: block;
    }

    #dropdown-menu a.menu-item {
      display: block;
      padding: 0.75rem 1rem;
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    #dropdown-menu a.menu-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%); /* Centrovanie na stred */
      width: 1.5rem;
      height: 1.5rem;
      background: url('https://i.postimg.cc/gJ703r3c/4-A743648-AE6-C-41-F1-9107-B9-C127-F43977.png') no-repeat center;
      background-size: contain;
    }

    .search-icon {
      width: 1.5rem;
      height: 1.5rem;
      cursor: pointer;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23f0f0f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>') no-repeat center;
      background-size: contain;
      transition: transform 0.3s ease;
    }

    .search-icon:hover {
      transform: scale(1.1);
    }

    #search-container {
      display: none;
      padding: 0.5rem;
      background: var(--surface-dark);
      border-bottom: 1px solid var(--border-dark);
      width: 100%;
      box-sizing: border-box;
    }

    #search-container.show {
      display: block;
    }

    #searchInput {
      padding: 0.5rem;
      font-size: 1rem;
      width: 100%;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background: var(--background-dark);
      color: var(--text-light);
      transition: var(--transition);
      box-sizing: border-box;
    }

    #searchInput:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2);
    }

    .search-legend-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0.5rem;
      background: var(--surface-dark);
      border-bottom: 1px solid var(--border-dark);
    }

    .legend {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .legend-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-light);
    }

    .legend-square {
      width: 0.8rem;
      height: 0.8rem;
      border-radius: 4px;
    }

    .legend-square.danger {
      background-color: var(--danger-color);
      animation: pulse 1.5s infinite;
    }

    .legend-square.warning {
      background-color: var(--warning-color);
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    @keyframes heartbeat {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .user-list {
      padding: 0.5rem;
    }

    .user-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-dark);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      transition: transform 0.2s ease;
    }

    .user-card:hover {
      transform: translateY(-2px);
    }

    .user-card.punisher {
      background: #1a3c34;
      border: 1px solid var(--accent-color);
      box-shadow: 0 0 5px rgba(46, 204, 113, 0.3);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .user-info .flag {
      font-size: 1rem;
    }

    .user-info .username {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .user-stats {
      text-align: right;
      font-size: 0.8rem;
    }

    .user-stats .reviews {
      font-weight: 600;
      color: var(--accent-color);
    }

    .user-stats .countdown {
      color: var(--text-light);
    }

    .urgent-countdown {
      color: var(--danger-color);
      font-weight: 700;
      animation: heartbeat 1s infinite; /* Blikanie ako tlkot srdca */
    }

    .month-warning .countdown {
      color: var(--warning-color);
      animation: pulse 2.5s infinite; /* Oranžové blikanie */
    }

    .phantom-card {
      opacity: 0.6;
      font-style: italic;
    }

    .progress-form {
      padding: 0.5rem;
      background: var(--surface-dark);
      border-top: 1px solid var(--border-dark);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 0.5rem;
    }

    .form-group label {
      font-size: 0.75rem;
      margin-bottom: 0.25rem;
      color: var(--text-light);
    }

    .form-group input {
      padding: 0.4rem;
      font-size: 0.9rem;
      border: 1px solid var(--border-dark);
      border-radius: 4px;
      background: var(--background-dark);
      color: var(--text-light);
      width: 100%;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2);
    }

    #simulationResult {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: var(--accent-color);
      text-align: center;
    }

    @media (max-width: 480px) {
      .fixed-header {
        padding: 0.5rem;
      }

      #dropdown-menu {
        top: 40px;
      }

      .legend-item {
        font-size: 0.65rem;
      }

      .legend-square {
        width: 0.6rem;
        height: 0.6rem;
      }

      .user-card {
        padding: 0.5rem;
      }

      .user-info .username {
        font-size: 0.8rem;
      }

      .user-stats {
        font-size: 0.7rem;
      }

      .form-group input {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

    function renderList() {
      const userList = document.getElementById("userList");
      userList.innerHTML = "";
      const sortedData = [...data].sort((a, b) => b.reviews - a.reviews);
      sortedData.forEach((user, index) => {
        const card = document.createElement("div");
        card.className = `user-card ${user.daysToOvertake <= 30 ? 'month-warning' : ''} ${user.username === "PunisherEDNA" ? 'punisher' : ''}`;
        card.innerHTML = `
          <div class="user-info">
            <span class="flag">${user.flag}</span>
            <span class="username">${user.username}</span>
          </div>
          <div class="user-stats">
            <div class="reviews">${user.reviews}</div>
            <div class="countdown" id="countdown-${index + 1}" data-target-date="${user.overtakeDate}"></div>
          </div>`;
        userList.appendChild(card);
      });
      updateSimulation();
    }

    function filterList() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.querySelectorAll(".user-card");
      cards.forEach(card => {
        const username = card.querySelector(".username").textContent.toLowerCase();
        card.style.display = username.includes(input) ? "flex" : "none";
      });
    }

    function updateAllCountdowns() {
      document.querySelectorAll("[id^=countdown]").forEach(span => {
        const targetDate = span.dataset.targetDate;
        const target = new Date(targetDate);
        const now = new Date();
        const diff = target - now;
        const card = span.closest(".user-card");

        // Odstránenie predchádzajúcich tried
        card.classList.remove("month-warning");
        span.classList.remove("urgent-countdown", "prekonan");

        if (diff <= 0) {
          span.innerText = "Překročen!";
          span.classList.add("prekonan");
          return;
        }

        // 24-hodinový odpočet
        if (diff <= 24 * 60 * 60 * 1000) {
          span.classList.add("urgent-countdown");
        }
        // Do 1 mesiaca
        else if (diff <= 30 * 24 * 60 * 60 * 1000) {
          card.classList.add("month-warning");
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        span.innerText = `${days}d ${hours}h ${minutes}m`;
      });
    }
    setInterval(updateAllCountdowns, 1000);

    function toggleMenu() {
      const toggle = document.getElementById('menu-toggle');
      const menu = document.getElementById('dropdown-menu');
      toggle.classList.toggle('active');
      menu.classList.toggle('show');
    }

    function toggleSearch() {
      const searchContainer = document.getElementById('search-container');
      searchContainer.classList.toggle('show');
    }

    function updateSimulation() {
      const days = parseInt(document.getElementById("days").value) || 0;
      const dailyReviews = parseInt(document.getElementById("dailyReviews").value) || 0;
      const extraReviews = parseInt(document.getElementById("extraReviews").value) || 0;
      const currentUser = data.find(u => u.username === "PunisherEDNA");

      if (!currentUser) return;

      let projectedReviews = currentUser.reviews + extraReviews + (days * dailyReviews);
      const userList = document.getElementById("userList");
      const sortedData = [...data].sort((a, b) => b.reviews - a.reviews);

      // Odstránenie predchádzajúceho fantómového zobrazenia
      const existingPhantom = document.querySelector(".phantom-card");
      if (existingPhantom) existingPhantom.remove();

      // Vyhľadanie správnej pozície pre fantóma
      let insertIndex = sortedData.findIndex(user => user.reviews < projectedReviews);
      if (insertIndex === -1) insertIndex = sortedData.length;

      // Vytvorenie a vloženie fantómového zobrazenia na správne miesto
      const phantomCard = document.createElement("div");
      phantomCard.className = "user-card phantom-card";
      phantomCard.innerHTML = `
        <div class="user-info">
          <span class="flag">${currentUser.flag}</span>
          <span class="username">${currentUser.username} (Fantóm)</span>
        </div>
        <div class="user-stats">
          <div class="reviews">${projectedReviews}</div>
          <div class="countdown">Odhad po ${days} dnech</div>
        </div>`;
      if (insertIndex < sortedData.length) {
        userList.insertBefore(phantomCard, userList.children[insertIndex]);
      } else {
        userList.appendChild(phantomCard);
      }

      // Výsledok simulace
      const result = document.getElementById("simulationResult");
      const position = insertIndex + 1;
      result.textContent = `Za ${days} dní s tempem ${dailyReviews} recenzí denně a ${extraReviews} extra recenzemi budeš mít ${projectedReviews} recenzí a umístíš se na ${position}. místě.`;
    }

    document.querySelectorAll(".progress-form input").forEach(input => {
      input.addEventListener("input", updateSimulation);
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderList();
      document.querySelectorAll('#dropdown-menu a').forEach(link => {
        link.addEventListener('click', () => {
          document.getElementById('menu-toggle').classList.remove('active');
          document.getElementById('dropdown-menu').classList.remove('show');
        });
      });

      window.addEventListener('scroll', () => {
        const menu = document.getElementById('dropdown-menu');
        const toggle = document.getElementById('menu-toggle');
        if (menu.classList.contains('show')) {
          menu.classList.remove('show');
          toggle.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
