<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Žebříček recenzentů</title>
  <style>
    /* CSS proměnné */
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #48bb78;
      --danger-color: #f56565;
      --warning-color: #f6ad55;
      --background-dark: #0f172a;
      --text-dark: #f8fafc;
      --surface-dark: #1e293b;
      --border-dark: #334155;
      --shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      --transition: all 0.3s ease;
    }

    /* Obecné štýly */
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background-dark);
      color: var(--text-dark);
      margin: 0;
      padding: 2rem;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text-dark);
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-dark);
    }

    .search-legend-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      background: var(--surface-dark);
      padding: 1rem;
      border-radius: 8px;
    }

    #searchInput, #countryFilter {
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
      max-width: 20rem;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background: var(--surface-dark);
      color: var(--text-dark);
      transition: var(--transition);
    }

    #countryFilter {
      max-width: 10rem;
    }

    #searchInput:focus, #countryFilter:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.2);
    }

    .legend {
      display: flex;
      gap: 1rem;
      align-items: center;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-square {
      width: 1rem;
      height: 1rem;
      border-radius: 4px;
    }

    .legend-square.month-warning {
      animation: softPulseMonth 2.5s ease-in-out infinite;
    }

    .table-wrapper {
      width: 100%;
      max-width: 80rem;
      margin: 0 auto;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface-dark);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: center;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border-dark);
      height: 48px;
    }

    thead {
      background: var(--primary-color);
      color: #ffffff;
    }

    th {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr {
      transition: background-color 0.3s ease;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .rank {
      display: inline-block;
      width: 30px;
      text-align: center;
      color: #94a3b8;
      font-weight: 500;
    }

    .punisher-row {
      background: linear-gradient(90deg, #ca8a04, #facc15);
      font-weight: 600;
      color: #1e293b;
    }

    .phantom-row {
      background: rgba(148, 163, 184, 0.2);
      font-style: italic;
      opacity: 0.8;
      border: 1px dashed #94a3b8;
    }

    .urgent-countdown {
      color: var(--danger-color);
      font-weight: 700;
    }

    @keyframes softPulseMonth {
      0%, 100% { background-color: transparent; }
      50% { background-color: rgba(246, 173, 85, 0.3); }
    }

    .month-warning {
      animation: softPulseMonth 2.5s ease-in-out infinite;
    }

    .tooltip {
      position: relative;
    }

    .tooltip .tooltip-text {
      visibility: hidden;
      width: 14rem;
      background: var(--surface-dark);
      color: var(--text-dark);
      text-align: left;
      padding: 0.75rem;
      border-radius: 8px;
      position: absolute;
      z-index: 10;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    .tooltip:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
      transform: translateX(-50%) translateY(-5px);
    }

    .tooltip-text::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: var(--surface-dark) transparent transparent transparent;
    }

    #progress-container,
    #customTargetContainer,
    #phantomForm {
      width: 100%;
      max-width: 40rem;
      margin: 2rem auto;
      text-align: center;
      background: var(--surface-dark);
      padding: 1rem;
      border-radius: 8px;
    }

    .progress-bar-bg {
      background: var(--border-dark);
      border-radius: 1rem;
      height: 1.5rem;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--secondary-color), #81e6d9);
      text-align: right;
      color: #1e293b;
      font-weight: 600;
      padding-right: 0.5rem;
      line-height: 1.5rem;
      transition: width 1s ease-in-out;
    }

    #phantomForm {
      padding: 1.5rem;
    }

    #phantomForm label {
      display: block;
      margin: 0.75rem 0 0.25rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    #phantomForm input,
    #phantomForm select {
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
      max-width: 15rem;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background: var(--surface-dark);
      color: var(--text-dark);
      transition: var(--transition);
    }

    #phantomForm input:focus,
    #phantomForm select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.2);
    }

    #phantomForm button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    #phantomForm button:hover {
      background: #1e40af;
    }

    #phantomResult {
      margin-top: 1rem;
      font-size: 1rem;
      color: var(--text-dark);
    }

    .flag {
      margin-right: 0.5rem;
      font-size: 1rem;
      vertical-align: middle;
    }

    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 1.75rem;
      }

      .search-legend-container {
        flex-direction: column;
        gap: 1rem;
      }

      #searchInput, #countryFilter {
        max-width: 100%;
      }

      .legend {
        justify-content: center;
      }

      .tooltip .tooltip-text {
        width: 12rem;
        font-size: 0.875rem;
      }

      #phantomForm input,
      #phantomForm select {
        max-width: 100%;
      }

      th, td {
        padding: 0.75rem;
        font-size: 0.875rem;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }

      th, td {
        padding: 0.5rem;
        font-size: 0.8rem;
      }
    }

    @keyframes slideIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    tr {
      animation: slideIn 0.5s ease forwards;
      animation-delay: calc(var(--row-index) * 0.05s);
    }
  </style>
</head>
<body>
  <h1>Žebříček recenzentů s živým odpočtem</h1>

  <div class="search-legend-container">
    <input type="text" id="searchInput" placeholder="Hledej uživatele..." onkeyup="filterTable()">
    <select id="countryFilter" onchange="filterTable()">
      <option value="all">Všichni</option>
      <option value="cz">Česko</option>
      <option value="sk">Slovensko</option>
    </select>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-square" style="background-color: #f56565;"></div>
        <span>Překonání do 24 hodin</span>
      </div>
      <div class="legend-item">
        <div class="legend-square month-warning"></div>
        <span>Překonání do 1 měsíce</span>
      </div>
    </div>
  </div>

  <div class="table-wrapper">
    <table id="reviewTable">
      <thead>
        <tr>
          <th scope="col">Pořadí</th>
          <th scope="col">Uživatel</th>
          <th scope="col">Počet recenzí</th>
          <th scope="col">Dní do překonání</th>
          <th scope="col">Datum překonání</th>
          <th scope="col">Odpočet</th>
        </tr>
      </thead>
      <tbody>
        <!-- Sem doplníte svůj seznam uživatelů s vlaječkami -->
      </tbody>
    </table>
  </div>

  <div id="customTargetContainer">
    <label for="userSelect"><strong>Porovnat se s uživatelem:</strong></label>
    <select id="userSelect" onchange="updateCustomProgress()">
      <option value="">– Vyber uživatele –</option>
    </select>
    <div id="custom-progress-wrapper" style="display:none; margin-top: 15px;">
      <p><span id="custom-progress-text"></span></p>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="custom-progress-bar"></div>
      </div>
    </div>
  </div>

  <div id="progress-container">
    <p><strong>Postup k 1. místu:</strong> <span id="progress-text"></span></p>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <div id="phantomForm">
    <h2>Simulace postupu PunisherEDNA</h2>
    <label for="dailyReviews">Denní přírůstek recenzí:</label>
    <input type="number" id="dailyReviews" min="1" value="40" placeholder="např. 50">
    <label for="simulationDays">Počet dní simulace:</label>
    <input type="number" id="simulationDays" min="1" value="30" placeholder="např. 30">
    <label for="targetUser">Cílový uživatel (nepovinné):</label>
    <select id="targetUser">
      <option value="">– Vyber uživatele –</option>
    </select>
    <button onclick="showPhantomRow()">Spustit simulaci</button>
    <div id="phantomResult"></div>
    <div id="phantom-progress-wrapper" style="display:none; margin-top: 15px;">
      <p><span id="phantom-progress-text"></span></p>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="phantom-progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Mapování uživatelů na země
    const userCountries = {

      "Xmilden": "Česko",

      "pornogrind": "Česko",
      "xxmartinxx": "Česko",
      "brasek": "Slovensko",
      "PunisherEDNA": "Česko",
      "Kimkong": "Česko",
      "rakovnik": "Česko",
      "BOURQUE": "Slovensko",
      "bohemia_regent": "Česko",
      "Hanys_": "Česko",
      "Fr": "Česko",
      "dr.fish": "Česko",
      "Wacoslav1": "Česko",
      "EvilPhoEniX": "Česko",
      "bourec": "Česko",
      "Aljak": "Slovensko",
      "Rathalos": "Slovensko",
      "Radko": "Slovensko",
      "blondboss": "Slovensko"
    };

    // Funkce pro získání vlaječky podle země
    function getFlag(username) {
      const country = userCountries[username] || "Svět";
      switch (country) {
        case "Česko":
          return '<span class="flag">🇨🇿</span>';
        case "Slovensko":
          return '<span class="flag">🇸🇰</span>';
        default:
          return '<span class="flag">🌍</span>';
      }
    }

    // Výpočet aktuálních recenzí PunisherEDNA
    const startDate = new Date("2025-05-04");
    const initialReviews = 4689;
    const dailyGain = 40;
    const today = new Date();
    const daysSinceStart = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
    const currentPunisherReviews = initialReviews + daysSinceStart * dailyGain;

    // Odpočet
    function updateAllCountdowns() {
      document.querySelectorAll("[id^=countdown]").forEach(span => {
        const targetDate = span.dataset.targetDate;
        const target = new Date(targetDate);
        const now = new Date();
        const diff = target - now;
        const row = span.closest("tr");

        row.classList.remove("month-warning");
        span.classList.remove("urgent-countdown", "prekonan");

        if (diff <= 0) {
          span.innerText = "Překonán!";
          span.classList.add("prekonan");
          return;
        }

        if (diff <= 24 * 60 * 60 * 1000) {
          span.classList.add("urgent-countdown");
        } else if (diff <= 30 * 24 * 60 * 60 * 1000) {
          row.classList.add("month-warning");
        }

        const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30));
        const days = Math.floor(diff / (1000 * 60 * 60 * 24)) % 30;
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);
        span.innerText = `${months}m ${days}d ${hours}h ${minutes}m ${seconds}s`;
      });
    }
    setInterval(updateAllCountdowns, 1000);

    // Filtrování a řazení tabulky
    function filterTable() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const countryFilter = document.getElementById("countryFilter").value;
      const table = document.querySelector("#reviewTable tbody");
      let rows = Array.from(table.querySelectorAll("tr:not(.phantom-row)"));

      // Filtrování podle země a vyhledávání
      rows = rows.filter(row => {
        const username = row.cells[1].textContent.replace(/^[🇨🇿🇸🇰🌍]\s*/, '').toLowerCase();
        const userCountry = userCountries[username] || "Svět";
        const matchesSearch = username.includes(input);
        const isPunisher = username === "punisheredna";

        return matchesSearch && (
          countryFilter === "all" ||
          isPunisher ||
          (countryFilter === "cz" && userCountry === "Česko") ||
          (countryFilter === "sk" && userCountry === "Slovensko")
        );
      });

      // Odstranění stávajícího PunisherEDNA
      const existingPunisher = document.querySelector(".punisher-row");
      if (existingPunisher) existingPunisher.remove();

      // Přidání PunisherEDNA na správné místo podle počtu recenzí
      let inserted = false;
      let overtakenCount = 0;
      for (let i = 0; i < rows.length; i++) {
        const reviewCount = parseInt(rows[i].cells[2].textContent);
        if (currentPunisherReviews >= reviewCount) {
          overtakenCount++;
          const newRow = table.insertRow(i);
          newRow.classList.add("punisher-row");
          newRow.innerHTML = `<td><span class="rank">${i + 1}</span></td><td><span class="tooltip">${getFlag("PunisherEDNA")}<a href="2012.html" target="_blank">PunisherEDNA</a><span class="tooltip-text">Počet recenzí: ${currentPunisherReviews}<br>Denní přírůstek: 40<br>Překonáno uživatelů: ${overtakenCount}</span></span></td><td>${currentPunisherReviews}</td><td>0</td><td>dnes</td><td>-</td>`;
          inserted = true;
          break;
        }
      }

      if (!inserted) {
        const newRow = table.insertRow();
        newRow.classList.add("punisher-row");
        newRow.innerHTML = `<td><span class="rank">${rows.length + 1}</span></td><td><span class="tooltip">${getFlag("PunisherEDNA")}<a href="2012.html" target="_blank">PunisherEDNA</a><span class="tooltip-text">Počet recenzí: ${currentPunisherReviews}<br>Denní přírůstek: 40<br>Překonáno uživatelů: ${overtakenCount}</span></span></td><td>${currentPunisherReviews}</td><td>0</td><td>dnes</td><td>-</td>`;
      }

      // Aktualizace pořadí
      Array.from(table.rows).forEach((row, idx) => {
        row.cells[0].textContent = idx + 1;
        row.style.display = "table-row"; // Zajištění zobrazení všech řádků
      });

      // Skrytí nefilrovaných řádků
      rows.forEach(row => {
        const username = row.cells[1].textContent.replace(/^[🇨🇿🇸🇰🌍]\s*/, '').toLowerCase();
        const userCountry = userCountries[username] || "Svět";
        const isPunisher = username === "punisheredna";
        const shouldShow = countryFilter === "all" ||
          isPunisher ||
          (countryFilter === "cz" && userCountry === "Česko") ||
          (countryFilter === "sk" && userCountry === "Slovensko");

        row.style.display = shouldShow ? "table-row" : "none";
      });
    }

    // Famtomový náhled postupu
    function showPhantomRow() {
      const existingPhantom = document.querySelector(".phantom-row");
      if (existingPhantom) existingPhantom.remove();

      const dailyReviews = parseInt(document.getElementById("dailyReviews").value);
      const simulationDays = parseInt(document.getElementById("simulationDays").value);
      const targetUser = document.getElementById("targetUser").value;

      if (!dailyReviews || dailyReviews < 1) {
        document.getElementById("phantomResult").innerText = "Zadej platný počet recenzí za den.";
        return;
      }
      if (!simulationDays || simulationDays < 1) {
        document.getElementById("phantomResult").innerText = "Zadej platný počet dní simulace.";
        return;
      }

      const phantomReviews = currentPunisherReviews + dailyReviews * simulationDays;
      let targetUserReviews = 23872; // Počet recenzí prvního uživatele (corpSy)
      let targetUserName = "corpSy";
      let targetPosition = 1;

      if (targetUser) {
        const rows = Array.from(document.querySelectorAll("#reviewTable tbody tr:not(.phantom-row)"));
        for (let i = 0; i < rows.length; i++) {
          const name = rows[i].cells[1].textContent.replace(/^[🇨🇿🇸🇰🌍]\s*/, '').trim();
          if (name === targetUser) {
            targetUserReviews = parseInt(rows[i].cells[2].textContent);
            targetUserName = name;
            targetPosition = i + 1;
            break;
          }
        }
      }

      const daysToTarget = Math.ceil((targetUserReviews - currentPunisherReviews) / dailyReviews);

      let phantomPosition = 1;
      let inserted = false;
      const rowsFiltered = Array.from(document.querySelectorAll("#reviewTable tbody tr:not(.phantom-row)"));
      for (let i = 0; i < rowsFiltered.length; i++) {
        const reviewCount = parseInt(rowsFiltered[i].cells[2].textContent);
        if (phantomReviews >= reviewCount) {
          const newRow = document.querySelector("#reviewTable tbody").insertRow(i);
          newRow.classList.add("phantom-row");
          newRow.innerHTML = `<td><span class="rank">${i + 1}</span></td><td><span class="tooltip">${getFlag("PunisherEDNA")}PunisherEDNA (simulace)<span class="tooltip-text">Simulovaný počet recenzí: ${phantomReviews}<br>Denní přírůstek: ${dailyReviews}<br>Simulováno pro ${simulationDays} dní</span></span></td><td>${phantomReviews}</td><td>-</td><td>-</td><td>-</td>`;
          inserted = true;
          phantomPosition = i + 1;
          break;
        }
      }

      if (!inserted) {
        const newRow = document.querySelector("#reviewTable tbody").insertRow();
        newRow.classList.add("phantom-row");
        newRow.innerHTML = `<td><span class="rank">${rowsFiltered.length + 1}</span></td><td><span class="tooltip">${getFlag("PunisherEDNA")}PunisherEDNA (simulace)<span class="tooltip-text">Simulovaný počet recenzí: ${phantomReviews}<br>Denní přírůstek: ${dailyReviews}<br>Simulováno pro ${simulationDays} dní</span></span></td><td>${phantomReviews}</td><td>-</td><td>-</td><td>-</td>`;
        phantomPosition = rowsFiltered.length + 1;
      }

      Array.from(document.querySelectorAll("#reviewTable tbody tr")).forEach((row, idx) => {
        row.cells[0].textContent = idx + 1;
      });

      let resultText = `S ${dailyReviews} recenzemi denně bys za ${simulationDays} dní měl ${phantomReviews} recenzí a byl bys na ${phantomPosition}. místě.\n`;
      if (phantomReviews >= targetUserReviews) {
        resultText += `Už bys překonal ${targetUserName}!`;
      } else {
        resultText += `Překonáš ${targetUserName} (pozice ${targetPosition}) za ${daysToTarget} dní.`;
      }
      document.getElementById("phantomResult").innerText = resultText;

      const percent = Math.min(100, ((phantomReviews / targetUserReviews) * 100).toFixed(2));
      const remaining = targetUserReviews - phantomReviews;
      const wrapper = document.getElementById("phantom-progress-wrapper");
      const textEl = document.getElementById("phantom-progress-text");
      const barEl = document.getElementById("phantom-progress-bar");

      wrapper.style.display = "block";
      if (remaining <= 0) {
        textEl.textContent = `Překonal jsi ${targetUserName}!`;
        textEl.style.color = "red";
        textEl.style.fontWeight = "bold";
        barEl.style.width = "100%";
      } else {
        textEl.textContent = `${phantomReviews} z ${targetUserReviews} recenzí (${percent} %) — zbývá ${remaining}`;
        textEl.style.color = "";
        textEl.style.fontWeight = "";
        barEl.style.width = percent + "%";
      }
    }

    // Aktualizace progress baru pro postup k 1. místu
    function updateProgressBar() {
      const punisher = currentPunisherReviews;
      const topUser = 23872; // Počet recenzí prvního uživatele (corpSy)
      const remaining = topUser - punisher;
      const percent = Math.min(100, ((punisher / topUser) * 100).toFixed(2));
      document.getElementById("progress-text").textContent = `${punisher} z ${topUser} recenzí (${percent} %) — zbývá ${remaining}`;
      document.getElementById("progress-bar").style.width = percent + "%";
    }
    updateProgressBar();

    // Aktualizace progress baru pro porovnání
    function updateCustomProgress() {
      const select = document.getElementById("userSelect");
      const selectedName = select.value;
      const rows = document.querySelectorAll("#reviewTable tbody tr:not(.phantom-row)");
      let targetReviews = null;

      rows.forEach(row => {
        const name = row.cells[1].textContent.replace(/^[🇨🇿🇸🇰🌍]\s*/, '').trim();
        if (name === selectedName) {
          targetReviews = parseInt(row.cells[2].textContent);
        }
      });

      if (!targetReviews) {
        document.getElementById("custom-progress-wrapper").style.display = "none";
        return;
      }

      const current = currentPunisherReviews;
      const percent = Math.min(100, ((current / targetReviews) * 100).toFixed(2));
      const remaining = targetReviews - current;
      const wrapper = document.getElementById("custom-progress-wrapper");
      const textEl = document.getElementById("custom-progress-text");
      const barEl = document.getElementById("custom-progress-bar");

      wrapper.style.display = "block";
      if (remaining <= 0) {
        textEl.textContent = "Uživatel překonán!";
        textEl.style.color = "red";
        textEl.style.fontWeight = "bold";
        barEl.style.width = "100%";
      } else {
        textEl.textContent = `${current} z ${targetReviews} recenzí (${percent} %) — zbývá ${remaining}`;
        textEl.style.color = "";
        textEl.style.fontWeight = "";
        barEl.style.width = percent + "%";
      }
    }

    // Naplnění dropdownů
    function fillUserDropdown() {
      const select = document.getElementById("userSelect");
      const targetSelect = document.getElementById("targetUser");
      const rows = document.querySelectorAll("#reviewTable tbody tr:not(.phantom-row)");
      select.innerHTML = '<option value="">– Vyber uživatele –</option>';
      targetSelect.innerHTML = '<option value="">– Vyber uživatele –</option>';
      rows.forEach(row => {
        const name = row.cells[1].textContent.replace(/^[🇨🇿🇸🇰🌍]\s*/, '').trim();
        const option = document.createElement("option");
        option.value = name;
        option.innerHTML = `${getFlag(name)}${name}`;
        select.appendChild(option.cloneNode(true));
        targetSelect.appendChild(option);
      });
    }

    // Inicializace
    document.addEventListener("DOMContentLoaded", () => {
      fillUserDropdown();
      filterTable(); // Inicializace filtru
      updateAllCountdowns();
    });
  </script>
</body>
</html>
