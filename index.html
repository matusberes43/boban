<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Modern Header</title>
</head>
<body>
    <header class="header">
        <div class="menu-icon">
            <img src="menu-icon.svg" alt="Menu Icon">
        </div>
        <div class="logo">
            <img src="https://i.postimg.cc/VLP3mtXR/IMG-7653.png" alt="Logo">
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Find by description, model number, SKU, etc...">
            <button>
                <img src="search-icon.svg" alt="Search Icon">
            </button>
        </div>
        <div class="cart-icon">
            <img src="cart-icon.svg" alt="Cart Icon">
        </div>
    </header>
</body>
</html>
