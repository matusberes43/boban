<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNISHER F1 Style</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

        body {
            background-color: #12132D;
            color: white;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .punisher-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 80px;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            letter-spacing: 2px;
        }

        /* Prvé písmeno P ako efekt F1 */
        .punisher-logo span:first-child {
            background: linear-gradient(to right, red 50%, black 50%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Skosenie písmen pre rýchlostný efekt */
        .punisher-logo span {
            display: inline-block;
            transform: skewX(-10deg);
            padding: 0 5px;
        }

        /* Čierna verzia písmen pre druhú časť efektu */
        .punisher-logo span:nth-child(2) {
            color: black;
            text-shadow: -2px -2px 0 red;
        }

        .punisher-logo span:nth-child(3),
        .punisher-logo span:nth-child(4),
        .punisher-logo span:nth-child(5),
        .punisher-logo span:nth-child(6),
        .punisher-logo span:nth-child(7),
        .punisher-logo span:nth-child(8) {
            color: red;
            text-shadow: -2px -2px 0 black;
        }
    </style>
</head>
<body>

    <div class="punisher-logo">
        <span>P</span><span>U</span><span>N</span><span>I</span><span>S</span><span>H</span><span>E</span><span>R</span>
    </div>

</body>
</html>
