<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Blcha vs. Benny — mobilné ovládanie</title>
<style>
  :root{
    --bg:#0f172a; --ground:#1f2937; --ui:#e5e7eb; --muted:#94a3b8;
    --flea:#22d3ee; --obs:#f59e0b; --danger:#ef4444; --benny:#84cc16;
  }
  *{box-sizing:border-box} html,body{height:100%}
  body{
    margin:0; background: radial-gradient(1200px 700px at 70% -10%, #1e293b 0%, #0b1220 40%, var(--bg) 100%);
    color:var(--ui); font:500 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{ width:min(100vw,920px); padding:clamp(12px,2vw,20px); }
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
  .title{font-weight:800; letter-spacing:.3px}
  .hint{font-size:13px;color:var(--muted)}
  .stage{
    position:relative; width:100%; aspect-ratio:16/9; border-radius:16px; overflow:hidden;
    background:linear-gradient(#0b1020 0 55%, #0d1326 55% 100%);
    box-shadow:0 12px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:manipulation; cursor:pointer;
  }
  .sky,.mounts,.ground{position:absolute;left:0;right:0}
  .mounts{bottom:32%;height:20%;
    background:
      radial-gradient(300px 120px at 20% 100%, #1a2440 20%, transparent 60%),
      radial-gradient(260px 90px at 60% 100%, #13203b 20%, transparent 60%),
      radial-gradient(220px 100px at 90% 100%, #152447 20%, transparent 60%);
    opacity:.8; filter:blur(1px);
  }
  .ground{height:33%; bottom:0;
    background:linear-gradient(#162030 0 2px, transparent 2px),
               repeating-linear-gradient(90deg, #223048 0 12px, #1b273d 12px 24px);
    box-shadow: 0 -2px 0 rgba(255,255,255,.05) inset;
  }
  .hud{position:absolute; inset:10px 10px auto auto; display:flex; gap:8px; font-weight:700}
  .badge{padding:6px 10px; border-radius:10px; background:rgba(15,23,42,.6);
         box-shadow:0 0 0 1px rgba(255,255,255,.06) inset}
  .tapBubble{
    position:absolute; inset:auto 0 16% 0; margin:auto; width:max-content;
    padding:10px 14px; border-radius:999px; background:rgba(34,211,238,.12);
    color:#b8eaff; border:1px solid rgba(34,211,238,.35); backdrop-filter:blur(6px);
    animation:ping 1.6s infinite;
    text-align:center;
  }
  @keyframes ping{0%{transform:translateY(0)} 50%{transform:translateY(-2px)} 100%{transform:translateY(0)}}

  /* Blcha */
  .flea{position:absolute; bottom:33%; left:8%; width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #aefaff 0 35%, var(--flea) 36% 100%);
    box-shadow:0 0 0 2px rgba(0,0,0,.25) inset, 0 4px 10px rgba(0,0,0,.35);
    transform:translateY(0)}
  .flea::before,.flea::after{content:""; position:absolute; top:-6px; width:6px; height:8px; border-radius:3px 3px 0 0;
    background:#7dd3fc; box-shadow:0 1px 0 rgba(0,0,0,.2) inset}
  .flea::before{left:2px; transform:rotate(-8deg)} .flea::after{right:2px; transform:rotate(8deg)}
  .flea.hit{outline:3px solid var(--danger)}

  /* Benny */
  .benny{position:absolute; bottom:33%; right:2%; width:90px; height:40px; transform:translateX(0)}
  .benny .body{position:absolute; bottom:6px; left:12px; width:64px; height:26px; border-radius:14px;
    background:linear-gradient(180deg,#a3e635,#65a30d); box-shadow:0 2px 6px rgba(0,0,0,.3) inset}
  .benny .head{position:absolute; bottom:10px; left:-2px; width:26px; height:24px; border-radius:12px;
    background:linear-gradient(180deg,#bef264,#84cc16)}
  .benny .ear{position:absolute; left:2px; top:-6px; width:10px; height:12px; border-radius:6px; background:#4d7c0f}
  .benny .eye{position:absolute; left:10px; top:6px; width:6px; height:6px; border-radius:50%; background:#111; box-shadow:-2px 0 0 0 #fff inset}
  .benny .tail{position:absolute; right:0; bottom:20px; width:14px; height:6px; border-radius:3px; background:#4d7c0f;
    transform-origin:left center; animation:wag .2s infinite alternate}
  @keyframes wag{to{transform:rotate(25deg)}}
  .benny .leg{position:absolute; bottom:0; width:8px; height:10px; border-radius:4px; background:#4d7c0f}
  .benny .leg.l1{left:20px}.benny .leg.l2{left:34px}.benny .leg.l3{left:48px}.benny .leg.l4{left:62px}

  /* Prekážky */
  .obstacle{position:absolute; bottom:33%; width:18px; height:36px; border-radius:6px;
    background:linear-gradient(180deg,#f8bf42,#b57409);
    box-shadow:0 2px 0 rgba(0,0,0,.25) inset, 0 8px 16px rgba(0,0,0,.35)}
  .obstacle::after{content:""; position:absolute; inset:auto 2px 2px 2px; height:4px; border-radius:2px; background:rgba(0,0,0,.2)}

  /* Game over anim */
  .stage.gameover .flea{animation:shake .25s 5}
  @keyframes shake{
    0%,100%{transform:translate(0,0)} 25%{transform:translate(2px,-1px)}
    50%{transform:translate(-2px,1px)} 75%{transform:translate(1px,0)}
  }

  footer{margin-top:10px; text-align:center; color:var(--muted); font-size:13px}
  .btn{appearance:none; border:0; border-radius:12px; padding:12px 16px; font:700 14px/1 system-ui;
       background:#0ea5b7; color:#001018; box-shadow:0 6px 16px rgba(14,165,183,.3); cursor:pointer}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="title">Blcha vs. Benny</div>
        <div class="hint">📱 Ovládanie: <b>tapni kdekoľvek</b> pre skok. (Bez klávesnice)</div>
      </div>
    </header>

    <div class="stage" id="stage" aria-label="Hracia plocha" role="application">
      <div class="sky"></div><div class="mounts"></div><div class="ground"></div>

      <div class="flea" id="flea" aria-label="Blcha"></div>

      <div class="benny" id="benny" aria-label="Pes Benny">
        <div class="body"></div><div class="head"></div><div class="ear"></div><div class="eye"></div><div class="tail"></div>
        <div class="leg l1"></div><div class="leg l2"></div><div class="leg l3"></div><div class="leg l4"></div>
      </div>

      <div class="hud">
        <div class="badge">Skóre: <span id="score">0</span></div>
        <div class="badge">Rekord: <span id="best">0</span></div>
      </div>

      <div class="tapBubble" id="tap">Tap pre skok</div>
    </div>

    <footer><button class="btn" id="restart" type="button">Reštart</button></footer>
  </div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const fleaEl = document.getElementById('flea');
  const bennyEl = document.getElementById('benny');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const tapEl   = document.getElementById('tap');
  const restartBtn = document.getElementById('restart');

  const BEST_KEY = 'blcha_best_mobile_v1';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  bestEl.textContent = best;

  let w = stage.clientWidth, h = stage.clientHeight;
  let groundY = h * 0.67;

  const flea = { x: w*0.08, y: groundY-18, vy:0, r:9, jumpForce:-9.6, gravity:0.45, grounded:true };
  const benny = { x: w-100, speed:0.6, maxSpeed:2.2 };

  let obstacles = [];
  let baseSpeed = 3.2, speed = baseSpeed;
  let spawnTimer = 0, spawnDelay = 900;
  let lastTime = 0, running = false, gameOver = false, score = 0;

  function rand(a,b){return Math.random()*(b-a)+a;}

  function reset(){
    w = stage.clientWidth; h = stage.clientHeight; groundY = h*0.67;
    obstacles.forEach(o=>o.el.remove()); obstacles=[];
    Object.assign(flea, { y: groundY-18, vy:0, grounded:true });
    Object.assign(benny, { x:w-100, speed:0.6 });

    speed = baseSpeed; spawnTimer = 0; spawnDelay = 900; score=0;
    running = true; gameOver=false; scoreEl.textContent='0';
    fleaEl.classList.remove('hit'); stage.classList.remove('gameover');
    tapEl.style.display='block'; tapEl.textContent='Tap pre skok';
    lastTime = performance.now(); requestAnimationFrame(loop);
  }

  function spawnObstacle(){
    const el = document.createElement('div');
    el.className='obstacle'; stage.appendChild(el);
    const height = rand(26, 48), width = rand(14, 22);
    el.style.height = height+'px'; el.style.width = width+'px';
    const y = groundY - height, x = w + rand(0, 60);
    const obs={x,y,w:width,h:height,el,passed:false};
    el.style.transform=`translate(${x}px, ${y}px)`; obstacles.push(obs);
    const minDelay=420; spawnDelay = Math.max(minDelay, 900 - score*2.5);
  }

  function jump(){
    if (!running || gameOver) return;
    if (flea.grounded){
      flea.vy = flea.jumpForce; flea.grounded=false; tapEl.style.display='none';
    }
  }

  function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function endGame(){
    gameOver=true; running=false; stage.classList.add('gameover'); fleaEl.classList.add('hit');
    tapEl.style.display='block'; tapEl.textContent='Koniec — tapni pre Reštart';
    if (score>best){ best=score; localStorage.setItem(BEST_KEY,String(best)); bestEl.textContent=best; }
  }

  function loop(ts){
    if (!running) return;
    const dt = ts - lastTime; lastTime = ts;

    speed = Math.min(7.2, baseSpeed + score*0.0035);
    benny.speed = Math.min(benny.maxSpeed, 0.6 + score*0.0009);

    // physics flea
    flea.vy += flea.gravity; flea.y += flea.vy;
    const floorY = groundY-18;
    if (flea.y >= floorY){ flea.y=floorY; flea.vy=0; flea.grounded=true; }

    // obstacles
    for (let i=obstacles.length-1; i>=0; i--){
      const o=obstacles[i]; o.x -= speed; o.el.style.transform=`translate(${o.x}px, ${o.y}px)`;
      const hit = rectsOverlap(flea.x-4, flea.y-2, 18, 18, o.x, o.y, o.w, o.h);
      if (hit) return endGame();
      if (!o.passed && o.x + o.w < flea.x){ o.passed=true; score++; scoreEl.textContent=score; }
      if (o.x + o.w < -20){ o.el.remove(); obstacles.splice(i,1); }
    }

    // spawn
    spawnTimer += dt;
    if (spawnTimer >= spawnDelay){
      spawnTimer = 0;
      if (Math.random() < 0.2){ spawnObstacle(); setTimeout(spawnObstacle, 260); }
      else spawnObstacle();
    }

    // Benny chase
    benny.x = Math.max(flea.x + 40, benny.x - benny.speed);
    bennyEl.style.transform = `translateX(${benny.x - (w - 100)}px)`;
    const bennyHeadX = benny.x + 10;
    if (bennyHeadX <= flea.x + 6) return endGame();

    // render
    fleaEl.style.transform = `translate(${flea.x}px, ${flea.y}px)`;
    requestAnimationFrame(loop);
  }

  // 📱 Ovládanie len tapom/klikom
  function handleTap(){
    if (gameOver){ reset(); return; }
    jump();
  }
  stage.addEventListener('pointerdown', handleTap, {passive:true});
  // voliteľne aj na button
  restartBtn.addEventListener('click', reset, {passive:true});

  // responzívne prepočty
  new ResizeObserver(()=>{
    const wasRunning = running && !gameOver; running=false;
    setTimeout(()=>{
      w = stage.clientWidth; h = stage.clientHeight; groundY = h*0.67;
      flea.y = Math.min(flea.y, groundY-18);
      obstacles.forEach(o=>{ o.y = groundY - o.h; o.el.style.transform=`translate(${o.x}px, ${o.y}px)`; });
      benny.x = Math.min(benny.x, w-100);
      bennyEl.style.transform = `translateX(${benny.x - (w - 100)}px)`;
      fleaEl.style.transform = `translate(${flea.x}px, ${flea.y}px)`;
      if (wasRunning){ running=true; lastTime=performance.now(); requestAnimationFrame(loop); }
    },0);
  }).observe(stage);

  // štart
  reset();
})();
</script>
</body>
</html>
