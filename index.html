<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Flappy Blcha</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#0b1220; --ui:#e5e7eb; --muted:#9aa5b1;
    --flea:#22d3ee; --pipe:#f59e0b; --ground:#1f2937; --danger:#ef4444; --ok:#10b981;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background: radial-gradient(1200px 800px at 70% -10%, #1e293b 0%, var(--bg2) 40%, var(--bg) 100%);
    color:var(--ui); font:600 16px/1.3 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    display:flex; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none;
  }
  .wrap{ width:min(100vw, 540px); height:100dvh; max-height:100vh; display:flex; flex-direction:column; padding:10px }
  header{display:flex; align-items:baseline; justify-content:space-between; color:var(--muted); font-weight:600; margin-bottom:8px}
  header .title{color:var(--ui); font-weight:800; letter-spacing:.2px}
  .stage{
    position:relative; flex:1 1 auto; border-radius:16px; overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
    background:linear-gradient(#0b1020 0 75%, #0d1326 75% 100%);
    touch-action:none; /* zamedzí panning/zoom na mobile */
  }
  canvas{display:block; width:100%; height:100%}
  footer{margin-top:8px; text-align:center; color:var(--muted); font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">Flappy Blcha</div>
      <div>Ťukni kdekoľvek pre skok</div>
    </header>
    <div class="stage" id="stage">
      <canvas id="game" aria-label="Flappy Blcha" role="application"></canvas>
    </div>
    <footer>Skóre a rekord sa ukladajú lokálne. 📱 Tap = skok • Po „Koniec“ tap = reštart</footer>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const stage = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // === Uloženie rekordu ===
  const BEST_KEY = 'flappy_blcha_best_v1';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);

  // === Stav hry ===
  const STATE = { READY:'ready', PLAY:'play', OVER:'over' };
  let state = STATE.READY;

  // Rozmery (menia sa pri resize)
  let W=0, H=0, DPR=1;

  // Svet v "relatívnych" jednotkách z výšky H
  const world = {};
  function recomputeWorld(){
    // Všetko z H, aby to bolo responzívne
    world.groundH = Math.max(20, H*0.10);
    world.fleaR   = Math.max(6, H*0.025);         // polomer blchy
    world.gravity = H*0.0015;                     // px/frame^2 (približne)
    world.jumpV   = -H*0.028;                     // skoková rýchlosť
    world.pipeW   = Math.max(24, H*0.08);         // šírka prekážky
    world.gap     = Math.max(H*0.22, 120);        // medzera
    world.speed   = Math.max(2.2, H*0.0045);      // rýchlosť posuvu
    world.spawnDist = H*0.55;                     // rozostup prekážok
    world.maxFall = H - world.groundH - world.fleaR;
    world.skyGradTop = '#0b1020';
    world.skyGradBot = '#0d1326';
  }

  // Hráč
  const flea = { x:0, y:0, vy:0, r:0, alive:true, passed:0, score:0 };

  // Prekážky (rúry)
  const pipes = []; // {x, gapY}
  let distSinceLast = 0;

  function resetGame(full=true){
    // veľkosť canvasu podľa zariadenia
    DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
    const rect = stage.getBoundingClientRect();
    W = Math.max(240, Math.floor(rect.width));
    H = Math.max(320, Math.floor(rect.height));
    canvas.width = Math.floor(W*DPR);
    canvas.height= Math.floor(H*DPR);
    canvas.style.width = W+'px';
    canvas.style.height= H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    recomputeWorld();

    flea.x = Math.floor(W*0.28);
    flea.y = Math.floor(H*0.45);
    flea.vy= 0;
    flea.r = world.fleaR;
    flea.alive = true;
    flea.passed = 0;
    if (full) flea.score = 0;

    pipes.length = 0;
    distSinceLast = world.spawnDist*0.6; // nech skoro príde prvá prekážka

    // Prekresli úvodnú obrazovku
    draw(0);
  }

  // Pomocné
  function randRange(min, max){ return Math.random()*(max-min)+min; }

  function spawnPipe(){
    const margin = H*0.18;
    const gapY = randRange(margin, H - world.groundH - margin);
    pipes.push({ x: W + world.pipeW, gapY });
  }

  // Kolízia kruh vs. obdĺžnik
  function circleRectHit(cx, cy, cr, rx, ry, rw, rh){
    const nx = Math.max(rx, Math.min(cx, rx+rw));
    const ny = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx - nx, dy = cy - ny;
    return (dx*dx + dy*dy) <= cr*cr;
  }

  let lastTs = 0;
  function loop(ts){
    const dt = Math.min(32, ts - lastTs || 16); // cap, default ~60fps
    lastTs = ts;

    if (state === STATE.PLAY){
      // Fyzika blchy
      flea.vy += world.gravity;
      flea.y  += flea.vy;

      // Zem / strop
      if (flea.y < flea.r) { flea.y = flea.r; flea.vy = 0; }
      if (flea.y > world.maxFall){
        flea.y = world.maxFall;
        gameOver();
      }

      // Posun a spawn prekážok
      distSinceLast += world.speed;
      if (distSinceLast >= world.spawnDist){
        distSinceLast = 0;
        spawnPipe();
      }
      for (let i=pipes.length-1;i>=0;i--){
        const p = pipes[i];
        p.x -= world.speed;

        // Body: keď prejde stredom rúry
        if (!p._scored && p.x + world.pipeW < flea.x){
          p._scored = true;
          flea.score++;
          if (flea.score > best){ best = flea.score; localStorage.setItem(BEST_KEY, String(best)); }
        }

        // Zmaž mimo obraz
        if (p.x + world.pipeW < -10){
          pipes.splice(i,1);
        }
      }

      // Kolízie s rúrami
      for (const p of pipes){
        const topH = p.gapY - world.gap/2;
        const botY = p.gapY + world.gap/2;
        // horná rúra
        if (circleRectHit(flea.x, flea.y, flea.r, p.x, 0, world.pipeW, topH)){
          gameOver(); break;
        }
        // spodná rúra
        if (circleRectHit(flea.x, flea.y, flea.r, p.x, botY, world.pipeW, H - world.groundH - botY)){
          gameOver(); break;
        }
      }
    }

    draw(dt);
    requestAnimationFrame(loop);
  }

  function gameOver(){
    if (state !== STATE.OVER){
      state = STATE.OVER;
    }
  }

  function startPlay(){
    if (state === STATE.READY){
      state = STATE.PLAY;
      flea.vy = world.jumpV; // prvý "tap" hneď skočí
    } else if (state === STATE.OVER){
      flea.score = 0;
      state = STATE.READY;
      resetGame(false);
      // malý delay, aby sa tap na reštart nepočítal aj ako skok
      setTimeout(()=>{ state = STATE.PLAY; flea.vy = world.jumpV; }, 80);
    } else {
      // počas hry je to "flap"
      flea.vy = world.jumpV;
    }
  }

  // Kreslenie
  function draw(){
    // pozadie
    const grd = ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0, '#0b1020');
    grd.addColorStop(0.75, '#0d1326');
    grd.addColorStop(0.76, '#121a2d');
    grd.addColorStop(1, '#0e1629');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,W,H);

    // terén
    ctx.fillStyle = '#203048';
    ctx.fillRect(0, H - world.groundH, W, 2);
    // prúžky zeme
    ctx.fillStyle = '#1b273d';
    for (let x=0; x<W; x+=24){ ctx.fillRect(x, H - world.groundH + 6, 12, world.groundH - 6); }

    // rúry
    for (const p of pipes){
      const topH = p.gapY - world.gap/2;
      const botY = p.gapY + world.gap/2;

      // top
      ctx.fillStyle = '#f8bf42';
      ctx.fillRect(p.x, 0, world.pipeW, topH);
      // tieň
      ctx.fillStyle = 'rgba(0,0,0,.2)';
      ctx.fillRect(p.x+2, 0, world.pipeW-4, 4);

      // bottom
      ctx.fillStyle = '#b57409';
      ctx.fillRect(p.x, botY, world.pipeW, H - world.groundH - botY);
      // tieň
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(p.x+2, botY, world.pipeW-4, 4);
    }

    // blcha (malá kvapka s uškami)
    ctx.save();
    ctx.translate(flea.x, flea.y);
    // telíčko
    const g = ctx.createRadialGradient(-flea.r*0.3, -flea.r*0.3, 1, 0,0, flea.r);
    g.addColorStop(0, '#bff7ff'); g.addColorStop(1, '#22d3ee');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,flea.r,0,Math.PI*2); ctx.fill();
    // ušká
    ctx.fillStyle = '#7dd3fc';
    ctx.beginPath(); ctx.ellipse(-flea.r*0.45, -flea.r*0.9, flea.r*0.35, flea.r*0.5, -0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( flea.r*0.45, -flea.r*0.9, flea.r*0.35, flea.r*0.5,  0.4, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    // HUD
    ctx.fillStyle = 'rgba(15,23,42,.65)';
    ctx.fillRect(W-140, 10, 130, 34);
    ctx.fillRect(W-140, 50, 130, 28);
    ctx.fillStyle = '#e5e7eb';
    ctx.font = 'bold 20px system-ui';
    ctx.fillText(`Skóre: ${flea.score}`, W-132, 34);
    ctx.font = 'bold 14px system-ui';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText(`Rekord: ${best}`, W-132, 68);

    // Overlay pre READY / OVER
    if (state !== STATE.PLAY){
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      if (state === STATE.READY){
        ctx.fillStyle = '#b8eaff';
        ctx.font = 'bold 22px system-ui';
        ctx.fillText('Ťukni pre štart', W/2, H*0.42);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 14px system-ui';
        ctx.fillText('A udrž blchu medzi prekážkami', W/2, H*0.48);
      } else {
        ctx.fillStyle = '#ffb4b4';
        ctx.font = 'bold 24px system-ui';
        ctx.fillText('Koniec hry', W/2, H*0.42);
        ctx.fillStyle = '#b8eaff';
        ctx.font = 'bold 18px system-ui';
        ctx.fillText('Ťukni pre reštart', W/2, H*0.50);
      }
      ctx.textAlign = 'start';
    }
  }

  // Ovládanie: iba TAP/CLICK na plochu
  function onTap(e){
    e.preventDefault();
    if (state === STATE.READY){ startPlay(); return; }
    if (state === STATE.OVER){ startPlay(); return; }
    // počas hry = skok
    flea.vy = world.jumpV;
  }
  stage.addEventListener('pointerdown', onTap, {passive:false});
  stage.addEventListener('touchstart', onTap, {passive:false});

  // Zamedziť dvojťuk zoom
  let lastTouch = 0;
  stage.addEventListener('touchend', (e)=>{
    const now = Date.now();
    if (now - lastTouch < 350) e.preventDefault();
    lastTouch = now;
  }, {passive:false});

  // Resize / orientácia
  const ro = new ResizeObserver(()=> resetGame(false));
  ro.observe(stage);

  // Štart
  resetGame(true);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
