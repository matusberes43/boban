<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Navbar</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #d40000;
            padding: 10px 20px;
            height: 60px;
        }

        .menu-icon, .profile-icon {
            font-size: 24px;
            color: white;
            cursor: pointer;
        }

        .logo {
            height: 40px;
            filter: brightness(0) invert(1); /* Zmena farby na bielu */
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="menu-icon">&#9776;</div>
        <img src="logo.png" alt="F1 75 Logo" class="logo">
        <div class="profile-icon">&#128100;</div>
    </nav>

</body>
</html>
