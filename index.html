<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top používatelia</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: #d32f2f;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .chat-container {
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .user {
      display: flex;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #eee;
    }

    .user:last-child {
      border-bottom: none;
    }

    .avatar {
      width: 40px;
      height: 40px;
      background-color: #cfd8dc;
      border-radius: 50%;
      display: inline-block;
      margin-right: 15px;
    }

    .username {
      font-weight: bold;
      color: #333;
    }

    .status {
      font-size: 13px;
      color: #777;
    }
  </style>
</head>
<body>

  <div class="header">Top používatelia</div>

  <div class="chat-container">
    <div class="user">
      <div class="avatar"></div>
      <div>
        <div class="username">Yoshitsune</div>
        <div class="status">Aktívny člen, prispieva často</div>
      </div>
    </div>
    <div class="user">
      <div class="avatar"></div>
      <div>
        <div class="username">TheDarKnig</div>
        <div class="status">Diskutuje v Marvel témach</div>
      </div>
    </div>
    <div class="user">
      <div class="avatar"></div>
      <div>
        <div class="username">tomas.malo</div>
        <div class="status">Občas provokatér, ale aktívny</div>
      </div>
    </div>
    <div class="user">
      <div class="avatar"></div>
      <div>
        <div class="username">SidneyP</div>
        <div class="status">Zapája sa do DC diskusií</div>
      </div>
    </div>
    <div class="user">
      <div class="avatar"></div>
      <div>
        <div class="username">Knowho</div>
        <div class="status">Komentuje všetko, má prehľad</div>
      </div>
    </div>
  </div>

</body>
</html>
