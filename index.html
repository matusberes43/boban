<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNISHER News</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* Základné nastavenie */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
        }

        /* Horná lišta */
        .top-bar {
            background-color: #D50000;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        /* Ikona MENU */
        .menu-icon {
            font-size: 24px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .menu-icon::before {
            content: "☰"; /* Unicode znak pre menu */
            font-size: 24px;
        }

        /* Logo PUNISHER v štýle F1 */
        .punisher-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            flex-grow: 1;
        }

        .punisher-logo span {
            background: linear-gradient(to right, red 50%, black 50%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: skewX(-10deg);
        }

        /* Kontajner pre správy */
        .news-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        /* Box so správou */
        .news-box {
            background-color: #1E1E1E;
            width: 90%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .news-box img {
            width: 100%;
            border-bottom: 3px solid red;
        }

        .news-content {
            padding: 15px;
        }

        .news-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .news-meta {
            font-size: 12px;
            color: #B0B0B0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            margin-top: 10px;
        }

    </style>
</head>
<body>

    <!-- Horná lišta -->
    <div class="top-bar">
        <div class="menu-icon"></div>
        <div class="punisher-logo"><span>PUNISHER</span></div>
        <div style="width: 24px;"></div> <!-- Vyváženie priestoru vpravo -->
    </div>

    <!-- Správy -->
    <div class="news-container">

        <!-- Prvý box - odkazuje na theelectricstate.html -->
        <a href="theelectricstate.html" class="news-box">
            <img src="https://i.postimg.cc/bdfnkVGn/IMG-8163.jpg" alt="News Image">
            <div class="news-content">
                <div class="news-title">Je The Electric State od Netflixu opravdu takový propadák?</div>
                <div class="news-meta">
                    <span>By Matúš Bereš • 14.03.2025</span>
                </div>
            </div>
        </a>

        <!-- Ostatné boxy -->
        <script>
            for (let i = 0; i < 9; i++) {
                document.write(`
                    <div class="news-box">
                        <img src="https://via.placeholder.com/800x400" alt="News Image">
                        <div class="news-content">
                            <div class="news-title">Captain America: Brave New World Is Officially One of the Highest-Grossing Action Movies in US Box Office History</div>
                            <div class="news-meta">
                                <span>By Jake Hodges • 5 hours ago</span>
                            </div>
                        </div>
                    </div>
                `);
            }
        </script>

    </div>

</body>
</html>
