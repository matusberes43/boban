<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHA.COM</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Načítavací screen -->
    <div id="loading-screen">
        <h1 id="loading-text">BLCHA.COM</h1>
    </div>

    <!-- Hlavný obsah -->
    <div id="content" class="hidden">
        <div class="button-container">
            <button id="conspiracy-world">CONSPIRACY THEORY (SVET)</button>
            <button id="conspiracy-usa">CONSPIRACY THEORY (USA)</button>
            <button id="novinky">NOVINKY</button> <!-- Nové tlačidlo s červeným pozadím -->
        </div>

        <!-- Zoznam konšpiračných teórií -->
        <div id="conspiracy-list" class="hidden">
            <h2 id="list-title"></h2>
            <ul id="list-items"></ul>
        </div>

        <!-- Boxy pre novinky -->
        <div id="novinky-list" class="hidden">
            <h2>Najnovšie články</h2>
            <div class="novinky-box">
                <img src="images/novinka1.jpg" alt="Novinka 1">
                <div class="novinky-info">
                    <h3>Nová konšpiračná teória o mimozemšťanoch</h3>
                    <button class="open-article">Otvoriť článok</button>
                </div>
            </div>
            <div class="novinky-box">
                <img src="images/novinka2.jpg" alt="Novinka 2">
                <div class="novinky-info">
                    <h3>Záhada zmiznutého lietadla MH370</h3>
                    <button class="open-article">Otvoriť článok</button>
                </div>
            </div>
            <div class="novinky-box">
                <img src="images/novinka3.jpg" alt="Novinka 3">
                <div class="novinky-info">
                    <h3>COVID-19: Nové teórie o pôvode vírusu</h3>
                    <button class="open-article">Otvoriť článok</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>
</body>
</html>
