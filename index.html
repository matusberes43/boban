<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Webpage</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
        }
        .sidebar {
            height: 100vh;
            width: 150px; /* Narrower sidebar */
            position: fixed;
            top: 0;
            left: 0;
            background-color: #000;
            padding-top: 20px;
        }
        .sidebar a {
            padding: 15px 10px; /* Adjusted padding for less width */
            text-decoration: none;
            font-size: 16px;
            color: white;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background-color: #333;
        }
        .sidebar .profile {
            display: flex;
            align-items: center;
            padding: 10px 10px;
        }
        .sidebar .profile img {
            border-radius: 50%;
            margin-right: 10px;
        }
        .main {
            margin-left: 150px; /* Adjusted for narrower sidebar */
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="profile">
            <img src="profile-pic-url.jpg" alt="Profile Picture" width="40" height="40">
            <span>Kevin</span>
        </div>
        <a href="#">Watch Now</a>
        <a href="#">Browse</a>
        <a href="#">Search</a>
        <a href="#">Latest</a>
        <a href="#">TV Shows</a>
        <a href="#">Movies</a>
        <a href="#">My List</a>
        <a href="#">Settings</a>
        <a href="#">Exit Netflix</a>
    </div>
    <div class="main">
        <!-- Main content goes here -->
    </div>
</body>
</html>
