<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONSPIRACY HUB</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Link na Font Awesome pre ikonky -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="button-container">
        <div class="button" onclick="navigate('usa')">
            <div class="icon"><i class="fa-solid fa-flag-usa"></i></div>
            <div class="text">CONSPIRACY THEORIES (USA)</div>
        </div>
        <div class="button" onclick="toggleWorldConspiracies()">
            <div class="icon"><i class="fa-solid fa-globe"></i></div>
            <div class="text">CONSPIRACY THEORIES (SVET)</div>
        </div>
        <div class="sub-button-container" id="world-conspiracies">
            <!-- Sem sa dynamicky pridajú menšie tlačidlá -->
        </div>
        <div class="button" onclick="navigate('news')">
            <div class="icon"><i class="fa-solid fa-newspaper"></i></div>
            <div class="text">NOVINKY</div>
        </div>
        <div class="button" onclick="navigate('videos')">
            <div class="icon"><i class="fa-solid fa-video"></i></div>
            <div class="text">VIDEA</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
