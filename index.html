<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernCSFD</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1 class="title">ModernCSFD</h1>
    </header>

    <main class="main-content">
        <section class="new-movies">
            <h2 class="section-title">Najnovšie Filmy</h2>
            <div class="movie-grid">
                <!-- Pridajte ďalšie filmy ako div.movie-item -->
                <div class="movie-item">
                    <img src="placeholder.jpg" alt="Film placeholder" class="movie-poster">
                    <h3 class="movie-title">Názov filmu</h3>
                    <p class="movie-rating">Hodnotenie: 8.5/10</p>
                </div>
            </div>
        </section>

        <section class="top-rated">
            <h2 class="section-title">Top Hodnotené</h2>
            <div class="movie-grid">
                <!-- Pridajte ďalšie filmy ako div.movie-item -->
                <div class="movie-item">
                    <img src="placeholder.jpg" alt="Film placeholder" class="movie-poster">
                    <h3 class="movie-title">Najlepší film</h3>
                    <p class="movie-rating">Hodnotenie: 9.2/10</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2024 ModernCSFD</p>
    </footer>
</body>
</html>
