<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 News</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* Základné nastavenie */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #F8F8F8;
        }

        /* Horný červený panel */
        .top-bar {
            background-color: #D50000;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar img {
            height: 30px;
        }

        .top-bar .profile-icon {
            background-color: black;
            padding: 10px;
            border-radius: 50%;
        }

        /* Sekcia odpočítavania */
        .countdown {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 18px;
        }

        .countdown div {
            display: inline-block;
            margin: 5px;
        }

        /* Nadpisy sekcií */
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin: 15px;
            border-bottom: 2px solid red;
            display: inline-block;
            padding-bottom: 5px;
        }

        /* Novinkové boxy */
        .news-container {
            background-color: white;
            margin: 10px;
            padding: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .news-container img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            margin-right: 10px;
        }

        .news-text {
            flex: 1;
        }

        .news-text .category {
            color: red;
            font-size: 12px;
            font-weight: bold;
        }

        .news-text .headline {
            font-size: 14px;
            font-weight: bold;
        }

        /* Sekcia "Moments" */
        .moments-container {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px;
        }

        .moment {
            min-width: 200px;
            background-color: black;
            color: white;
            padding: 10px;
            border-radius: 10px;
            position: relative;
        }

        .moment img {
            width: 100%;
            border-radius: 10px;
        }

        .moment .new-label {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: blue;
            color: white;
            padding: 5px;
            font-size: 12px;
            border-radius: 5px;
        }

        /* Reklama */
        .ad-banner {
            text-align: center;
            padding: 10px;
        }

        .ad-banner img {
            width: 90%;
            border-radius: 10px;
        }

        /* Spodná navigácia */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: white;
            padding: 10px 0;
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #ccc;
        }

        .bottom-nav a {
            text-decoration: none;
            color: black;
            text-align: center;
            font-size: 12px;
        }

        .bottom-nav i {
            font-size: 20px;
            display: block;
        }

        .active {
            color: red;
        }
    </style>
</head>
<body>

    <!-- Horný panel -->
    <div class="top-bar">
        <span>18:57</span>
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/33/F1.svg" alt="F1 logo">
        <div class="profile-icon"><i class="fas fa-user"></i></div>
    </div>

    <!-- Sekcia odpočítavania -->
    <div class="countdown">
        <div><strong>AUSTRALIA 2025</strong></div>
        <div>PRACTICE 3</div>
        <div>07 HRS | 34 MINS | 16 SECS</div>
    </div>

    <!-- Nadpis sekcie -->
    <div class="section-title">Top Stories</div>

    <!-- Novinky -->
    <div class="news-container">
        <img src="https://via.placeholder.com/80" alt="News">
        <div class="news-text">
            <div class="category">NEWS</div>
            <div class="headline">Team bosses voice excitement for ‘F1’ movie after ‘transformative’ effect of Drive to Survive</div>
        </div>
    </div>

    <!-- Sekcia "Moments" -->
    <div class="section-title">Moments</div>
    <div class="moments-container">
        <div class="moment">
            <div class="new-label">NEW</div>
            <img src="https://via.placeholder.com/200" alt="Moment">
            <div class="headline">What would F1 drivers call their F1 Fantasy Team?</div>
        </div>
        <div class="moment">
            <div class="new-label">NEW</div>
            <img src="https://via.placeholder.com/200" alt="Moment">
            <div class="headline">Nico SLAYS?</div>
        </div>
    </div>

    <!-- Reklama -->
    <div class="ad-banner">
        <img src="https://via.placeholder.com/600x100" alt="Ad">
    </div>

    <!-- Spodná navigácia -->
    <div class="bottom-nav">
        <a href="#" class="active"><i class="fas fa-bars"></i> Latest</a>
        <a href="#"><i class="fas fa-play-circle"></i> Video</a>
        <a href="#"><i class="fas fa-flag-checkered"></i> Racing</a>
        <a href="#"><i class="fas fa-list"></i> Standings</a>
        <a href="#"><i class="fas fa-trophy"></i> Fantasy</a>
    </div>

</body>
</html>
