<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHAGUNS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0A1624;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .logo h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            letter-spacing: 3px;
            color: #ffffff;
            cursor: pointer;
        }

        .logo .rival {
            color: #6CFF47;
        }

        .categories p {
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            margin: 10px 0;
            cursor: pointer;
            transition: color 0.3s;
        }

        .categories p:hover {
            color: #6CFF47;
        }

        .buttons {
            margin-top: 50px;
        }

        .join-button, .login-button {
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
            color: #0A1624;
        }

        .join-button {
            background-color: #6CFF47;
        }

        .login-button {
            background-color: transparent;
            border: 2px solid #6CFF47;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo" onclick="reloadPage()">
            <h1><span class="grid">BLCHA</span><span class="rival">GUNS</span></h1>
        </div>

        <!-- Categories -->
        <div class="categories">
            <p onclick="navigateTo('pistole.html')">PIŠTOLE</p>
            <p onclick="navigateTo('utocne-pusky.html')">ÚTOČNÉ PUŠKY</p>
            <p onclick="navigateTo('odstreliovacie-pusky.html')">ODSTREĽOVACIE PUŠKY</p>
            <p onclick="navigateTo('revolvery.html')">REVOLVERY</p>
            <p onclick="navigateTo('brokovnice.html')">BROKOVNICE</p>
            <p onclick="navigateTo('vzduchove-zbrane.html')">VZDUCHOVÉ ZBRANE</p>
            <p onclick="navigateTo('prislusenstvo.html')">PRÍSLUŠENSTVO</p>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <a href="#" class="join-button" onclick="showForm()">Join The Club</a>
            <a href="#" class="login-button">Login</a>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function reloadPage() {
            location.reload();
        }

        function navigateTo(page) {
            window.location.href = page;
        }
    </script>
</body>
</html>
