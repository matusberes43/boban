<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uživatelský profil</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #12132D;
            font-family: Arial, sans-serif;
            color: #FFFFFF;
            padding: 20px;
        }

        .profile-box {
            width: 350px;
            border: 2px solid #4E8BFF;
            border-radius: 10px;
            padding: 15px;
            background: linear-gradient(135deg, #1C1D40, #292A50);
            box-shadow: 0px 0px 10px rgba(78, 139, 255, 0.5);
            transition: transform 0.3s;
        }

        .profile-box:hover {
            transform: scale(1.02);
        }

        .username {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .favorite-icon {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background-image: url('https://i.postimg.cc/02GqG3J2/IMG-7860.jpg');
            background-size: cover;
            border-radius: 8px;
            border: 2px solid #4E8BFF;
            margin-bottom: 15px;
        }

        .info {
            font-size: 14px;
            margin-bottom: 20px;
            background: rgba(78, 139, 255, 0.1);
            padding: 10px;
            border-radius: 6px;
        }

        .button-container {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            background: #4E8BFF;
            border-radius: 8px;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #3A72D9;
            transform: scale(1.05);
        }

        .btn-icon {
            filter: brightness(0) invert(1);
            margin-right: 6px;
            width: 16px;
            height: 16px;
        }

        .footer-links {
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }

        /* MODAL OKNO */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1C1D40;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
        }

        .modal button {
            margin-top: 10px;
            padding: 8px 12px;
            border: none;
            background-color: #4E8BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal button:hover {
            background-color: #3A72D9;
        }
    </style>
</head>
<body>

<div class="profile-box">
    <div class="username">
        kenkaku
        <img src="https://img.icons8.com/ios-filled/50/CCCCCC/ok--v1.png" class="favorite-icon" id="favorite-icon">
    </div>
    <div class="avatar"></div>
    <div class="info">
        <strong>Registrace:</strong> před 7 lety<br>
        <strong>Sledováno:</strong> 6 měsíců 22 dní 22 hodin 23 minut (6607 epizod, 183 seriálů)
    </div>

    <div class="button-container">
        <button class="btn" id="message-btn">
            <img src="https://img.icons8.com/ios/50/FFFFFF/speech-bubble--v1.png" class="btn-icon">
            Poslat zprávu
        </button>
        <button class="btn" id="favorite-btn">
            <img src="https://img.icons8.com/ios/50/FFFFFF/star--v1.png" class="btn-icon">
            Přidat do oblíbených
        </button>
    </div>

    <div class="footer-links">
        Hodnocení | <span style="color:#4E8BFF">Sledováno</span> | <span style="color:#4E8BFF">Seriály v Bedně</span>
    </div>
</div>

<!-- MODAL OKNO -->
<div class="modal" id="message-modal">
    <div class="modal-content">
        <h3>Poslat zprávu</h3>
        <input type="text" placeholder="Napište zprávu...">
        <button id="send-btn">Odeslat</button>
    </div>
</div>

<script>
    // MODAL OKNO FUNKCIA
    document.getElementById("message-btn").onclick = function() {
        document.getElementById("message-modal").style.display = "flex";
    };
    document.getElementById("send-btn").onclick = function() {
        alert("Zpráva odeslána!");
        document.getElementById("message-modal").style.display = "none";
    };

    // PRIDAT/ODEBRAT Z OBLÍBENÝCH
    let favoriteBtn = document.getElementById("favorite-btn");
    let favoriteIcon = document.getElementById("favorite-icon");

    favoriteBtn.onclick = function() {
        if (favoriteBtn.innerText.includes("Přidat")) {
            favoriteBtn.innerHTML = '<img src="https://img.icons8.com/ios/50/FFFFFF/star--v1.png" class="btn-icon"> Odebrat z oblíbených';
            favoriteIcon.src = "https://img.icons8.com/ios-filled/50/40C057/ok--v1.png";
        } else {
            favoriteBtn.innerHTML = '<img src="https://img.icons8.com/ios/50/FFFFFF/star--v1.png" class="btn-icon"> Přidat do oblíbených';
            favoriteIcon.src = "https://img.icons8.com/ios-filled/50/CCCCCC/ok--v1.png";
        }
    };
</script>

</body>
</html>
