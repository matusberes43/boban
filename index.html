<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Countdown Timer with Lap Function</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --text-color: #ecf0f1;
            --red-color: #e74c3c;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://ibb.co/r4wDWXR'); /* Replace with actual image URL if necessary */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            margin: 0;
            color: var(--text-color);
        }

        .timer-container {
            background: rgba(255, 255, 255, 0.7); /* Semi-transparent white for better readability */
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        #countdown {
            font-size: 4em;
            margin: 0;
            font-weight: bold;
            color: var(--secondary-color);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: color 0.3s ease;
        }

        button {
            background: var(--secondary-color);
            color: var(--text-color);
            border: none;
            border-radius: 30px;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        button:hover {
            background: var(--primary-color);
        }

        .inputs {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            margin: 0 5px;
            border-radius: 5px;
            border: 1px solid var(--secondary-color);
            background: transparent;
            color: var(--text-color);
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        #laps {
            font-size: 0.9em;
            color: var(--text-color);
            max-height: 150px;
            overflow-y: auto;
            margin-top: 20px;
        }

        #credit {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 0.8em; /* Smaller font */
            font-weight: 400; /* Normal weight */
            color: var(--text-color);
        }

        .top-icons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
        }

        .icon {
            width: 30px;
            height: 30px;
            margin-left: 10px;
            background-size: contain;
            background-repeat: no-repeat;
            cursor: pointer;
        }

        .login-icon {
            background-image: url('path/to/login/icon.png');
        }

        .register-icon {
            background-image: url('path/to/register/icon.png');
        }
    </style>
</head>
<body>
    <div class="top-icons">
        <div class="icon login-icon" title="Login"></div>
        <div class="icon register-icon" title="Register"></div>
    </div>
    <div class="timer-container">
        <h1 id="countdown">00:00:00</h1>
        <div>
            <button id="restartBtn">Restart</button>
            <button id="setBtn">Set Time</button>
            <button id="lapBtn">Lap Time</button>
        </div>
        <div class="inputs">
            <input type="number" id="hours" placeholder="HH" min="0" max="23">
            <input type="number" id="minutes" placeholder="MM" min="0" max="59">
            <input type="number" id="seconds" placeholder="SS" min="0" max="59">
        </div>
        <div id="laps"></div>
    </div>
    <footer id="credit">Created by Matúš Bereš</footer>

    <script>
        let countdown;
        let timeLeft = 0;
        let lapCounter = 0;

        function updateTimer() {
            const hours = Math.floor(timeLeft / 3600);
            const minutes = Math.floor((timeLeft % 3600) / 60);
            const seconds = timeLeft % 60;

            document.getElementById('countdown').innerText = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (seconds < 10) {
                document.getElementById('countdown').style.color = 'var(--red-color)';
            } else {
                document.getElementById('countdown').style.color = 'var(--secondary-color)';
            }

            if (timeLeft > 0) {
                timeLeft--;
            } else {
                clearInterval(countdown);
                document.getElementById('countdown').style.color = 'var(--secondary-color)';
            }
        }

        document.getElementById('restartBtn').addEventListener('click', function() {
            clearInterval(countdown);
            timeLeft = 0;
            document.getElementById('laps').innerHTML = '';
            lapCounter = 0;
            updateTimer();
        });

        document.getElementById('setBtn').addEventListener('click', function() {
            clearInterval(countdown);
            const hours = parseInt(document.getElementById('hours').value) || 0;
            const minutes = parseInt(document.getElementById('minutes').value) || 0;
            const seconds = parseInt(document.getElementById('seconds').value) || 0;
            timeLeft = hours * 3600 + minutes * 60 + seconds;
            countdown = setInterval(updateTimer, 1000);
            updateTimer();
        });

        document.getElementById('lapBtn').addEventListener('click', function() {
            if (countdown) {
                lapCounter++;
                const lapTime = document.getElementById('countdown').innerText;
                const lapElement = document.createElement('p');
                lapElement.textContent = `Lap ${lapCounter}: ${lapTime}`;
                document.getElementById('laps').appendChild(lapElement);
            }
        });

        // Initial update
        updateTimer();
    </script>
</body>
</html>
