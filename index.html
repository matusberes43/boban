<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance Between Capitals</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding: 20px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Distance Between Capitals</h1>
    <input type="text" id="city1" placeholder="Enter first capital city">
    <input type="text" id="city2" placeholder="Enter second capital city">
    <button onclick="calculateDistance()">Calculate Distance</button>

    <div id="result"></div>

    <script>

            "Paris": { lat: 48.8566, lon: 2.3522 },
            "Libreville": { lat: 0.4162, lon: 9.4673 },
            "Tbilisi": { lat: 41.7151, lon: 44.8271 },
            "Berlin": { lat: 52.5200, lon: 13.4050 }
        };

        function calculateDistance() {
            const city1 = document.getElementById('city1').value.trim();
            const city2 = document.getElementById('city2').value.trim();

            if (!capitals[city1] || !capitals[city2]) {
                document.getElementById('result').innerText = 'One or both cities not found.';
                return;
            }

            const loc1 = capitals[city1];
            const loc2 = capitals[city2];
            const distance = haversineDistance(loc1.lat, loc1.lon, loc2.lat, loc2.lon);
            document.getElementById('result').innerText = `Distance: ${distance.toFixed(2)} km`;
        }

        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = degreesToRadians(lat2 - lat1);
            const dLon = degreesToRadians(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(degreesToRadians(lat1)) * Math.cos(degreesToRadians(lat2)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function degreesToRadians(deg) {
            return deg * Math.PI / 180;
        }
    </script>
