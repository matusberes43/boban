<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUNISHER Navbar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #d40000;
            padding: 10px 20px;
            height: 60px;
        }

        /* Menu ikonka podľa predlohy */
        .menu-icon {
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
        }

        .menu-icon div {
            background-color: white;
            height: 6px;
            border-radius: 12px;
        }

        .menu-icon div:nth-child(1) {
            width: 30px;
            border-top-right-radius: 14px;
        }

        .menu-icon div:nth-child(2) {
            width: 40px;
            border-top-right-radius: 14px;
        }

        .menu-icon div:nth-child(3) {
            width: 35px;
            border-top-right-radius: 14px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        /* Profilová ikonka presne podľa predlohy */
        .profile-icon {
            width: 40px;
            height: 40px;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            position: relative;
        }

        .profile-icon::before {
            content: "";
            width: 50%;
            height: 50%;
            border-radius: 50%;
            border: 3px solid white;
            position: absolute;
            top: 20%;
        }

        .profile-icon::after {
            content: "";
            width: 60%;
            height: 25%;
            background-color: white;
            position: absolute;
            bottom: 20%;
            border-radius: 8px;
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <div class="menu-icon">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="logo-text">PUNISHER</div>
        <div class="profile-icon"></div>
    </nav>

</body>
</html>
