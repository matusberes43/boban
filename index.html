<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="main-section.css">
    <title>Modern Header</title>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="left-section">
            <i class="fas fa-bars menu-icon" aria-label="Menu"></i>
        </div>
        <div class="logo">
            <img src="https://i.postimg.cc/VLP3mtXR/IMG-7653.png" alt="Company Logo">
        </div>
        <div class="right-section">
            <i class="fas fa-shopping-cart cart-icon" aria-label="Shopping Cart"></i>
            <i class="fas fa-user login-icon" aria-label="User Login"></i>
        </div>
    </header>

    <!-- New Section (Main Content) -->
    <section class="main-section">
        <img src="https://i.postimg.cc/3rLp05tk/IMG-7658.jpg" alt="Product Image">
        <h1>Vitajte na našej stránke!</h1>
        <p>
            Objavte širokú ponuku produktov a služieb, ktoré ponúkame. Naša stránka vám poskytne všetko, čo potrebujete,
            od moderných riešení až po kvalitné produkty. Neváhajte nás kontaktovať, ak máte akékoľvek otázky.
        </p>
    </section>
</body>
</html>
