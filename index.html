<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHAGUNS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0A1624;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            letter-spacing: 3px;
            color: #ffffff;
        }

        .categories p {
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            margin: 10px 0;
        }

        .buttons {
            margin-top: 30px;
        }

        .join-button {
            padding: 12px 35px;
            font-size: 16px;
            background-color: #6CFF47;
            color: #0A1624;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>BLCHAGUNS</h1>
        <div class="categories">
            <p>PIŠTOLE</p>
            <p>ÚTOČNÉ PUŠKY</p>
            <p>ODSTREĽOVACIE PUŠKY</p>
            <p>REVOLVERY</p>
            <p>BROKOVNICE</p>
            <p>VZDUCHOVÉ ZBRANE</p>
            <p>PRÍSLUŠENSTVO</p>
        </div>
        <div class="buttons">
            <a href="#" class="join-button" onclick="navigateToForm()">Join The Club</a>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function navigateToForm() {
            window.location.href = 'register.html';
        }
    </script>
</body>
</html>
