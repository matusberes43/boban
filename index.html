<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stránka kategórií ako Kick.com</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Kategórie</h1>
        <nav>
            <ul>
                <li><a href="#">Domov</a></li>
                <li><a href="#">Kategórie</a></li>
                <li><a href="#">Živé prenosy</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="category-grid">
            <div class="category-card">
                <img src="https://via.placeholder.com/300x200" alt="Hry">
                <h2>Hry</h2>
                <p>50 aktívnych streamov</p>
            </div>
            <div class="category-card">
                <img src="https://via.placeholder.com/300x200" alt="Rozhovory">
                <h2>Rozhovory</h2>
                <p>20 aktívnych streamov</p>
            </div>
            <div class="category-card">
                <img src="https://via.placeholder.com/300x200" alt="Hudba">
                <h2>Hudba</h2>
                <p>15 aktívnych streamov</p>
            </div>
            <div class="category-card">
                <img src="https://via.placeholder.com/300x200" alt="Šport">
                <h2>Šport</h2>
                <p>30 aktívnych streamov</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Všetky práva vyhradené.</p>
    </footer>
</body>
</html>
