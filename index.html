<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHAGUNS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0A1624;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        .logo h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .logo .rival {
            color: #6CFF47;
        }

        .categories p {
            font-size: 18px;
            margin: 15px 0;
            cursor: pointer;
            transition: color 0.3s;
        }

        .categories p:hover {
            color: #6CFF47;
        }

        .buttons {
            margin-top: 30px;
        }

        .join-button {
            background-color: #6CFF47;
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            color: #0A1624;
            display: inline-block;
            margin-right: 10px;
        }

        .login-button {
            padding: 12px 35px;
            border: 2px solid #6CFF47;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
            display: inline-block;
        }

        .form-container {
            display: none;
            background-color: #0E2436;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .form-container h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .form-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #102C4A;
            border: none;
            border-radius: 5px;
            color: #ffffff;
        }

        .form-container .sign-up-button {
            width: 100%;
            padding: 15px;
            background-color: #6CFF47;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            color: #0A1624;
            cursor: pointer;
        }

        .form-container .back-arrow {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            cursor: pointer;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- Hlavná stránka -->
    <div class="container" id="main-container">
        <div class="logo">
            <h1><span class="grid">BLCHA</span><span class="rival">GUNS</span></h1>
        </div>

        <div class="categories">
            <p onclick="navigateTo('pistole.html')">PIŠTOLE</p>
            <p onclick="navigateTo('utocne-pusky.html')">ÚTOČNÉ PUŠKY</p>
            <p onclick="navigateTo('odstreliovacie-pusky.html')">ODSTREĽOVACIE PUŠKY</p>
            <p onclick="navigateTo('revolvery.html')">REVOLVERY</p>
            <p onclick="navigateTo('brokovnice.html')">BROKOVNICE</p>
            <p onclick="navigateTo('vzduchove-zbrane.html')">VZDUCHOVÉ ZBRANE</p>
            <p onclick="navigateTo('prislusenstvo.html')">PRÍSLUŠENSTVO</p>
        </div>

        <div class="buttons">
            <a href="#" class="join-button" onclick="showForm()">Join The Club</a>
            <a href="#" class="login-button">Login</a>
        </div>
    </div>

    <!-- Formulár na registráciu -->
    <div class="form-container" id="form-container">
        <div class="back-arrow" onclick="goBack()">&#8592; Späť</div>
        <h2>Create an Account</h2>
        <input type="text" placeholder="Choose a Username">
        <input type="email" placeholder="Enter Your Email Address">
        <input type="password" placeholder="Create a Password">
        <div class="sign-up-button">Sign Up</div>
    </div>

    <!-- JavaScript -->
    <script>
        function showForm() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
        }

        function goBack() {
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
        }

        function navigateTo(page) {
            window.location.href = page;
        }
    </script>
</body>
</html>
