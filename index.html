<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Flappy Blcha vs. Benny — s Menu</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#0b1220; --ui:#e5e7eb; --muted:#9aa5b1;
    --flea:#22d3ee; --pipe1:#f8bf42; --pipe2:#b57409; --ground:#1f2937;
    --benny1:#f3d47a; --benny2:#d1a84b;
    --panel:#0b1220dd; --accent:#0ea5b7; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background: radial-gradient(1200px 800px at 70% -10%, #1e293b 0%, var(--bg2) 40%, var(--bg) 100%);
    color:var(--ui); font:600 16px/1.3 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    display:flex; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none;
  }
  .wrap{ width:min(100vw, 560px); height:100dvh; max-height:100vh; display:flex; flex-direction:column; padding:10px }
  header{display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-weight:600; margin-bottom:8px}
  header .title{color:var(--ui); font-weight:800; letter-spacing:.2px}
  .menuBtn{
    appearance:none; border:0; border-radius:10px; padding:8px 12px; font:700 14px/1 system-ui;
    background:var(--accent); color:#001018; box-shadow:0 6px 16px rgba(14,165,183,.3); cursor:pointer;
  }
  .stage{
    position:relative; flex:1 1 auto; border-radius:16px; overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
    background:linear-gradient(#0b1020 0 75%, #0d1326 75% 100%);
    touch-action:none;
  }
  canvas{display:block; width:100%; height:100%}

  /* Panely menu / nastavenia / autor */
  .panel{
    position:absolute; inset:0; display:none; place-items:center; background:rgba(0,0,0,.45);
  }
  .panel.show{display:grid}
  .card{
    width:min(92%, 440px); border-radius:16px; padding:18px; background:var(--panel);
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .card h2{margin:0 0 10px 0; font-size:20px}
  .list{display:grid; gap:10px}
  .btn{
    width:100%; appearance:none; border:0; border-radius:12px; padding:14px 16px; font:800 16px/1 system-ui; letter-spacing:.2px;
    background:#12243a; color:#e5f9ff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .btn.primary{background:var(--accent); color:#001018; box-shadow:0 10px 22px rgba(14,165,183,.35)}
  .btn.danger{background:#3a1220; color:#ffd2d2; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06)}
  .row{display:grid; gap:6px; margin:8px 0}
  label{font-size:14px; color:var(--muted)}
  input[type="range"]{width:100%}
  .row .val{font-weight:800; color:#b8eaff}
  .card .close{
    width:100%; margin-top:10px; appearance:none; border:0; border-radius:12px; padding:12px 16px; font:700 14px/1 system-ui;
    background:#243244; color:#c9d7e7; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }

  footer{margin-top:8px; text-align:center; color:var(--muted); font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">Flappy Blcha vs. Benny</div>
      <button class="menuBtn" id="openMenu">Menu</button>
    </header>

    <div class="stage" id="stage">
      <canvas id="game" aria-label="Flappy Blcha vs. Benny" role="application"></canvas>

      <!-- Hlavné menu -->
      <div class="panel show" id="menuPanel" aria-modal="true">
        <div class="card">
          <h2>Menu</h2>
          <div class="list">
            <button class="btn primary" id="newGameBtn">Nová hra</button>
            <button class="btn" id="settingsBtn">Nastavenia</button>
            <button class="btn" id="aboutBtn">Autor</button>
          </div>
        </div>
      </div>

      <!-- Nastavenia -->
      <div class="panel" id="settingsPanel" aria-modal="true">
        <div class="card">
          <h2>Nastavenia</h2>

          <div class="row">
            <label>Sila skoku <span class="val" id="vJumpVal"></span></label>
            <input type="range" id="vJump" min="12" max="36" step="1">
          </div>
          <div class="row">
            <label>Veľkosť medzery (ťažšie ← → ľahšie) <span class="val" id="gapVal"></span></label>
            <input type="range" id="gap" min="20" max="40" step="1">
          </div>
          <div class="row">
            <label>Pravdepodobnosť Bennyho v medzere <span class="val" id="bennyVal"></span></label>
            <input type="range" id="benny" min="0" max="100" step="5">
          </div>

          <button class="close" id="closeSettings">Hotovo</button>
        </div>
      </div>

      <!-- Autor -->
      <div class="panel" id="aboutPanel" aria-modal="true">
        <div class="card">
          <h2>Autor</h2>
          <div style="margin:6px 0 14px 0; line-height:1.5">
            Hru pripravil: <b>Matúš Bereš</b><br/>
            Verzia: 1.0 (mobil, tap-only)
          </div>
          <button class="close" id="closeAbout">Späť</button>
        </div>
      </div>
    </div>

    <footer>📱 Tap = skok • Tap po „Koniec“ = reštart • Menu pauzuje hru</footer>
  </div>

<script>
(() => {
  // ======= UI prvky =======
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const menuPanel = document.getElementById('menuPanel');
  const settingsPanel = document.getElementById('settingsPanel');
  const aboutPanel = document.getElementById('aboutPanel');

  const openMenu = document.getElementById('openMenu');
  const newGameBtn = document.getElementById('newGameBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const aboutBtn = document.getElementById('aboutBtn');
  const closeSettings = document.getElementById('closeSettings');
  const closeAbout = document.getElementById('closeAbout');

  // Nastavenia ovládače
  const vJump = document.getElementById('vJump');
  const gap   = document.getElementById('gap');
  const benny = document.getElementById('benny');
  const vJumpVal = document.getElementById('vJumpVal');
  const gapVal   = document.getElementById('gapVal');
  const bennyVal = document.getElementById('bennyVal');

  // ======= Uloženie rekordu & nastavení =======
  const BEST_KEY = 'flappy_blcha_benny_best_v1';
  const CFG_KEY  = 'flappy_blcha_benny_cfg_v1';
  let best = Number(localStorage.getItem(BEST_KEY) || 0);
  let cfg = loadCfg();

  function loadCfg(){
    const defaults = { vJump: 20, gapPct: 30, bennyPct: 45 };
    try{
      const raw = localStorage.getItem(CFG_KEY);
      if (!raw) return defaults;
      const obj = JSON.parse(raw);
      return Object.assign(defaults, obj);
    }catch{ return defaults; }
  }
  function saveCfg(){
    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
  }

  // Naplniť UI
  function syncSettingsUI(){
    vJump.value = cfg.vJump;
    gap.value   = cfg.gapPct;
    benny.value = cfg.bennyPct;
    vJumpVal.textContent = cfg.vJump;
    gapVal.textContent   = cfg.gapPct + '%';
    bennyVal.textContent = cfg.bennyPct + '%';
  }
  syncSettingsUI();

  // ======= Stav hry =======
  const STATE = { MENU:'menu', READY:'ready', PLAY:'play', OVER:'over', PAUSE:'pause' };
  let state = STATE.MENU;

  // Rozmery
  let W=0, H=0, DPR=1;

  // Svet
  const world = {};
  function recomputeWorld(){
    world.groundH = Math.max(20, H*0.10);
    world.fleaR   = Math.max(7,  H*0.025);
    world.gravity = H*0.00125;

    // sila skoku z nastavení (12..36) -> prepočítané na px/frame
    world.jumpV   = -H * (cfg.vJump/1000); // jednoduchá a intuitívna škála

    world.pipeW   = Math.max(24, H*0.08);

    // medzera z percent (20..40% výšky hracej plochy)
    world.gap     = Math.max(110, (cfg.gapPct/100) * (H - world.groundH));

    world.speed   = Math.max(2.2, H*0.0045);
    world.spawnDist = H*0.55;
    world.maxFall = H - world.groundH - world.fleaR;

    // Benny (pravdepodobnosť z nastavení)
    world.bennyW  = Math.max(28, H*0.09);
    world.bennyH  = Math.max(20, H*0.07);
    world.bennyProb = cfg.bennyPct/100;
    world.bennyOffsetMax = Math.max(0, world.gap*0.28);
  }

  // Hráč
  const flea = { x:0, y:0, vy:0, r:0, score:0 };

  // Prekážky
  const pipes = []; // {x, gapY, _scored?, benny?:{y,w,h}}
  let distSinceLast = 0;

  // ======= Reset hry =======
  function resetGame(full=true){
    DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));
    const rect = stage.getBoundingClientRect();
    W = Math.max(260, Math.floor(rect.width));
    H = Math.max(360, Math.floor(rect.height));
    canvas.width  = Math.floor(W*DPR);
    canvas.height = Math.floor(H*DPR);
    canvas.style.width  = W+'px';
    canvas.style.height = H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);

    recomputeWorld();

    flea.x = Math.floor(W*0.28);
    flea.y = Math.floor(H*0.45);
    flea.vy= 0;
    flea.r = world.fleaR;
    if (full) flea.score = 0;

    pipes.length = 0;
    distSinceLast = world.spawnDist*0.6;

    draw(0);
  }

  // ======= Herná logika =======
  function rand(min, max){ return Math.random()*(max-min)+min; }

  function spawnPipe(){
    const margin = H*0.18;
    const gapY = rand(margin, H - world.groundH - margin);
    const pipe = { x: W + world.pipeW, gapY };

    if (Math.random() < world.bennyProb){
      const offset = rand(-world.bennyOffsetMax, world.bennyOffsetMax);
      const by = gapY + offset;
      pipe.benny = { y: by, w: world.bennyW, h: world.bennyH };
    }

    pipes.push(pipe);
  }

  function circleRectHit(cx, cy, cr, rx, ry, rw, rh){
    const nx = Math.max(rx, Math.min(cx, rx+rw));
    const ny = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx - nx, dy = cy - ny;
    return (dx*dx + dy*dy) <= cr*cr;
  }

  // Kreslenie Bennyho
  function drawBenny(xCenter, yCenter, w, h){
    const x = xCenter - w/2;
    const y = yCenter - h/2;

    // telo
    const bodyW = w*0.68, bodyH = h*0.65;
    const gBody = ctx.createLinearGradient(x, y, x, y+bodyH);
    gBody.addColorStop(0, getCss('--benny1'));
    gBody.addColorStop(1, getCss('--benny2'));
    ctx.fillStyle = gBody; roundRect(x, y + h*0.2, bodyW, bodyH, Math.min(10, bodyH*0.35)); ctx.fill();

    // hlava
    const headR = Math.min(w,h)*0.22;
    const headCx = x + bodyW + headR*0.6;
    const headCy = y + h*0.45;
    const gHead = ctx.createLinearGradient(headCx, headCy-headR, headCx, headCy+headR);
    gHead.addColorStop(0, getCss('--benny1'));
    gHead.addColorStop(1, getCss('--benny2'));
    ctx.fillStyle = gHead; ctx.beginPath(); ctx.arc(headCx, headCy, headR, 0, Math.PI*2); ctx.fill();

    // ucho
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.ellipse(headCx - headR*0.4, headCy - headR*0.3, headR*0.35, headR*0.5, -0.3, 0, Math.PI*2); ctx.fill();

    // chvost
    ctx.fillStyle = getCss('--benny2'); roundRect(x - w*0.10, y + h*0.28, w*0.14, h*0.10, h*0.05); ctx.fill();

    // nohy
    ctx.fillStyle = getCss('--benny2');
    const legW = Math.max(4, w*0.14), legH = Math.max(4, h*0.22);
    roundRect(x + bodyW*0.25, y + h*0.62, legW, legH, 3); ctx.fill();
    roundRect(x + bodyW*0.55, y + h*0.62, legW, legH, 3); ctx.fill();

    // oko
    ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(headCx + headR*0.15, headCy - headR*0.1, headR*0.10, 0, Math.PI*2); ctx.fill();
  }

  function getCss(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim() || '#fff'; }
  function roundRect(x,y,w,h,r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr, y);
    ctx.arcTo(x+w, y,   x+w, y+h, rr);
    ctx.arcTo(x+w, y+h, x,   y+h, rr);
    ctx.arcTo(x,   y+h, x,   y,   rr);
    ctx.arcTo(x,   y,   x+w, y,   rr);
    ctx.closePath();
  }

  // Blcha
  function drawFlea(x, y, r){
    ctx.save(); ctx.translate(x, y);
    const bodyRx = r*1.2, bodyRy = r*0.9;
    const bodyGrad = ctx.createRadialGradient(-r*0.4, -r*0.3, 1, 0,0, bodyRx);
    bodyGrad.addColorStop(0, '#c6f6ff'); bodyGrad.addColorStop(1, getCss('--flea'));
    ctx.fillStyle = bodyGrad; ctx.beginPath(); ctx.ellipse(0, 0, bodyRx, bodyRy, 0, 0, Math.PI*2); ctx.fill();

    // segment
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = Math.max(1, r*0.12);
    ctx.beginPath(); ctx.arc(0, 0, bodyRy*0.9, -0.9, 0.9); ctx.stroke();

    // tykadlá
    ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = Math.max(1, r*0.12); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-r*0.6, -bodyRy); ctx.quadraticCurveTo(-r*1.0, -bodyRy*1.5, -r*0.4, -bodyRy*1.8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( r*0.6, -bodyRy); ctx.quadraticCurveTo( r*1.0, -bodyRy*1.5,  r*0.4, -bodyRy*1.8); ctx.stroke();

    // nožičky
    ctx.strokeStyle = 'rgba(180, 230, 255, .9)'; ctx.lineWidth = Math.max(1, r*0.10);
    const legLen = r*1.2;
    for (let i=-1;i<=1;i++){
      ctx.beginPath(); ctx.moveTo(-bodyRx*0.7, r*0.2*i); ctx.lineTo(-bodyRx*0.7 - legLen, r*0.2*i + legLen*0.1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo( bodyRx*0.7, r*0.2*i); ctx.lineTo( bodyRx*0.7 + legLen, r*0.2*i + legLen*0.1); ctx.stroke();
    }
    ctx.restore();
  }

  // Slučka
  let lastTs = 0;
  function loop(ts){
    const dt = Math.min(32, ts - lastTs || 16);
    lastTs = ts;

    if (state === STATE.PLAY){
      // fyzika
      flea.vy += world.gravity;
      flea.y  += flea.vy;

      if (flea.y < flea.r){ flea.y = flea.r; flea.vy = 0; }
      if (flea.y > world.maxFall){ flea.y = world.maxFall; gameOver(); }

      // posun a spawn
      distSinceLast += world.speed;
      if (distSinceLast >= world.spawnDist){ distSinceLast = 0; spawnPipe(); }
      for (let i=pipes.length-1;i>=0;i--){
        const p = pipes[i]; p.x -= world.speed;
        if (!p._scored && p.x + world.pipeW < flea.x){
          p._scored = true; flea.score++;
          if (flea.score > best){ best = flea.score; localStorage.setItem(BEST_KEY, String(best)); }
        }
        if (p.x + world.pipeW < -10) pipes.splice(i,1);
      }

      // kolízie
      for (const p of pipes){
        const topH = p.gapY - world.gap/2;
        const botY = p.gapY + world.gap/2;
        if (circleRectHit(flea.x, flea.y, flea.r, p.x, 0, world.pipeW, topH)) { gameOver(); break; }
        if (circleRectHit(flea.x, flea.y, flea.r, p.x, botY, world.pipeW, H - world.groundH - botY)) { gameOver(); break; }

        if (p.benny){
          const bx = p.x + world.pipeW/2, by = p.benny.y, bw = p.benny.w, bh = p.benny.h;
          const bodyX = bx - bw*0.45, bodyY = by - bh*0.25, bodyW = bw*0.7, bodyH = bh*0.5;
          const headX = bx + bw*0.15, headY = by - bh*0.30, headW = bw*0.35, headH = bh*0.35;
          if (circleRectHit(flea.x, flea.y, flea.r, bodyX, bodyY, bodyW, bodyH) ||
              circleRectHit(flea.x, flea.y, flea.r, headX, headY, headW, headH)) { gameOver(); break; }
        }
      }
    }

    draw(dt);
    requestAnimationFrame(loop);
  }

  function gameOver(){ if (state !== STATE.OVER) state = STATE.OVER; }
  function startPlayFromMenu(){
    hideAllPanels();
    state = STATE.READY;
    resetGame(true);
    // prvý tap spustí hru: zobrazíme jemný overlay text priamo kreslením (v READY režime)
  }

  // Kreslenie
  function draw(){
    // pozadie
    const grd = ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0, '#0b1020'); grd.addColorStop(0.75, '#0d1326');
    grd.addColorStop(0.76, '#121a2d'); grd.addColorStop(1, '#0e1629');
    ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

    // zem
    ctx.fillStyle = '#203048'; ctx.fillRect(0, H - world.groundH, W, 2);
    ctx.fillStyle = '#1b273d'; for (let x=0; x<W; x+=24){ ctx.fillRect(x, H - world.groundH + 6, 12, world.groundH - 6); }

    // rúry
    for (const p of pipes){
      const topH = p.gapY - world.gap/2;
      const botY = p.gapY + world.gap/2;

      ctx.fillStyle = getCss('--pipe1'); ctx.fillRect(p.x, 0, world.pipeW, topH);
      ctx.fillStyle = 'rgba(0,0,0,.2)';   ctx.fillRect(p.x+2, 0, world.pipeW-4, 4);

      ctx.fillStyle = getCss('--pipe2'); ctx.fillRect(p.x, botY, world.pipeW, H - world.groundH - botY);
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(p.x+2, botY, world.pipeW-4, 4);

      if (p.benny) drawBenny(p.x + world.pipeW/2, p.benny.y, p.benny.w, p.benny.h);
    }

    // blcha
    drawFlea(flea.x, flea.y, flea.r);

    // HUD (skóre / rekord)
    if (state !== STATE.MENU){
      ctx.fillStyle = 'rgba(15,23,42,.65)';
      ctx.fillRect(W-140, 10, 130, 34);
      ctx.fillRect(W-140, 50, 130, 28);
      ctx.fillStyle = '#e5e7eb'; ctx.font = 'bold 20px system-ui';
      ctx.fillText(`Skóre: ${flea.score}`, W-132, 34);
      ctx.font = 'bold 14px system-ui'; ctx.fillStyle = '#94a3b8';
      ctx.fillText(`Rekord: ${best}`, W-132, 68);
    }

    // Overlay READY/OVER
    if (state === STATE.READY || state === STATE.OVER){
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0,0,W,H);
      ctx.textAlign = 'center';
      if (state === STATE.READY){
        ctx.fillStyle = '#b8eaff'; ctx.font = 'bold 22px system-ui';
        ctx.fillText('Ťukni pre štart', W/2, H*0.42);
        ctx.fillStyle = '#94a3b8'; ctx.font = '600 14px system-ui';
        ctx.fillText('Preskáč rúry a Bennyho bloky', W/2, H*0.48);
      } else {
        ctx.fillStyle = '#ffb4b4'; ctx.font = 'bold 24px system-ui';
        ctx.fillText('Koniec hry', W/2, H*0.42);
        ctx.fillStyle = '#b8eaff'; ctx.font = 'bold 18px system-ui';
        ctx.fillText('Ťukni pre reštart', W/2, H*0.50);
      }
      ctx.textAlign = 'start';
    }
  }

  // ======= Ovládanie (tap only) =======
  function onTap(e){
    e.preventDefault();
    if (menuPanel.classList.contains('show') || settingsPanel.classList.contains('show') || aboutPanel.classList.contains('show')) return;

    if (state === STATE.MENU) return; // menu blokuje hru
    if (state === STATE.READY){
      state = STATE.PLAY;
      flea.vy = world.jumpV;
      return;
    }
    if (state === STATE.OVER){
      // reštart po konci
      flea.score = 0;
      state = STATE.READY;
      resetGame(false);
      setTimeout(()=>{ state = STATE.PLAY; flea.vy = world.jumpV; }, 80);
      return;
    }

    // počas hry = skok (jemný podľa nastavení)
    flea.vy = world.jumpV;
  }
  stage.addEventListener('pointerdown', onTap, {passive:false});
  stage.addEventListener('touchstart', onTap, {passive:false});

  // Zamedziť dvoj-ťuk zoom
  let lastTouch = 0;
  stage.addEventListener('touchend', (e)=>{
    const now = Date.now();
    if (now - lastTouch < 350) e.preventDefault();
    lastTouch = now;
  }, {passive:false});

  // ======= Panely =======
  function hideAllPanels(){ menuPanel.classList.remove('show'); settingsPanel.classList.remove('show'); aboutPanel.classList.remove('show'); }
  function showMenu(){ hideAllPanels(); menuPanel.classList.add('show'); state = STATE.MENU; }
  function showSettings(){ hideAllPanels(); settingsPanel.classList.add('show'); state = STATE.MENU; }
  function showAbout(){ hideAllPanels(); aboutPanel.classList.add('show'); state = STATE.MENU; }

  openMenu.addEventListener('click', showMenu);
  newGameBtn.addEventListener('click', ()=>{ startPlayFromMenu(); });
  settingsBtn.addEventListener('click', showSettings);
  aboutBtn.addEventListener('click', showAbout);
  closeSettings.addEventListener('click', ()=>{ saveCfg(); resetGame(false); showMenu(); });
  closeAbout.addEventListener('click', showMenu);

  // Settings handlers
  vJump.addEventListener('input', (e)=>{ cfg.vJump = Number(e.target.value); vJumpVal.textContent = cfg.vJump; });
  gap.addEventListener('input',   (e)=>{ cfg.gapPct = Number(e.target.value); gapVal.textContent   = cfg.gapPct + '%'; });
  benny.addEventListener('input', (e)=>{ cfg.bennyPct = Number(e.target.value); bennyVal.textContent = cfg.bennyPct + '%'; });

  // ======= Resize =======
  const ro = new ResizeObserver(()=> resetGame(false));
  ro.observe(stage);

  // ======= Štart =======
  resetGame(true);
  requestAnimationFrame(loop);
})();
