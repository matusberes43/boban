<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <title>Časová os filmov – Úspech vs. Neúspech</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      padding: 40px;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .form-container {
      max-width: 500px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 40px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .timeline {
      position: relative;
      max-width: 800px;
      margin: auto;
      padding-left: 20px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 4px;
      background: #ccc;
    }

    .entry {
      margin: 20px 0;
      padding-left: 30px;
      position: relative;
    }

    .entry::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 10px;
      width: 14px;
      height: 14px;
      background: #ccc;
      border-radius: 50%;
      z-index: 1;
    }

    .entry.success {
      border-left: 4px solid #28a745;
    }

    .entry.success::before {
      background: #28a745;
    }

    .entry.fail {
      border-left: 4px solid #dc3545;
    }

    .entry.fail::before {
      background: #dc3545;
    }

    .entry-content {
      background: #fff;
      padding: 15px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .entry h3 {
      margin: 0 0 10px;
    }

    .result {
      font-weight: bold;
      margin-top: 5px;
    }

  </style>
</head>
<body>

  <h1>Analýza filmov – Úspešnosť na časovej osi</h1>

  <div class="form-container">
    <label for="nazov">Názov filmu:</label>
    <input type="text" id="nazov" placeholder="Napr. Avatar">

    <label for="trzby">Tržby v kinách (€):</label>
    <input type="number" id="trzby" placeholder="Napr. 1000000000">

    <label for="rozpocet">Rozpočet (€):</label>
    <input type="number" id="rozpocet" placeholder="Napr. 250000000">

    <label for="marketing">Rozpočet na marketing (€):</label>
    <input type="number" id="marketing" placeholder="Napr. 150000000">

    <button onclick="pridajFilm()">Pridať film</button>
  </div>

  <div class="timeline" id="timeline">
    <!-- Dynamicky pridané filmy -->
  </div>

  <script>
    function pridajFilm() {
      const nazov = document.getElementById('nazov').value.trim();
      const trzby = parseFloat(document.getElementById('trzby').value);
      const rozpocet = parseFloat(document.getElementById('rozpocet').value);
      const marketing = parseFloat(document.getElementById('marketing').value);

      if (!nazov || isNaN(trzby) || isNaN(rozpocet) || isNaN(marketing)) {
        alert('Prosím, vyplň všetky polia správne.');
        return;
      }

      const celkovyRozpocet = rozpocet + marketing;
      const minimalnyZisk = celkovyRozpocet * 2.5;
      const uspesny = trzby >= minimalnyZisk;

      const timeline = document.getElementById('timeline');

      const entry = document.createElement('div');
      entry.className = 'entry ' + (uspesny ? 'success' : 'fail');

      const content = document.createElement('div');
      content.className = 'entry-content';

      content.innerHTML = `
        <h3>${nazov}</h3>
        <p>Tržby: €${trzby.toLocaleString()}</p>
        <p>Rozpočet: €${rozpocet.toLocaleString()}</p>
        <p>Marketing: €${marketing.toLocaleString()}</p>
        <p class="result">${uspesny ? '✅ Úspešný film' : '❌ Neúspešný film'}</p>
      `;

      entry.appendChild(content);
      timeline.appendChild(entry);

      // Reset formulára
      document.getElementById('nazov').value = '';
      document.getElementById('trzby').value = '';
      document.getElementById('rozpocet').value = '';
      document.getElementById('marketing').value = '';
    }
  </script>

</body>
</html>
