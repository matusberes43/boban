<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presná Kalkulačka Alkoholu v Krvi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .calculator {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .calculator input, .calculator select {
            margin: 5px 0;
            padding: 5px;
        }
        .calculator button {
            margin-top: 10px;
            padding: 10px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Kalkulačka Alkoholu v Krvi</h2>
        <select id="gender">
            <option value="male">Muž</option>
            <option value="female">Žena</option>
        </select>
        <input type="number" id="weight" placeholder="Hmotnosť (kg)" min="30" max="200">
        <input type="number" id="height" placeholder="Výška (cm)" min="100" max="250">
        <input type="number" id="shots" placeholder="Počet poldeciakrov" min="0">
        <select id="food">
            <option value="0">Nebolo jedlo</option>
            <option value="1">Ľahké jedlo</option>
            <option value="2">Stredné jedlo</option>
            <option value="3">Ťažké jedlo</option>
        </select>
        <select id="hydration">
            <option value="0">Bez zapíjania</option>
            <option value="1">Zapíjam vodou</option>
        </select>
        <button onclick="calculateBAC()">Vypočítať BAC</button>
        <div id="result"></div>
    </div>

    <script>
        function calculateBAC() {
            const gender = document.getElementById('gender').value;
            const weight = parseFloat(document.getElementById('weight').value) || 0;
            const height = parseFloat(document.getElementById('height').value) || 0;
            const shots = parseInt(document.getElementById('shots').value) || 0;
            const food = parseInt(document.getElementById('food').value);
            const hydration = parseInt(document.getElementById('hydration').value);

            // Základné konštanty
            const alcPerShot = 0.025 * 40; // 25 ml pri 40% je 10 gramov alkoholu
            const totalAlcohol = shots * alcPerShot; // v gramoch
            const r = gender === 'male' ? 0.68 : 0.55; // Podiel vody v tele (muži vs. ženy)
            const bmi = weight / ((height / 100) ** 2); // BMI
            let absorption = 1; // Koeficient absorpcie, predvolene 1

            // Úprava absorpcie na základe jedla a hydratácie
            absorption -= (food * 0.05); // Menej alkoholu sa absorbuje s jedlom
            if (hydration === 1) absorption -= 0.05; // Hydratácia mierne znižuje absorpciu

            // Výpočet BAC (Blood Alcohol Concentration)
            let bac = (totalAlcohol / (weight * r) * absorption).toFixed(3);

            // Výprava BAC podľa BMI (veľmi zjednodušené)
            if (bmi > 25) bac = (bac * 1.1).toFixed(3); // Obezita môže mierne zvyšovať BAC

            document.getElementById('result').innerText = `Približné promile: ${bac}‰`;
        }
    </script>
</body>
</html>
