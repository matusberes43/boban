<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodka Výber</title>
    <style>
        :root {
            --bottle-width: 120px;
            --bottle-height: 300px;
            --liquid-color: rgba(173, 216, 230, 0.8);
            --bottle-color: rgba(255, 255, 255, 0.9);
            --glass-thickness: 3px;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        .bottle-container {
            position: relative;
            width: var(--bottle-width);
            height: var(--bottle-height);
            margin: 2rem auto;
            perspective: 1000px;
        }

        .bottle {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--bottle-color);
            border: var(--glass-thickness) solid rgba(255, 255, 255, 0.5);
            border-radius: 20px 20px 50px 50px;
            overflow: hidden;
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--liquid-color);
            transition: height 0.5s ease-in-out, background-color 0.5s ease-in-out;
        }

        .label {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: black;
            background: rgba(255, 255, 255, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .menu {
            margin-top: 2rem;
        }

        .menu input {
            padding: 0.5rem;
            margin: 0.5rem;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            width: 100px;
        }

        .menu button {
            padding: 0.5rem 1rem;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .menu button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Vyberte si veľkosť vodky</h1>
    <select id="volumeSelect">
        <option value="0.7">0.7 litrov (700 ml)</option>
        <option value="1">1 liter (1000 ml)</option>
    </select>
    <div class="bottle-container">
        <div class="bottle">
            <div id="liquid" class="liquid"></div>
            <div id="label" class="label">0.7L</div>
        </div>
    </div>
    <div class="menu">
        <label for="totalShots">Celkový počet pohárov:</label>
        <input type="number" id="totalShots" min="1" value="32">
        <label for="remainingShots">Zostávajúce poháre:</label>
        <input type="number" id="remainingShots" min="0" value="32">
        <button onclick="updateLiquid()">Aktualizovať</button>
    </div>
</div>

<script>
    const volumeSelect = document.getElementById('volumeSelect');
    const liquid = document.getElementById('liquid');
    const label = document.getElementById('label');
    const totalShots = document.getElementById('totalShots');
    const remainingShots = document.getElementById('remainingShots');

    // Konštanty pre prevod pohárov na objem
    const SHOT_VOLUME_ML = 350 / 16; // 1 pohár = 21.875 ml

    // Funkcia na interpoláciu farby
    function interpolateColor(color1, color2, factor) {
        const result = color1.slice();
        for (let i = 0; i < 3; i++) {
            result[i] = Math.round(result[i] + factor * (color2[i] - color1[i]));
        }
        return `rgb(${result[0]}, ${result[1]}, ${result[2]})`;
    }

    // Funkcia na aktualizáciu tekutiny
    function updateLiquid() {
        const total = parseInt(totalShots.value);
        const remaining = parseInt(remainingShots.value);
        const consumed = total - remaining;
        const percentageRemaining = (remaining / total) * 100;

        // Aktualizácia výšky tekutiny
        liquid.style.height = `${percentageRemaining}%`;

        // Zmena farby tekutiny (od modrej po červenú)
        const startColor = [173, 216, 230]; // Svetlomodrá
        const endColor = [255, 0, 0];       // Červená
        const colorFactor = (100 - percentageRemaining) / 100;
        liquid.style.backgroundColor = interpolateColor(startColor, endColor, colorFactor);

        // Aktualizácia objemu
        const volumeMl = remaining * SHOT_VOLUME_ML;
        label.textContent = `${(volumeMl / 1000).toFixed(2)}L`;
    }

    // Funkcia na zmenu veľkosti fľaše
    volumeSelect.addEventListener('change', (event) => {
        const selectedVolume = parseFloat(event.target.value);
        const totalShotsValue = Math.round((selectedVolume * 1000) / SHOT_VOLUME_ML);
        totalShots.value = totalShotsValue;
        remainingShots.value = totalShotsValue;
        label.textContent = `${selectedVolume}L`;
        updateLiquid();
    });

    // Inicializácia
    updateLiquid();
</script>

</body>
</html>
