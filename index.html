<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Žebříček recenzentů</title>
  <style>
    /* CSS proměnné */
    :root {
      --primary-color: #2b6cb0;
      --secondary-color: #48bb78;
      --danger-color: #f56565;
      --warning-color: #f6ad55;
      --background-dark: #1a202c;
      --text-dark: #e2e8f0;
      --surface-dark: #2d3748;
      --border-dark: #4a5568;
      --shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      --transition: all 0.3s ease;
    }

    /* Obecné štýly */
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background-dark);
      color: var(--text-dark);
      margin: 0;
      padding: 2rem;
      line-height: 1.6;
    }

    /* Nadpisy */
    h1 {
      text-align: center;
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text-dark);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: var(--text-dark);
    }

    /* Kontejner pre vyhľadávanie a legendu */
    .search-legend-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      background: var(--surface-dark);
      padding: 1rem;
      border-radius: 8px;
    }

    /* Vstupné pole */
    #searchInput {
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
      max-width: 20rem;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background: var(--surface-dark);
      color: var(--text-dark);
      transition: var(--transition);
    }

    #searchInput:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.2);
    }

    /* Legenda */
    .legend {
      display: flex;
      gap: 1rem;
      align-items: center;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-square {
      width: 1rem;
      height: 1rem;
      border-radius: 4px;
    }

    .legend-square.month-warning {
      animation: softPulseMonth 2.5s ease-in-out infinite;
    }

    /* Tabulka */
    .table-wrapper {
      width: 100%;
      max-width: 80rem;
      margin: 0 auto;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface-dark);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 0.75rem 1rem;
      text-align: center;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--border-dark);
      height: 50px; /* Jednotná výška riadkov */
    }

    thead {
      background: var(--primary-color);
      color: #ffffff;
    }

    th {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr {
      transition: background-color 0.3s ease;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .rank {
      display: inline-block;
      width: 30px;
      text-align: center;
      color: #a0aec0;
    }

    .team-logo {
      width: 24px;
      height: 24px;
      vertical-align: middle;
      margin-right: 0.5rem;
      border-radius: 50%;
    }

    .score {
      font-weight: 600;
      color: var(--text-dark);
      position: relative;
      padding-right: 20px;
    }

    .score::after {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      transition: all 0.3s ease;
    }

    /* Simulácia pohyblivého skóre */
    tr:nth-child(odd) .score::after {
      content: '+1';
      color: #48bb78;
    }

    tr:nth-child(even) .score::after {
      content: '-1';
      color: #f56565;
    }

    .punisher-row {
      background: linear-gradient(90deg, #ecc94b, #f6e05e);
      font-weight: 700;
      border: 2px solid var(--text-dark);
    }

    .phantom-row {
      background: rgba(100, 100, 100, 0.4);
      font-style: italic;
      opacity: 0.8;
      border: 1px dashed var(--text-dark);
    }

    /* Urgentní odpočet */
    .urgent-countdown {
      color: var(--danger-color);
      font-weight: 700;
    }

    /* Animace pro varování */
    @keyframes softPulseMonth {
      0%, 100% { background-color: transparent; }
      50% { background-color: rgba(246, 173, 85, 0.3); }
    }

    .month-warning {
      animation: softPulseMonth 2.5s ease-in-out infinite;
    }

    /* Tooltip */
    .tooltip {
      position: relative;
    }

    .tooltip .tooltip-text {
      visibility: hidden;
      width: 14rem;
      background: var(--surface-dark);
      color: var(--text-dark);
      text-align: left;
      padding: 0.75rem;
      border-radius: 8px;
      position: absolute;
      z-index: 10;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    .tooltip:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
      transform: translateX(-50%) translateY(-5px);
    }

    .tooltip-text::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: var(--surface-dark) transparent transparent transparent;
    }

    /* Progress bar */
    #progress-container,
    #customTargetContainer,
    #phantomForm {
      width: 100%;
      max-width: 40rem;
      margin: 2rem auto;
      text-align: center;
      background: var(--surface-dark);
      padding: 1rem;
      border-radius: 8px;
    }

    .progress-bar-bg {
      background: var(--border-dark);
      border-radius: 1rem;
      height: 1.5rem;
      overflow: hidden;
      margin-top: 0.5rem;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--secondary-color), #81e6d9);
      text-align: right;
      color: #1a202c;
      font-weight: 600;
      padding-right: 0.5rem;
      line-height: 1.5rem;
      transition: width 1s ease-in-out;
    }

    /* Formulář */
    #phantomForm {
      padding: 1.5rem;
    }

    #phantomForm label {
      display: block;
      margin: 0.75rem 0 0.25rem;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-dark);
    }

    #phantomForm input,
    #phantomForm select {
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
      max-width: 15rem;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background: var(--surface-dark);
      color: var(--text-dark);
      transition: var(--transition);
    }

    #phantomForm input:focus,
    #phantomForm select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.2);
    }

    #phantomForm button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      background: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }

    #phantomForm button:hover {
      background: #2c5282;
    }

    #phantomResult {
      margin-top: 1rem;
      font-size: 1rem;
      color: var(--text-dark);
    }

    /* Responzivní design */
    @media (max-width: 768px) {
      body {
        padding: 1rem;
      }

      h1 {
        font-size: 1.75rem;
      }

      .search-legend-container {
        flex-direction: column;
        gap: 1rem;
      }

      #searchInput {
        max-width: 100%;
      }

      .legend {
        justify-content: center;
      }

      .tooltip .tooltip-text {
        width: 12rem;
        font-size: 0.875rem;
      }

      #phantomForm input,
      #phantomForm select {
        max-width: 100%;
      }

      th, td {
        padding: 0.75rem;
        font-size: 0.875rem;
      }
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.5rem;
      }

      th, td {
        padding: 0.5rem;
        font-size: 0.8rem;
      }
    }

    /* Animace při načítání tabulky */
    @keyframes slideIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    tr {
      animation: slideIn 0.5s ease forwards;
      animation-delay: calc(var(--row-index) * 0.05s);
    }
  </style>
</head>
<body>
  <h1>Žebříček recenzentů s živým odpočtem</h1>

  <div class="search-legend-container">
    <input type="text" id="searchInput" placeholder="Hledej uživatele..." onkeyup="filterTable()">
    <div class="legend">
      <div class="legend-item">
        <div class="legend-square" style="background-color: #f56565;"></div>
        <span>Překonání do 24 hodin</span>
      </div>
      <div class="legend-item">
        <div class="legend-square month-warning"></div>
        <span>Překonání do 1 měsíce</span>
      </div>
    </div>
  </div>

  <div class="table-wrapper">
    <table id="reviewTable">
      <thead>
        <tr>
          <th scope="col">Pořadí</th>
          <th scope="col">Uživatel</th>
          <th scope="col">Počet recenzí</th>
          <th scope="col">Dní do překonání</th>
          <th scope="col">Datum překonání</th>
          <th scope="col">Odpočet</th>
        </tr>
      </thead>
      <tbody>
        <!-- Sem doplňte užívateľov ručne -->
      </tbody>
    </table>
  </div>

  <!-- Výběr uživatele pro porovnání -->
  <div id="customTargetContainer">
    <label for="userSelect"><strong>Porovnat se s uživatelem:</strong></label>
    <select id="userSelect" onchange="updateCustomProgress()">
      <option value="">– Vyber uživatele –</option>
    </select>
    <div id="custom-progress-wrapper" style="display:none; margin-top: 15px;">
      <p><span id="custom-progress-text"></span></p>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="custom-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- Progress bar pro postup k 1. místu -->
  <div id="progress-container">
    <p><strong>Postup k 1. místu:</strong> <span id="progress-text"></span></p>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-bar"></div>
    </div>
  </div>

  <!-- Formulář pro fantomový náhled -->
  <div id="phantomForm">
    <h2>Simulace postupu PunisherEDNA</h2>
    <label for="dailyReviews">Denní přírůstek recenzí:</label>
    <input type="number" id="dailyReviews" min="1" value="40" placeholder="např. 50">
    
    <label for="simulationDays">Počet dní simulace:</label>
    <input type="number" id="simulationDays" min="1" value="30" placeholder="např. 30">
    
    <label for="targetUser">Cílový uživatel (nepovinné):</label>
    <select id="targetUser">
      <option value="">– Vyber uživatele –</option>
    </select>
    
    <button onclick="showPhantomRow()">Spustit simulaci</button>
    <div id="phantomResult"></div>
    <div id="phantom-progress-wrapper" style="display:none; margin-top: 15px;">
      <p><span id="phantom-progress-text"></span></p>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="phantom-progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // Filtrování tabulky
    function filterTable() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#reviewTable tbody tr:not(.phantom-row)");
      rows.forEach(row => {
        const username = row.cells[1].textContent.toLowerCase();
        row.style.display = username.includes(input) ? "" : "none";
      });
    }

    // Odpočet
    function updateAllCountdowns() {
      document.querySelectorAll("[id^=countdown]").forEach(span => {
        const targetDate = span.dataset.targetDate;
        const target = new Date(targetDate);
        const now = new Date();
        const diff = target - now;
        const row = span.closest("tr");

        row.classList.remove("month-warning");
        span.classList.remove("urgent-countdown", "prekonan");

        if (diff <= 0) {
          span.innerText = "Překonán!";
          span.classList.add("prekonan");
          return;
        }

        if (diff <= 24 * 60 * 60 * 1000) {
          span.classList.add("urgent-countdown");
        } else if (diff <= 30 * 24 * 60 * 60 * 1000) {
          row.classList.add("month-warning");
        }

        const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30));
        const days = Math.floor(diff / (1000 * 60 * 60 * 24)) % 30;
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);
        span.innerText = `${months}m ${days}d ${hours}h ${minutes}m ${seconds}s`;
      });
    }
    setInterval(updateAllCountdowns, 1000);

    // Výpočet aktuálních recenzí PunisherEDNA
    const startDate = new Date("2025-05-04");
    const initialReviews = 4665;
    const dailyGain = 40;
    const today = new Date();
    const daysSinceStart = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
    const currentPunisherReviews = initialReviews + daysSinceStart * dailyGain;

    // Vložení PunisherEDNA do tabulky
    const table = document.querySelector("#reviewTable tbody");
    const rows = Array.from(table.rows);
    let inserted = false;
    let overtakenCount = 0;

    for (let i = 0; i < rows.length; i++) {
      const reviewCount = parseInt(rows[i].cells[2].textContent);
      if (currentPunisherReviews >= reviewCount) {
        overtakenCount++;
        const newRow = table.insertRow(i);
        newRow.classList.add("punisher-row");
        newRow.innerHTML = `<td><span class="rank">${i + 1}</span></td><td><img src="https://via.placeholder.com/24" alt="PunisherEDNA" class="team-logo"><span class="tooltip"><a href="2012.html" target="_blank">PunisherEDNA</a><span class="tooltip-text">Počet recenzí: ${currentPunisherReviews}<br>Denní přírůstek: 40<br>Překonáno uživatelů: ${overtakenCount}</span></span></td><td><span class="score">${currentPunisherReviews}</span></td><td>0</td><td>dnes</td><td>-</td>`;
        inserted = true;
        break;
      }
    }

    if (!inserted) {
      const newRow = table.insertRow();
      newRow.classList.add("punisher-row");
      newRow.innerHTML = `<td><span class="rank">${rows.length + 1}</span></td><td><img src="https://via.placeholder.com/24" alt="PunisherEDNA" class="team-logo"><span class="tooltip"><a href="2012.html" target="_blank">PunisherEDNA</a><span class="tooltip-text">Počet recenzí: ${currentPunisherReviews}<br>Denní přírůstek: 40<br>Překonáno uživatelů: ${overtakenCount}</span></span></td><td><span class="score">${currentPunisherReviews}</span></td><td>0</td><td>dnes</td><td>-</td>`;
    }

    Array.from(table.rows).forEach((row, idx) => {
      row.cells[0].textContent = idx + 1;
    });

    // Famtomový náhled postupu
    function showPhantomRow() {
      const existingPhantom = document.querySelector(".phantom-row");
      if (existingPhantom) existingPhantom.remove();

      const dailyReviews = parseInt(document.getElementById("dailyReviews").value);
      const simulationDays = parseInt(document.getElementById("simulationDays").value);
      const targetUser = document.getElementById("targetUser").value;

      if (!dailyReviews || dailyReviews < 1) {
        document.getElementById("phantomResult").innerText = "Zadej platný počet recenzí za den.";
        return;
      }
      if (!simulationDays || simulationDays < 1) {
        document.getElementById("phantomResult").innerText = "Zadej platný počet dní simulace.";
        return;
      }

      const phantomReviews = currentPunisherReviews + dailyReviews * simulationDays;
      let targetUserReviews = 23867;
      let targetUserName = "corpSy";
      let targetPosition = 1;

      if (targetUser) {
        const rows = Array.from(table.rows).filter(row => !row.classList.contains("phantom-row"));
        for (let i = 0; i < rows.length; i++) {
          const name = rows[i].cells[1].textContent.trim();
          if (name === targetUser) {
            targetUserReviews = parseInt(rows[i].cells[2].textContent);
            targetUserName = name;
            targetPosition = i + 1;
            break;
          }
        }
      }

      const daysToTarget = Math.ceil((targetUserReviews - currentPunisherReviews) / dailyReviews);

      let phantomPosition = 1;
      let inserted = false;
      const rowsFiltered = Array.from(table.rows).filter(row => !row.classList.contains("phantom-row"));
      for (let i = 0; i < rowsFiltered.length; i++) {
        const reviewCount = parseInt(rowsFiltered[i].cells[2].textContent);
        if (phantomReviews >= reviewCount) {
          const newRow = table.insertRow(i);
          newRow.classList.add("phantom-row");
          newRow.innerHTML = `<td><span class="rank">${i + 1}</span></td><td><img src="https://via.placeholder.com/24" alt="PunisherEDNA" class="team-logo"><span class="tooltip">PunisherEDNA (simulace)<span class="tooltip-text">Simulovaný počet recenzí: ${phantomReviews}<br>Denní přírůstek: ${dailyReviews}<br>Simulováno pro ${simulationDays} dní</span></span></td><td><span class="score">${phantomReviews}</span></td><td>-</td><td>-</td><td>-</td>`;
          inserted = true;
          phantomPosition = i + 1;
          break;
        }
      }

      if (!inserted) {
        const newRow = table.insertRow();
        newRow.classList.add("phantom-row");
        newRow.innerHTML = `<td><span class="rank">${rowsFiltered.length + 1}</span></td><td><img src="https://via.placeholder.com/24" alt="PunisherEDNA" class="team-logo"><span class="tooltip">PunisherEDNA (simulace)<span class="tooltip-text">Simulovaný počet recenzí: ${phantomReviews}<br>Denní přírůstek: ${dailyReviews}<br>Simulováno pro ${simulationDays} dní</span></span></td><td><span class="score">${phantomReviews}</span></td><td>-</td><td>-</td><td>-</td>`;
        phantomPosition = rowsFiltered.length + 1;
      }

      Array.from(table.rows).forEach((row, idx) => {
        row.cells[0].textContent = idx + 1;
      });

      let resultText = `S ${dailyReviews} recenzemi denně bys za ${simulationDays} dní měl ${phantomReviews} recenzí a byl bys na ${phantomPosition}. místě.\n`;
      if (phantomReviews >= targetUserReviews) {
        resultText += `Už bys překonal ${targetUserName}!`;
      } else {
        resultText += `Překonáš ${targetUserName} (pozice ${targetPosition}) za ${daysToTarget} dní.`;
      }
      document.getElementById("phantomResult").innerText = resultText;

      const percent = Math.min(100, ((phantomReviews / targetUserReviews) * 100).toFixed(2));
      const remaining = targetUserReviews - phantomReviews;
      const wrapper = document.getElementById("phantom-progress-wrapper");
      const textEl = document.getElementById("phantom-progress-text");
      const barEl = document.getElementById("phantom-progress-bar");

      wrapper.style.display = "block";
      if (remaining <= 0) {
        textEl.textContent = `Překonal jsi ${targetUserName}!`;
        textEl.style.color = "red";
        textEl.style.fontWeight = "bold";
        barEl.style.width = "100%";
      } else {
        textEl.textContent = `${phantomReviews} z ${targetUserReviews} recenzí (${percent} %) — zbývá ${remaining}`;
        textEl.style.color = "";
        textEl.style.fontWeight = "";
        barEl.style.width = percent + "%";
      }
    }

    // Aktualizace progress baru pro postup k 1. místu
    function updateProgressBar() {
      const punisher = currentPunisherReviews;
      const topUser = 23867;
      const remaining = topUser - punisher;
      const percent = Math.min(100, ((punisher / topUser) * 100).toFixed(2));
      document.getElementById("progress-text").textContent = `${punisher} z ${topUser} recenzí (${percent} %) — zbývá ${remaining}`;
      document.getElementById("progress-bar").style.width = percent + "%";
    }
    updateProgressBar();

    // Aktualizace progress baru pro porovnání
    function updateCustomProgress() {
      const select = document.getElementById("userSelect");
      const selectedName = select.value;
      const rows = document.querySelectorAll("#reviewTable tbody tr:not(.phantom-row)");
      let targetReviews = null;

      rows.forEach(row => {
        const name = row.cells[1].textContent.trim();
        if (name === selectedName) {
          targetReviews = parseInt(row.cells[2].textContent);
        }
      });

      if (!targetReviews) {
        document.getElementById("custom-progress-wrapper").style.display = "none";
        return;
      }

      const current = currentPunisherReviews;
      const percent = Math.min(100, ((current / targetReviews) * 100).toFixed(2));
      const remaining = targetReviews - current;
      const wrapper = document.getElementById("custom-progress-wrapper");
      const textEl = document.getElementById("custom-progress-text");
      const barEl = document.getElementById("custom-progress-bar");

      wrapper.style.display = "block";
      if (remaining <= 0) {
        textEl.textContent = "Uživatel překonán!";
        textEl.style.color = "red";
        textEl.style.fontWeight = "bold";
        barEl.style.width = "100%";
      } else {
        textEl.textContent = `${current} z ${targetReviews} recenzí (${percent} %) — zbývá ${remaining}`;
        textEl.style.color = "";
        textEl.style.fontWeight = "";
        barEl.style.width = percent + "%";
      }
    }

    // Naplnění dropdownů
    function fillUserDropdown() {
      const select = document.getElementById("userSelect");
      const targetSelect = document.getElementById("targetUser");
      const rows = document.querySelectorAll("#reviewTable tbody tr:not(.phantom-row)");
      rows.forEach(row => {
        const name = row.cells[1].textContent.trim();
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        select.appendChild(option);
        const targetOption = document.createElement("option");
        targetOption.value = name;
        targetOption.textContent = name;
        targetSelect.appendChild(targetOption);
      });
    }

    // Inicializace
    document.addEventListener("DOMContentLoaded", () => {
      fillUserDropdown();
      updateAllCountdowns();
    });
  </script>
</body>
</html>
