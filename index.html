<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHAGUNS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0A1624;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .logo h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            letter-spacing: 3px;
            color: #ffffff;
            cursor: pointer;
        }

        .logo .rival {
            color: #6CFF47;
        }

        .categories p {
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            margin: 10px 0;
        }

        .buttons {
            margin-top: 50px;
        }

        .join-button, .login-button {
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            text-decoration: none;
            color: #0A1624;
        }

        .join-button {
            background-color: #6CFF47;
        }

        .login-button {
            background-color: transparent;
            border: 2px solid #6CFF47;
            color: #ffffff;
        }

        .form-container {
            display: none;
            background-color: #0E2436;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-methods {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .login-methods div {
            width: 50px;
            height: 50px;
            background-color: #102C4A;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .login-methods div img {
            width: 24px;
            height: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #102C4A;
            border: none;
            border-radius: 5px;
            color: #ffffff;
        }

        .promo-code {
            background: #0C1E32;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
        }

        .sign-up-button {
            width: 100%;
            padding: 15px;
            background-color: #6CFF47;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            color: #0A1624;
            cursor: pointer;
        }

        .terms {
            margin-top: 20px;
            font-size: 12px;
            color: #A0A0A0;
            text-align: center;
        }

        .terms a {
            color: #0078d4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <!-- Logo -->
        <div class="logo" onclick="reloadPage()">
            <h1><span class="grid">BLCHA</span><span class="rival">GUNS</span></h1>
        </div>

        <!-- Categories -->
        <div class="categories">
            <p>PIŠTOLE</p>
            <p>ÚTOČNÉ PUŠKY</p>
            <p>ODSTREĽOVACIE PUŠKY</p>
            <p>REVOLVERY</p>
            <p>BROKOVNICE</p>
            <p>VZDUCHOVÉ ZBRANE</p>
            <p>PRÍSLUŠENSTVO</p>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <a href="#" class="join-button" onclick="showForm()">Join The Club</a>
            <a href="#" class="login-button">Login</a>
        </div>
    </div>

    <!-- Registration Form -->
    <div class="form-container" id="form-container">
        <h2>Create an Account</h2>
        <div class="login-methods">
            <div><img src="https://img.icons8.com/ios-filled/50/ffffff/email.png" alt="Email"></div>
            <div><img src="https://img.icons8.com/ios-filled/50/ffffff/mac-os.png" alt="Apple"></div>
            <div><img src="https://img.icons8.com/ios-filled/50/ffffff/google-logo.png" alt="Google"></div>
        </div>
        <input type="text" placeholder="Choose a Username">
        <input type="email" placeholder="Enter Your Email Address">
        <input type="password" placeholder="Create a Password">
        <div class="promo-code">+ PROMO / REFERRAL CODE</div>
        <div class="sign-up-button">Sign Up</div>
        <div class="terms">
            By signing up, you agree to the <a href="#">Terms of Service</a>, <a href="#">Privacy Policy</a>, and <a href="#">Unofficial Application Notice</a>.
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Reload page when clicking on the logo
        function reloadPage() {
            location.reload();
        }

        // Show registration form
        function showForm() {
            document.getElementById('main-container').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
        }
    </script>
</body>
</html>
