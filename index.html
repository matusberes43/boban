<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Webstránka</title>
    <style>
        header {
            background-color: #f4f4f4; /* Predvolená farba, ktorá sa zmení podľa loga */
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 50px;
            width: auto;
        }

        .icons {
            display: flex;
            gap: 15px;
        }

        .icons a {
            color: #333;
            text-decoration: none;
            font-size: 20px;
        }

        /* Prispôsobenie farby pozadia podľa loga */
        header {
            background-color: #0047AB; /* Približná farba pozadia loga */
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="https://i.postimg.cc/Fzr55K8Y/IMG-7619.jpg" alt="Logo">
        </div>
        <nav class="icons">
            <a href="#"><i class="fas fa-home"></i></a>
            <a href="#"><i class="fas fa-user"></i></a>
            <a href="#"><i class="fas fa-envelope"></i></a>
        </nav>
    </header>
    <!-- Poznámka: Pre ikony použite Font Awesome alebo iný zdroj ikon -->
</body>
</html>
