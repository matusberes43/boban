<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmová databáza</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Hlavička a navigácia -->
    <header>
        <div class="container">
            <div class="logo">ČSFD</div>
            <nav>
                <ul>
                    <li><a href="#">Novinky</a></li>
                    <li><a href="#">Televízia</a></li>
                    <li><a href="#">Kino</a></li>
                    <li><a href="#">VOD</a></li>
                    <li><a href="#">Žebříčky</a></li>
                    <li><a href="#">Blu-ray</a></li>
                </ul>
            </nav>
            <div class="search">
                <input type="text" placeholder="Hľadať...">
                <button>🔍</button>
            </div>
        </div>
    </header>

    <!-- Carousel sekcia -->
    <section class="carousel">
        <h2>Nové trailery a rozhovory</h2>
        <div class="carousel-container">
            <button class="carousel-btn prev">❮</button>
            <div class="carousel-items">
                <div class="carousel-item">
                    <img src="https://via.placeholder.com/800x400" alt="Trailer 1">
                </div>
                <div class="carousel-item">
                    <img src="https://via.placeholder.com/800x400" alt="Trailer 2">
                </div>
                <div class="carousel-item">
                    <img src="https://via.placeholder.com/800x400" alt="Trailer 3">
                </div>
            </div>
            <button class="carousel-btn next">❯</button>
        </div>
    </section>

    <!-- Sekcia s partnermi a reklamami -->
    <section class="partners">
        <h3>Partnerom sály je <strong>Aneta</strong></h3>
        <div class="ad-banner">
            <img src="https://via.placeholder.com/300x100" alt="Reklama">
        </div>
    </section>

    <!-- Sekcia s odporúčaniami -->
    <section class="recommend">
        <h2>Nenechajte si ujsť na <span class="highlight">prima+</span></h2>
        <div class="movie-grid">
            <div class="movie-card">
                <img src="https://via.placeholder.com/200x300" alt="Film 1">
                <p>HONEYMOON</p>
            </div>
            <div class="movie-card">
                <img src="https://via.placeholder.com/200x300" alt="Film 2">
                <p>VE SLUŽBĚ</p>
            </div>
        </div>
    </section>

    <!-- Päta -->
    <footer>
        <p>&copy; 2024 Filmová databáza. Všetky práva vyhradené.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
