<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konšpiračné teórie</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="https://i.postimg.cc/SRB3XQ6G/IMG-7822.jpg" alt="Logo" class="logo">
    </div>
  </header>

  <!-- Sekundárny header -->
  <div class="secondary-header">
    <div class="box" id="usa-box">KONŠPIRAČNÉ TEÓRIE USA</div>
    <div class="box" id="world-box">KONŠPIRAČNÉ TEÓRIE SVET</div>
  </div>

  <!-- Boxy pre zobrazenie obsahu -->
  <div class="content" id="content-box">
    <!-- Sem sa dynamicky vložia boxy podľa výberu -->
  </div>

  <!-- Resetovacie tlačidlo -->
  <div class="reset-button">Resetovať obsah</div>

  <!-- Interaktívne tlačidlo -->
  <div class="interactive-button">
    <span class="icon">🌙</span> Režim tmavého svetla
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2023 Konšpiračné teórie. Všetky práva vyhradené.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
