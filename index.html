<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>ZBRANE</title>
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="left-section">
            <i class="fas fa-bars menu-icon" aria-label="Menu"></i>
        </div>
        <div class="logo">
            <a href="#" onclick="smoothReload();">
                <img src="https://i.postimg.cc/VLP3mtXR/IMG-7653.png" alt="Company Logo">
            </a>
        </div>
        <div class="right-section">
            <i class="fas fa-shopping-cart cart-icon" aria-label="Shopping Cart"></i>
            <i class="fas fa-user login-icon" aria-label="User Login"></i>
        </div>
    </header>

    <!-- Benefits Section -->
    <section class="benefits-section">
        <div class="benefit-item">
            <i class="fas fa-truck"></i>
            <h2>DOPRAVA ZDARMA NA VYBRANÉ POLOŽKY</h2>
        </div>
        <div class="benefit-item">
            <i class="fas fa-money-check-alt"></i>
            <h2>BEZ SKRYTÝCH POPLATKOV</h2>
        </div>
        <div class="benefit-item">
            <i class="fas fa-award"></i>
            <h2>DOŽIVOTNÁ ZÁRUKA NA NOVÉ ZBRANE</h2>
        </div>
    </section>

    <!-- Banner Section -->
    <section class="banner-section">
        <img src="https://i.postimg.cc/2Srnhv12/IMG-7665.jpg" alt="Banner">
    </section>

    <!-- Weapons Category Section -->
    <section class="category-section">
        <a href="#" class="category-link">
            <img src="https://i.postimg.cc/52qj6Qk2/IMG-7669.jpg" alt="Category Image">
            <h2>PISTOLE</h2>
        </a>
        <a href="#" class="category-link">
            <img src="https://i.postimg.cc/kMttKxcJ/IMG-7679.jpg" alt="Category Image">
            <h2>REVOLVERY</h2>
        </a>
        <!-- ... ďalšie kategórie -->
    </section>

    <!-- Jemný efekt kliknutia -->
    <script>
        function smoothReload() {
            document.body.style.opacity = "0";
            setTimeout(() => location.reload(), 300);
        }
    </script>
</body>
</html>
