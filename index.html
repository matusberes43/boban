<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Stránka</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" />
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #1a1a1a;
            color: white;
            padding: 10px 0;
            position: relative;
            height: 60px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 100%;
        }

        .logo img {
            height: 40px;
            width: auto;
            max-height: 100%;
        }

        .header-nav {
            display: flex;
            align-items: center;
        }

        .header-nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
        }

        .header-nav ul li {
            margin-left: 20px;
        }

        .header-nav ul li a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            transition: background-color 0.3s;
            user-select: none;
        }

        .header-nav ul li a:hover {
            background-color: #333;
        }

        .search-bar {
            position: absolute;
            top: 100%;
            right: 20px;
            width: calc(100vw - 40px);
            max-width: 200px;
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 5px;
            display: none;
        }

        .search-bar input {
            width: 100%;
            padding: 5px;
            border: none;
            outline: none;
        }

        @media screen and (max-width: 600px) {
            .header-nav ul {
                justify-content: center;
            }

            .header-nav ul li {
                margin: 5px 10px;
            }

            .search-bar {
                width: calc(100% - 40px);
                right: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <img src="https://i.postimg.cc/mrJ15Wyq/IMG-7625.png" alt="Logo">
            </div>
            <nav class="header-nav">
                <ul>
                    <li><a href="#" class="login"><i class="fas fa-user"></i></a></li>
                    <li><a href="#" class="register"><i class="fas fa-address-card"></i></a></li>
                    <li><a href="#" class="search-icon"><i class="fas fa-search"></i></a></li>
                </ul>
            </nav>
        </div>
        <div class="search-bar" style="display: none;">
            <input type="text" placeholder="Hľadať...">
        </div>
    </header>

    <script>
        document.querySelector('.search-icon').addEventListener('click', function(e) {
            e.preventDefault();
            var searchBar = document.querySelector('.search-bar');
            searchBar.style.display = searchBar.style.display === "none" ? "block" : "none";
            if (searchBar.style.display === "block") {
                searchBar.querySelector('input').focus();
            }
        });
    </script>
</body>
</html>
