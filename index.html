<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fľaša s Hladinou a Promile</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            margin-bottom: 20px;
        }
        img {
            width: 300px; /* Príklad veľkosti, upravte podľa potreby */
            height: auto;
        }
        #level-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-top: 2px solid red;
            background-color: rgba(0, 255, 0, 0.3);
        }
        .promile-table {
            text-align: center;
        }
        .promile-table td {
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://i.postimg.cc/Hj9nPTDS/IMG-7596.png" alt="Fľaša">
        <div id="level-line"></div>
    </div>
    <input type="number" id="shots" min="0" max="25" placeholder="Počet poldeciakrov">
    <button onclick="updateLevelAndPromile()">Aktualizovať hladinu a promile</button>

    <table class="promile-table">
        <thead>
            <tr>
                <th>Hmotnosť (kg)</th>
                <th>Promile</th>
            </tr>
        </thead>
        <tbody id="promile-results">
            <!-- Tu sa budú dynamicky vkladať výsledky -->
        </tbody>
    </table>

    <script>
        function updateLevelAndPromile() {
            const shots = parseInt(document.getElementById('shots').value) || 0;
            const maxShots = 25; // Počet poldeciakrov v jednej litrovej fľaši
            let scale = 1;

            if (shots > 0 && shots <= maxShots) {
                scale = 1 - (shots / maxShots);
            } else if (shots > maxShots) {
                scale = 0;
            }

            // Aktualizácia hladiny
            document.getElementById('level-line').style.height = `${scale * 100}%`;

            // Vypočet promile (jednoduchý model, kde 1 poldecák = 0,03 promile na každých 10 kg)
            const weights = [60, 65, 70, 75, 80, 85, 90, 95];
            let promileResults = '';
            
            weights.forEach(weight => {
                let promile = (shots * 0.03 * (10 / weight)).toFixed(2);
                promileResults += `<tr><td>${weight}</td><td>${promile}</td></tr>`;
            });

            document.getElementById('promile-results').innerHTML = promileResults;
        }
    </script>
</body>
</html>
