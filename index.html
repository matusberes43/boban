<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmová databáza</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #3b0b17, #102d4a);
        }

        header {
            width: 100%;
            padding: 10px 20px;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left img {
            width: 40px;
            height: 40px;
        }

        .header-left p {
            margin: 0;
            font-size: 0.9rem;
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-right input[type="text"] {
            padding: 5px;
            font-size: 1rem;
            border: none;
            border-radius: 5px;
            outline: none;
        }

        .header-right .icon {
            width: 25px;
            height: 25px;
        }

        .container {
            text-align: center;
            margin-top: 100px; /* Posunutí kvůli fixnímu headeru */
            padding: 20px;
        }

        .container h1 {
            font-size: 4rem;
            font-weight: bold;
        }

        .container p {
            font-size: 1.5rem;
        }

        /* MEDIA QUERIES */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .header-right {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .header-right input[type="text"] {
                width: 100%;
            }

            .container h1 {
                font-size: 3rem;
            }

            .container p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="blcha.png" alt="Blcha Logo">
            <p>filmová databáza filmov</p>
        </div>
        <div class="header-right">
            <input type="text" placeholder="Vyhledat...">
            <img src="search-icon.png" alt="Hledat" class="icon">
            <img src="login-icon.png" alt="Přihlásit se" class="icon">
        </div>
    </header>
    <div class="container">
        <h1>Vítejte ve filmové databázi</h1>
        <p>Prozkoumejte tisíce filmů na jednom místě.</p>
    </div>
</body>
</html>
