<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHAGUNS</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Globálny štýl */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0A1624 0%, #16273A 100%);
            color: #ffffff;
        }

        /* Hlavný kontajner */
        .container {
            text-align: center;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo */
        .logo {
            margin-bottom: 20px;
        }

        .logo h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 72px;
            letter-spacing: 3px;
            margin: 0;
        }

        .logo .grid {
            color: #ffffff;
        }

        .logo .rival {
            color: #6CFF47;
        }

        /* Kategórie */
        .categories {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin: 0 auto;
            gap: 10px;
            margin-bottom: 20px;
        }

        .categories p {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
        }

        /* Tlačidlá */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .join-button, .login-button {
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .join-button {
            background-color: #6CFF47;
            color: #0A1624;
            box-shadow: 0 8px 15px rgba(108, 255, 71, 0.2);
        }

        .join-button:hover {
            background-color: #5BE140;
            box-shadow: 0 12px 20px rgba(108, 255, 71, 0.4);
            transform: translateY(-3px);
        }

        .login-button {
            background-color: transparent;
            border: 2px solid #6CFF47;
            color: #ffffff;
        }

        .login-button:hover {
            background-color: #6CFF47;
            color: #0A1624;
            box-shadow: 0 8px 15px rgba(108, 255, 71, 0.2);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <h1><span class="grid">BLCHA</span><span class="rival">GUNS</span></h1>
        </div>

        <!-- Kategórie -->
        <div class="categories">
            <p>PIŠTOLE</p>
            <p>ÚTOČNÉ PUŠKY</p>
            <p>ODSTREĽOVACIE PUŠKY</p>
            <p>REVOLVERY</p>
            <p>BROKOVNICE</p>
            <p>VZDUCHOVÉ ZBRANE</p>
            <p>PRÍSLUŠENSTVO</p>
        </div>

        <!-- Tlačidlá -->
        <div class="buttons">
            <a href="#" class="join-button">Join The Club</a>
            <a href="#" class="login-button">Login</a>
        </div>
    </div>
</body>
</html>
