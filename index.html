<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Žebříček recenzentů</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 40px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    #searchInput {
      display: block;
      margin: 0 auto 30px auto;
      padding: 10px;
      font-size: 16px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    table {
      width: 95%;
      margin: auto;
      border-collapse: collapse;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px 18px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }
    thead {
      background-color: #004080;
      color: white;
    }
    tr:hover {
      background-color: #f0f8ff;
    }
    .skull {
      color: red;
    }
    .overcome {
      background-color: #ffe5e5;
    }
  </style>
</head>
<body>

<h1>Žebříček recenzentů s živým odpočtem</h1>

<input type="text" id="searchInput" placeholder="Hledej uživatele..." onkeyup="filterTable()">

<table id="reviewTable">
  <thead>
    <tr>
      <th>Pořadí</th>
      <th>Uživatel</th>
      <th>Počet recenzí</th>
      <th>Dní do překonání</th>
      <th>Datum překonání</th>
      <th>Odpočet</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>1</td>
      <td>corpSy 🥇</td>
      <td>23867</td>
      <td>482</td>
      <td>29.08.2026</td>
      <td><span id="countdown-1"></span></td>
    </tr>
    <tr>
      <td>2</td>
      <td>T2 🥈</td>
      <td>19982</td>
      <td>385</td>
      <td>24.05.2026</td>
      <td><span id="countdown-2"></span></td>
    </tr>
    <tr>
      <td>3</td>
      <td>Marze 🥉</td>
      <td>19026</td>
      <td>361</td>
      <td>30.04.2026</td>
      <td><span id="countdown-3"></span></td>
    </tr>

    <!-- Sem přidej další uživatele podle potřeby -->
    
  </tbody>
</table>

<script>
function filterTable() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  const rows = document.querySelectorAll("#reviewTable tbody tr");
  rows.forEach(row => {
    const username = row.cells[1].textContent.toLowerCase();
    row.style.display = username.includes(input) ? "" : "none";
  });
}

function startCountdown(id, targetDateStr) {
  const target = new Date(targetDateStr);
  function update() {
    const now = new Date();
    const diff = target - now;
    if (diff <= 0) {
      document.getElementById(id).innerText = "Překonán!";
      return;
    }
    const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30));
    const days = Math.floor(diff / (1000 * 60 * 60 * 24)) % 30;
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);
    document.getElementById(id).innerText =
      `${months}m ${days}d ${hours}h ${minutes}m ${seconds}s`;
  }
  update();
  setInterval(update, 1000);
}

// Spuštění odpočtů pro první 3 uživatele
startCountdown("countdown-1", "2026-08-29");
startCountdown("countdown-2", "2026-05-24");
startCountdown("countdown-3", "2026-04-30");
</script>

</body>
</html>
