<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Výhody</title>
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="left-section">
            <i class="fas fa-bars menu-icon" aria-label="Menu"></i>
        </div>
        <div class="logo">
            <img src="https://i.postimg.cc/VLP3mtXR/IMG-7653.png" alt="Company Logo">
        </div>
        <div class="right-section">
            <i class="fas fa-shopping-cart cart-icon" aria-label="Shopping Cart"></i>
            <i class="fas fa-user login-icon" aria-label="User Login"></i>
        </div>
    </header>

    <!-- Benefits Section -->
    <section class="benefits-section">
        <div class="benefit-item">
            <i class="fas fa-truck"></i>
            <h2>Doprava zdarma na vybrané položky</h2>
        </div>
        <div class="divider"></div>
        <div class="benefit-item">
            <i class="fas fa-money-check-alt"></i>
            <h2>Bez skrytých poplatkov</h2>
        </div>
        <div class="divider"></div>
        <div class="benefit-item">
            <i class="fas fa-award"></i>
            <h2>Doživotná záruka na nové zbrane</h2>
        </div>
    </section>
</body>
</html>
