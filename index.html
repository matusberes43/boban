<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filmová databáze</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Hlavní menu */
        header {
            background-color: #212121;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        header nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
            margin: 0;
            padding: 0;
        }

        header nav ul li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 1rem;
            transition: color 0.3s;
        }

        header nav ul li a:hover {
            color: #ffcc00;
        }

        /* Postranní panel */
        aside {
            background-color: #2a2a2a;
            padding: 20px;
            width: 200px;
            overflow-y: auto;
        }

        aside ul {
            list-style: none;
            padding: 0;
        }

        aside ul li {
            margin-bottom: 10px;
        }

        aside ul li a {
            text-decoration: none;
            color: #ffffff;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        aside ul li a:hover {
            color: #ffcc00;
        }

        /* Hlavní obsah */
        main {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .grid-item {
            background-color: #333333;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .grid-item img {
            width: 100%;
            border-radius: 5px;
        }

        .grid-item h3 {
            font-size: 1rem;
            margin: 10px 0 0 0;
        }

        /* Responzivita */
        @media (max-width: 768px) {
            aside {
                display: none;
            }

            main {
                padding: 10px;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Filmová databáze</div>
        <nav>
            <ul>
                <li><a href="#">Domů</a></li>
                <li><a href="#">Filmy</a></li>
                <li><a href="#">Žánry</a></li>
                <li><a href="#">Kontakt</a></li>
            </ul>
        </nav>
    </header>
    <div style="display: flex; flex: 1;">
        <aside>
            <ul>
                <li><a href="#">Kategorie 1</a></li>
                <li><a href="#">Kategorie 2</a></li>
                <li><a href="#">Kategorie 3</a></li>
                <li><a href="#">Kategorie 4</a></li>
            </ul>
        </aside>
        <main>
            <div class="grid">
                <div class="grid-item">
                    <img src="https://via.placeholder.com/200x300" alt="Film 1">
                    <h3>Film 1</h3>
                </div>
                <div class="grid-item">
                    <img src="https://via.placeholder.com/200x300" alt="Film 2">
                    <h3>Film 2</h3>
                </div>
                <div class="grid-item">
                    <img src="https://via.placeholder.com/200x300" alt="Film 3">
                    <h3>Film 3</h3>
                </div>
                <div class="grid-item">
                    <img src="https://via.placeholder.com/200x300" alt="Film 4">
                    <h3>Film 4</h3>
                </div>
                <!-- Přidej další filmy -->
            </div>
        </main>
    </div>
</body>
</html>
