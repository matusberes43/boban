<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fľaša s Hladinou</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            position: relative;
        }
        img {
            width: 300px; /* Príklad veľkosti, upravte podľa potreby */
            height: auto;
        }
        #level-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%; /* Zmeníme výšku na 100% pre správny výpočet */
            border-top: 2px solid red;
            background-color: rgba(0, 255, 0, 0.3); /* Zelená pre lepšiu viditeľnosť */
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://i.postimg.cc/Hj9nPTDS/IMG-7596.png" alt="Fľaša">
        <div id="level-line"></div>
    </div>
    <input type="number" id="shots" min="0" max="25" placeholder="Počet poldeciakrov">
    <button onclick="updateLevel()">Aktualizovať hladinu</button>

    <script>
        function updateLevel() {
            const shots = document.getElementById('shots').value;
            const maxShots = 25; // Počet poldeciakrov v jednej litrovej fľaši
            let scale = 1; // Začiatok na plnej fľaši

            if (shots > 0 && shots <= maxShots) {
                // Výpočet zostávajúcej hladiny (1 je plná fľaša, 0 je prázdna)
                // Keďže znižujeme hladinu, používame 1 mínus pomer vypitých poldeciakrov k celkovému počtu
                scale = 1 - (shots / maxShots);
            } else if (shots > maxShots) {
                scale = 0; // Ak presiahnete max, fľaša je prázdna
            }

            // Aktualizácia CSS vlastnosti na zmenu výšky čiary
            document.getElementById('level-line').style.height = `${scale * 100}%`;
        }
    </script>
</body>
</html>
