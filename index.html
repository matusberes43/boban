<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Žebříček recenzentů</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1b1b1b;
      color: #f0f0f0;
      padding: 1rem;
    }

    select {
      background: #2d2d2d;
      color: #f0f0f0;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      padding: 0.4rem;
      margin: 0.5rem;
    }

    .controls {
      text-align: center;
      margin-bottom: 1rem;
    }

    .user-card {
      background: #2d2d2d;
      border: 1px solid #3d3d3d;
      padding: 0.75rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .user-info .username {
      font-weight: bold;
    }

    .user-stats {
      text-align: right;
      font-size: 0.9rem;
    }

    .extra-info {
      font-size: 0.7rem;
      color: #ccc;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="controls">
    <label for="countryFilter">Filtrovat podle země:</label>
    <select id="countryFilter" onchange="renderList()">
      <option value="all">Vše</option>
      <option value="🇨🇿">Česko</option>
      <option value="🇸🇰">Slovensko</option>
      <option value="other">Ostatní</option>
    </select>

    <label for="sortSelect">Řadit podle:</label>
    <select id="sortSelect" onchange="renderList()">
      <option value="reviews">Recenzí</option>
      <option value="fans">Fanoušků</option>
      <option value="ratings">Hodnocení</option>
    </select>
  </div>

  <div id="userList"></div>

  <script>
    const data = [
      // Příklad: doplň si fans a ratings
      { username: "corpSy", flag: "🇸🇰", reviews: 23872, fans: 83, ratings: 23892 },
      { username: "Marze", flag: "🇨🇿", reviews: 19026, fans: 104, ratings: 45837 },
      { username: "PunisherEDNA", flag: "🇨🇿", reviews: 4967, fans: 24, ratings: 4964 },
      // ... doplň ostatní
    ];

    function renderList() {
      const userList = document.getElementById("userList");
      const selectedCountry = document.getElementById("countryFilter").value;
      const sortBy = document.getElementById("sortSelect").value;

      const filtered = data.filter(user => {
        if (selectedCountry === "all") return true;
        if (selectedCountry === "other") return !["🇨🇿", "🇸🇰"].includes(user.flag);
        return user.flag === selectedCountry;
      });

      filtered.sort((a, b) => {
        if (sortBy === "fans") return b.fans - a.fans;
        if (sortBy === "ratings") return b.ratings - a.ratings;
        return b.reviews - a.reviews;
      });

      userList.innerHTML = "";
      filtered.forEach((user, index) => {
        const card = document.createElement("div");
        card.className = "user-card";
        card.innerHTML = `
          <div class="user-info">
            <span>#${index + 1}</span>
            <span class="flag">${user.flag}</span>
            <span class="username">${user.username}</span>
          </div>
          <div class="user-stats">
            <div>${user.reviews} recenzí</div>
            <div class="extra-info">${user.fans} fanoušků<br>${user.ratings} hodnocení</div>
          </div>
        `;
        userList.appendChild(card);
      });
    }

    document.addEventListener("DOMContentLoaded", renderList);
  </script>
</body>
</html>
