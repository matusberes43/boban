<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #121212;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
        }

        .logo img {
            height: 40px;
        }

        .menu-icon {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu-icon:hover {
            transform: scale(1.1);
        }

        .bar {
            height: 3px;
            background-color: #fff;
            border-radius: 2px;
        }

        .bar:nth-child(1) { width: 28px; }
        .bar:nth-child(2) { width: 20px; }
        .bar:nth-child(3) { width: 24px; }

        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 20px;
            background-color: #333;
            color: #ffffff;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-box::placeholder {
            color: #888;
        }

        .search-box:focus {
            outline: none;
        }
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="https://i.postimg.cc/2S4hhVgJ/IMG-8128.png" alt="EDNA Logo">
        </div>

        <div class="menu-icon" onclick="alert('Menu kliknuté!')">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </div>

    <input class="search-box" type="text" placeholder="Hledej seriály, filmy a další">

</body>
</html>
