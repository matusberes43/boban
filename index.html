<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Countdown</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            background-image: url('race-background.jpg'); /* Nahraď svojím obrázkom */
            background-size: cover;
            background-position: center;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .event-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .event-info img {
            height: 30px;
            margin-right: 10px;
        }

        .event-info .date {
            font-size: 18px;
        }

        .grand-prix-box {
            background-color: #111;
            border-radius: 10px;
            padding: 15px;
            margin: 20px auto;
            width: 80%;
            max-width: 500px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .grand-prix-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .countdown {
            display: flex;
            justify-content: space-around;
            flex: 1;
            font-size: 32px;
            font-weight: bold;
        }

        .countdown div {
            text-align: center;
        }

        .countdown span {
            display: block;
            font-size: 14px;
            color: #888;
        }

        .sponsor-logo img {
            height: 50px;
        }

    </style>
</head>
<body>

    <!-- Hlavný kontajner -->
    <div class="container">
        <!-- Informácie o podujatí -->
        <div class="event-info">
            <span class="date">14 - 16 MAR</span>
            <span class="location">
                <img src="track-icon.png" alt="Circuit"> 
                <span>AUSTRALIA 2025</span>
            </span>
        </div>

        <!-- Grand Prix box -->
        <div class="grand-prix-box">
            <div>
                <div class="grand-prix-title">GRAND PRIX WEEKEND</div>
                <div class="countdown">
                    <div>07 <span>HRS</span></div>
                    <div>07 <span>MINS</span></div>
                    <div>21 <span>SECS</span></div>
                </div>
            </div>
            <div class="sponsor-logo">
                <img src="tag-heuer-logo.png" alt="TAG Heuer">
            </div>
        </div>
    </div>

</body>
</html>
