<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animácia Fliaš</title>
    <style>
        .bottle {
            width: 100px;
            height: 200px;
            border: 2px solid black;
            margin: 10px;
            position: relative;
            display: inline-block;
        }
        .liquid {
            width: 100%;
            background-color: blue;
            position: absolute;
            bottom: 0;
        }
    </style>
</head>
<body>
    <h1>Animácia Fliaš</h1>
    <div>
        <div class="bottle" id="bottle1">
            <div class="liquid" id="liquid1" style="height: 100%;"></div>
        </div>
        <div class="bottle" id="bottle2">
            <div class="liquid" id="liquid2" style="height: 70%;"></div>
        </div>
    </div>
    <button onclick="drink(1)">Piť z 1 litrovej fľaše</button>
    <button onclick="drink(2)">Piť z 0,7 litrovej fľaše</button>

    <script>
        const bottle1Max = 40; // 40 poldecakov = 1 liter
        const bottle2Max = 28; // 28 poldecakov = 0,7 litra
        let bottle1Current = bottle1Max;
        let bottle2Current = bottle2Max;

        function drink(bottleNum) {
            const liquidElement = document.getElementById(`liquid${bottleNum}`);
            let currentVolume = bottleNum === 1 ? bottle1Current : bottle2Current;
            
            if (currentVolume > 0) {
                currentVolume--;
                let newHeight = (currentVolume / (bottleNum === 1 ? bottle1Max : bottle2Max)) * 100;
                liquidElement.style.height = `${newHeight}%`;
                
                if (bottleNum === 1) {
                    bottle1Current = currentVolume;
                } else {
                    bottle2Current = currentVolume;
                }

                if (currentVolume === 0) {
                    let audio = new Audio('path/to/your/sound.mp3'); // Nahradte cestu k vášmu zvukovému súboru
                    audio.play();
                }
            }
        }
    </script>
</body>
</html>
