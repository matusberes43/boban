<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boční menu</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #12132D;
            font-family: Arial, sans-serif;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
        }

        /* MENU KONTEJNER */
        .menu-container {
            position: fixed;
            left: -100%;
            top: 0;
            width: 300px;
            height: 100%;
            background-color: #161738;
            padding: 20px;
            box-shadow: 2px 0px 15px rgba(0, 0, 0, 0.6);
            transition: left 0.3s ease-in-out;
        }

        .menu-container.active {
            left: 0;
        }

        /* ZAVÍRACÍ IKONA */
        .close-menu {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 22px;
            cursor: pointer;
        }

        /* HLAVNÍ NADPIS */
        .menu-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* ODKAZY V MENU */
        .menu-links a {
            display: block;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 16px;
            padding: 10px 0;
            transition: color 0.3s;
        }

        .menu-links a:hover {
            color: #4E8BFF;
        }

        .menu-links strong {
            font-size: 18px;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* ODDĚLOVAČ */
        .divider {
            border-top: 1px solid #4E4F71;
            margin: 15px 0;
        }

        /* PROFIL SEKCIA */
        .profile-section {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-top: 10px;
        }

        .profile-picture {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            border: 2px solid #40C057; /* ZELENÝ OKRAJ */
            background-image: url('https://i.postimg.cc/02GqG3J2/IMG-7860.jpg');
            background-size: cover;
        }

        .profile-name {
            font-size: 16px;
            font-weight: bold;
        }

        /* SPODNÍ ODKAZY S IKONAMI */
        .bottom-links a {
            display: flex;
            align-items: center;
            color: #FFFFFF;
            font-size: 14px;
            text-decoration: none;
            padding: 12px 0;
            gap: 12px;
            transition: color 0.3s;
        }

        .bottom-links a:hover {
            color: #4E8BFF;
        }

        .bottom-links i {
            font-size: 18px;
            width: 28px;
            text-align: center;
        }

        /* ČIARA PRED ODHLÁSENÍM */
        .logout-divider {
            border-top: 1px solid #4E4F71;
            margin-top: 10px;
        }

        /* TIP NA SERIÁL */
        .tip-section {
            text-align: center;
            padding: 15px 0;
        }

        .tip-section a {
            color: #4E8BFF;
            font-size: 16px;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .tip-section a:hover {
            color: #FFFFFF;
        }

        /* TLAČÍTKO NA OTEVŘENÍ MENU */
        .menu-button {
            position: fixed;
            left: 20px;
            top: 20px;
            background-color: #4E8BFF;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            border: none;
        }

    </style>
</head>
<body>

<!-- TLAČÍTKO OTEVŘENÍ MENU -->
<button class="menu-button" onclick="toggleMenu()">☰ Menu</button>

<!-- BOČNÍ MENU -->
<div class="menu-container" id="menu">
    <span class="close-menu" onclick="toggleMenu()">✖</span>
    <div class="menu-title">Menu</div>

    <div class="menu-links">
        <strong>Edna.cz</strong>
        <a href="#">Úvod</a>
        <a href="#">Novinky</a>
        <a href="#">Seriály a filmy</a>
        <a href="#">Další vysílání</a>
        <a href="#">Žebříčky</a>
        <a href="#">Herci</a>
        <a href="#">Magazín</a>
        <a href="#">Blog</a>
        <a href="#">Diskuze</a>
    </div>

    <!-- TIP NA SERIÁL -->
    <div class="tip-section">
        <a href="#">Tip na seriál</a>
    </div>

    <div class="divider"></div>

    <!-- PROFIL SEKCE -->
    <div class="profile-section">
        <div class="profile-picture"></div>
        <div class="profile-name">Punisher bude trestať</div>
    </div>

    <!-- SPODNÍ MENU S IKONAMI -->
    <div class="bottom-links">
        <a href="#"><i class="far fa-comment"></i> 1 Vzkazník</a>
        <a href="#"><i class="fas fa-tv"></i> Bedna</a>
        <a href="#"><i class="far fa-comments"></i> Oblíbené diskuze</a>
        <a href="#"><i class="fas fa-cog"></i> Nastavení</a>
        
        <div class="logout-divider"></div>
        
        <a href="#"><i class="fas fa-sign-out-alt"></i> Odhlásit se</a>
    </div>
</div>

<!-- JAVASCRIPT PRO OTEVÍRÁNÍ/ZAVÍRÁNÍ MENU -->
<script>
    function toggleMenu() {
        let menu = document.getElementById('menu');
        menu.classList.toggle('active');
    }
</script>

</body>
</html>
