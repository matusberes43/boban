<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vodka Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
        }
        .bottle {
            width: 200px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            background-color: white;
        }
        .level {
            width: 100%;
            position: absolute;
            bottom: 0;
            background-color: green;
        }
        select, button {
            margin: 10px;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bottle" id="bottle">
            <div class="level" id="level"></div>
        </div>
        <select id="size">
            <option value="1">1L (40 shots)</option>
            <option value="0.7">0.7L (28 shots)</option>
        </select>
        <button onclick="drinkShot()">Vypiť Shot</button>
        <p id="shotsLeft"></p>
        <p>Autor: Matúš Bereš</p>
        <p>Prajem príjemné ranné zvracanie.</p>
    </div>

    <script>
        let totalVolume = 1000; // Začneme s 1 litrom
        let shotsPerBottle = 40;
        let shotSize = 25; // ml

        function updateBottle() {
            const bottle = document.getElementById('bottle');
            const level = document.getElementById('level');
            const percentageFilled = (totalVolume / (totalVolume + shotSize * shotsPerBottle)) * 100;
            level.style.height = `${percentageFilled}%`;
            document.getElementById('shotsLeft').innerText = `Zostáva ${shotsPerBottle} shotov.`;
        }

        function drinkShot() {
            if (shotsPerBottle > 0) {
                totalVolume -= shotSize;
                shotsPerBottle--;
                updateBottle();
            } else {
                alert("Fľaša je prázdna!");
            }
        }

        document.getElementById('size').addEventListener('change', function() {
            if (this.value === "1") {
                totalVolume = 1000;
                shotsPerBottle = 40;
            } else {
                totalVolume = 700;
                shotsPerBottle = 28;
            }
            updateBottle();
        });

        updateBottle(); // Spustiť pri načítaní stránky
    </script>
</body>
</html>
