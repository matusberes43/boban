<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Buttons</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="button-container">
        <div class="button">
            <div class="icon"><img src="print.svg" alt="Print"></div>
            <div class="text">PRINT NOW</div>
        </div>
        <div class="button">
            <div class="icon"><img src="submit.svg" alt="Submit"></div>
            <div class="text">SUBMIT</div>
        </div>
        <div class="button">
            <div class="icon"><img src="upload.svg" alt="Upload"></div>
            <div class="text">UPLOAD</div>
        </div>
        <div class="button">
            <div class="icon"><img src="search.svg" alt="Find More"></div>
            <div class="text">FIND MORE</div>
        </div>
    </div>
</body>
</html>
