<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Rival</title>
    <style>
        /* Globálny štýl */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #0A1624;
            color: #ffffff;
        }

        /* Hlavný kontajner */
        .container {
            text-align: center;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo */
        .logo h1 {
            font-size: 48px;
            font-weight: bold;
        }

        .grid {
            color: #ffffff;
        }

        .rival {
            color: #6CFF47;
        }

        /* Tagline */
        .tagline {
            margin-top: 10px;
            font-size: 18px;
        }

        /* Kategórie */
        .categories p {
            margin: 10px 0;
            font-size: 20px;
        }

        /* Tlačidlá */
        .buttons {
            margin-top: 20px;
        }

        .join-button, .login-button {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .join-button {
            background-color: #6CFF47;
            color: #0A1624;
        }

        .login-button {
            background-color: transparent;
            border: 2px solid #6CFF47;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <h1><span class="grid">GRID</span><span class="rival">RIVAL</span></h1>
        </div>
        <!-- Tagline -->
        <p class="tagline">Fantasy Sports For The Racing Obsessed</p>
        <!-- Kategórie -->
        <div class="categories">
            <p>Formula 1</p>
            <p>NASCAR</p>
            <p>Trucks</p>
            <p>Xfinity</p>
            <p>IndyCar</p>
            <p>MotoGP</p>
            <p>Formula E</p>
        </div>
        <!-- Tlačidlá -->
        <div class="buttons">
            <a href="#" class="join-button">Join The Grid</a>
            <a href="#" class="login-button">Login</a>
        </div>
    </div>
</body>
</html>
