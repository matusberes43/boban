<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobilná hlavička</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      font-family: sans-serif;
    }

    .mobile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background-color: #000;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }

    .hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .hamburger span {
      width: 24px;
      height: 3px;
      background-color: white;
      border-radius: 2px;
    }

    .center-box {
      width: 16px;
      height: 16px;
      background-color: #facc15;
      border-radius: 3px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .search-icon {
      background-color: #222;
      border-radius: 50%;
      padding: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .search-icon svg {
      stroke: white;
    }

    #search-box {
      display: none;
      padding: 1rem;
      background-color: #111;
      text-align: center;
    }

    #search-box input {
      padding: 0.5rem;
      border-radius: 5px;
      border: none;
      width: 80%;
      max-width: 300px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="mobile-header">
    <!-- Hamburger -->
    <div class="hamburger" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Center blinking box -->
    <div class="center-box"></div>

    <!-- Search icon -->
    <div class="search-icon" onclick="toggleSearch()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
           viewBox="0 0 24 24" stroke-width="2">
        <circle cx="11" cy="11" r="8" stroke="white"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="white"/>
      </svg>
    </div>
  </div>

  <!-- Hidden search input -->
  <div id="search-box">
    <input type="text" placeholder="Hľadaj používateľa...">
  </div>

  <script>
    function toggleSearch() {
      const box = document.getElementById('search-box');
      box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function toggleMenu() {
      alert('Menu toggle (tu pridaj vlastné zobrazenie menu)');
    }
  </script>

</body>
</html>
