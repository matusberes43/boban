<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blcha - Filmová databáza</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            color: white;
            background: linear-gradient(135deg, #3b0b17, #102d4a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
        }
        .container h1 {
            font-size: 4rem;
            font-weight: bold;
        }
        .container p {
            font-size: 1.5rem;
        }
        .icon {
            display: inline-block;
            margin-left: 10px;
            width: 30px;
            height: 30px;
            border: 2px solid white;
            border-radius: 5px;
            position: relative;
        }
        .icon::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 6px;
            width: 18px;
            height: 12px;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>blcha.com</h1>
        <p>filmová databáza filmov <span class="icon"></span></p>
    </div>
</body>
</html>
