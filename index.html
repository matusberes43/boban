<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHAGUNS</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Globálny štýl */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0A1624 0%, #16273A 100%);
            color: #ffffff;
            overflow: hidden;
        }

        /* Hlavný kontajner */
        .container {
            text-align: center;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo */
        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 56px;
            font-weight: 600;
            letter-spacing: 3px;
            margin: 0;
        }

        .grid {
            color: #ffffff;
        }

        .rival {
            color: #6CFF47;
        }

        /* Tagline */
        .tagline {
            margin-top: 10px;
            font-size: 20px;
            font-weight: 400;
            opacity: 0.85;
        }

        /* Kategórie */
        .categories {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .category {
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .category span:first-child {
            display: block;
            font-size: 40px;
            color: #6CFF47;
            margin-bottom: 5px;
        }

        .category:hover {
            color: #6CFF47;
        }

        /* Tlačidlá */
        .buttons {
            margin-top: 20px;
        }

        .join-button, .login-button {
            display: inline-block;
            margin: 10px;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .join-button {
            background-color: #6CFF47;
            color: #0A1624;
            box-shadow: 0 8px 15px rgba(108, 255, 71, 0.2);
        }

        .join-button:hover {
            background-color: #5BE140;
            box-shadow: 0 12px 20px rgba(108, 255, 71, 0.4);
            transform: translateY(-3px);
        }

        .login-button {
            background-color: transparent;
            border: 2px solid #6CFF47;
            color: #ffffff;
        }

        .login-button:hover {
            background-color: #6CFF47;
            color: #0A1624;
            box-shadow: 0 8px 15px rgba(108, 255, 71, 0.2);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <h1><span class="grid">BLCHA</span><span class="rival">GUNS</span></h1>
        </div>
        <!-- Tagline -->
        <p class="tagline">Fantasy Sports For The Shooting Enthusiasts</p>
        <!-- Kategórie -->
        <div class="categories">
            <div class="category">
                <span>P</span>
                PIŠTOLE
            </div>
            <div class="category">
                <span>Ú</span>
                ÚTOČNÉ PUŠKY
            </div>
            <div class="category">
                <span>O</span>
                ODSTREĽOVACIE PUŠKY
            </div>
            <div class="category">
                <span>R</span>
                REVOLVERY
            </div>
            <div class="category">
                <span>B</span>
                BROKOVNICE
            </div>
            <div class="category">
                <span>V</span>
                VZDUCHOVÉ ZBRANE
            </div>
            <div class="category">
                <span>P</span>
                PRÍSLUŠENSTVO
            </div>
        </div>
        <!-- Tlačidlá -->
        <div class="buttons">
            <a href="#" class="join-button">Join The Club</a>
            <a href="#" class="login-button">Login</a>
        </div>
    </div>
</body>
</html>
