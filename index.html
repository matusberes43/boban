<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Žebříček recenzentů</title>
  <style>
    /* CSS proměnné */
    :root {
      --primary-color: #1b1b1b; /* Tmavá základná farba */
      --accent-color: #2ecc71; /* Svieži zelený akcent */
      --warning-color: #f39c12; /* Teplá oranžová pre varovanie */
      --danger-color: #e74c3c; /* Červená pre urgentné */
      --background-dark: #252525; /* Tmavší pozadie */
      --text-light: #f0f0f0; /* Svetlý text */
      --surface-dark: #2d2d2d; /* Tmavší povrch */
      --border-dark: #3d3d3d; /* Jemné ohraničenie */
      --shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      --transition: all 0.3s ease;
    }

    /* Obecné štýly */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: var(--background-dark);
      color: var(--text-light);
      -webkit-user-select: none;
      user-select: none;
    }

    /* Hlavný kontajner */
    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Fixovaná hlavička */
    .fixed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: var(--surface-dark);
      border-bottom: 1px solid var(--border-dark);
      z-index: 999;
    }

    /* Hamburger menu */
    #menu-toggle {
      width: 1.5rem;
      height: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    #menu-toggle .bar {
      height: 3px;
      width: 100%;
      background-color: var(--text-light);
      border-radius: 2px;
      transition: var(--transition);
    }

    #menu-toggle.active .top {
      transform: rotate(45deg) translateY(7px);
    }

    #menu-toggle.active .middle {
      opacity: 0;
    }

    #menu-toggle.active .bottom {
      transform: rotate(-45deg) translateY(-7px);
    }

    /* Rozbalovací menu */
    #dropdown-menu {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      border-radius: 0 0 8px 8px;
      padding: 0.5rem 0;
      box-shadow: var(--shadow);
      z-index: 99;
      display: none;
      text-align: center;
    }

    #dropdown-menu.show {
      display: block;
    }

    #dropdown-menu a.menu-item {
      display: block;
      padding: 0.75rem 1rem;
      color: var(--text-light);
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    #dropdown-menu a.menu-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* Moderná ikona lupy */
    .search-icon {
      width: 1.5rem;
      height: 1.5rem;
      cursor: pointer;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23f0f0f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>') no-repeat center;
      background-size: contain;
      transition: transform 0.3s ease;
    }

    .search-icon:hover {
      transform: scale(1.1);
    }

    /* Vyhledávací panel */
    #search-container {
      display: none;
      padding: 0.5rem;
      background: var(--surface-dark);
      border-bottom: 1px solid var(--border-dark);
    }

    #search-container.show {
      display: block;
    }

    #searchInput {
      padding: 0.5rem;
      font-size: 1rem;
      width: 100%;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background: var(--background-dark);
      color: var(--text-light);
      transition: var(--transition);
    }

    #searchInput:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.2);
    }

    /* Legenda */
    .search-legend-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0.5rem;
      background: var(--surface-dark);
      border-bottom: 1px solid var(--border-dark);
    }

    .legend {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .legend-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-light);
    }

    .legend-square {
      width: 0.8rem;
      height: 0.8rem;
      border-radius: 4px;
    }

    .legend-square.danger {
      background-color: var(--danger-color);
      animation: pulse 1.5s infinite;
    }

    .legend-square.warning {
      background-color: var(--warning-color);
      animation: pulse 2.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Zoznam užívateľov */
    .user-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .user-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-dark);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.5rem;
      transition: transform 0.2s ease;
    }

    .user-card:hover {
      transform: translateY(-2px);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .user-info .flag {
      font-size: 1rem;
    }

    .user-info .username {
      font-weight: 600;
      font-size: 0.9rem;
    }

    .user-stats {
      text-align: right;
      font-size: 0.8rem;
    }

    .user-stats .reviews {
      font-weight: 600;
      color: var(--accent-color);
    }

    .user-stats .countdown {
      color: var(--text-light);
    }

    .urgent-countdown {
      color: var(--danger-color);
      font-weight: 700;
    }

    .month-warning .countdown {
      animation: pulse 2.5s infinite;
    }

    /* Spodná navigačná lišta */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      padding: 0.5rem;
      background: var(--surface-dark);
      border-top: 1px solid var(--border-dark);
      position: sticky;
      bottom: 0;
      z-index: 999;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      color: var(--text-light);
      font-size: 0.75rem;
      cursor: pointer;
    }

    .nav-item svg {
      width: 1.5rem;
      height: 1.5rem;
      fill: var(--text-light);
    }

    /* Responzívne úpravy */
    @media (max-width: 480px) {
      .fixed-header {
        padding: 0.5rem;
      }

      #dropdown-menu {
        top: 40px;
      }

      .legend-item {
        font-size: 0.65rem;
      }

      .legend-square {
        width: 0.6rem;
        height: 0.6rem;
      }

      .user-card {
        padding: 0.5rem;
      }

      .user-info .username {
        font-size: 0.8rem;
      }

      .user-stats {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div class="fixed-header">
      <div id="menu-toggle" onclick="toggleMenu()">
        <div class="bar top"></div>
        <div class="bar middle"></div>
        <div class="bar bottom"></div>
      </div>
      <div class="search-icon" onclick="toggleSearch()"></div>
    </div>

    <div id="dropdown-menu">
      <a href="2012.html" target="_blank" class="menu-item">PunisherEDNA</a>
      <a href="#" class="menu-item">Žebříček ČSFD</a>
      <a href="trollove.html" target="_blank" class="menu-item">Trollové</a>
    </div>

    <div id="search-container">
      <input type="text" id="searchInput" placeholder="Hledej uživatele..." onkeyup="filterList()">
    </div>

    <div class="search-legend-container">
      <div class="legend">
        <div class="legend-item">
          <div class="legend-square danger"></div>
          <span>Překonání do 24 hodin</span>
        </div>
        <div class="legend-item">
          <div class="legend-square warning"></div>
          <span>Překonání do 1 měsíce</span>
        </div>
      </div>
    </div>

    <div class="user-list" id="userList">
      <!-- Dynamicky generované karty -->
    </div>

    <div class="bottom-nav">
      <div class="nav-item" onclick="alert('Domov')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Domov</span>
      </div>
      <div class="nav-item" onclick="alert('Štatistiky')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14h-2V9h2v8zm-4 0H8V7h2v10zm8 0h-2V5h2v12z"/></svg>
        <span>Štatistiky</span>
      </div>
      <div class="nav-item" onclick="alert('Nastavenia')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.44.17-.48.41l-.36 2.54c-.59.24-1.12.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.3-.06.62-.06.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.12-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.08-.47-.12-.61l-2.03-1.58zM12 15.6c-1.99 0-3.6-1.61-3.6-3.6s1.61-3.6 3.6-3.6 3.6 1.61 3.6 3.6-1.61 3.6-3.6 3.6z"/></svg>
        <span>Nastavenia</span>
      </div>
    </div>
  </div>

  <script>
    // Dáta
    const data = [
      { username: "corpSy", flag: "🇸🇰", reviews: 23872, daysToOvertake: 482, overtakeDate: "2026-08-29" },
      { username: "T2", flag: "🇸🇰", reviews: 19983, daysToOvertake: 385, overtakeDate: "2026-05-24" },
      // Pridajte ďalšie údaje
    ];

    // Vykreslenie zoznamu
    function renderList() {
      const userList = document.getElementById("userList");
      userList.innerHTML = "";
      data.forEach((user, index) => {
        const card = document.createElement("div");
        card.className = `user-card ${user.daysToOvertake <= 30 ? 'month-warning' : ''}`;
        card.innerHTML = `
          <div class="user-info">
            <span class="flag">${user.flag}</span>
            <span class="username">${user.username}</span>
          </div>
          <div class="user-stats">
            <div class="reviews">${user.reviews}</div>
            <div class="countdown" id="countdown-${index + 1}" data-target-date="${user.overtakeDate}"></div>
          </div>`;
        userList.appendChild(card);
      });
      updateAllCountdowns();
    }

    // Filtrovanie zoznamu
    function filterList() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const cards = document.querySelectorAll(".user-card");
      cards.forEach(card => {
        const username = card.querySelector(".username").textContent.toLowerCase();
        card.style.display = username.includes(input) ? "flex" : "none";
      });
    }

    // Odpočet
    function updateAllCountdowns() {
      document.querySelectorAll("[id^=countdown]").forEach(span => {
        const targetDate = span.dataset.targetDate;
        const target = new Date(targetDate);
        const now = new Date();
        const diff = target - now;
        const card = span.closest(".user-card");

        card.classList.remove("month-warning");
        span.classList.remove("urgent-countdown", "prekonan");

        if (diff <= 0) {
          span.innerText = "Překonán!";
          span.classList.add("prekonan");
          return;
        }

        if (diff <= 24 * 60 * 60 * 1000) {
          span.classList.add("urgent-countdown");
        } else if (diff <= 30 * 24 * 60 * 60 * 1000) {
          card.classList.add("month-warning");
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        span.innerText = `${days}d ${hours}h ${minutes}m`;
      });
    }
    setInterval(updateAllCountdowns, 1000);

    // Toggle menu
    function toggleMenu() {
      const toggle = document.getElementById('menu-toggle');
      const menu = document.getElementById('dropdown-menu');
      toggle.classList.toggle('active');
      menu.classList.toggle('show');
    }

    // Toggle search
    function toggleSearch() {
      const searchContainer = document.getElementById('search-container');
      searchContainer.classList.toggle('show');
    }

    // Inicializácia
    document.addEventListener("DOMContentLoaded", () => {
      renderList();
      document.querySelectorAll('#dropdown-menu a').forEach(link => {
        link.addEventListener('click', () => {
          document.getElementById('menu-toggle').classList.remove('active');
          document.getElementById('dropdown-menu').classList.remove('show');
        });
      });

      window.addEventListener('scroll', () => {
        const menu = document.getElementById('dropdown-menu');
        const toggle = document.getElementById('menu-toggle');
        if (menu.classList.contains('show')) {
          menu.classList.remove('show');
          toggle.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>
