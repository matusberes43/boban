<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konšpiračné teórie</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="https://i.postimg.cc/SRB3XQ6G/IMG-7822.jpg" alt="Logo" class="logo">
    </div>
  </header>

  <!-- Sekundárny header -->
  <nav class="secondary-header">
    <div class="box" id="usa-box"><i class="fas fa-flag-usa"></i> KONŠPIRAČNÉ TEÓRIE USA</div>
    <div class="box" id="world-box"><i class="fas fa-globe"></i> KONŠPIRAČNÉ TEÓRIE SVET</div>
    <div class="box" id="random-box"><i class="fas fa-random"></i> NÁHODNÁ TEÓRIA</div>
  </nav>

  <!-- Boxy pre zobrazenie obsahu -->
  <div class="content" id="content-box">
    <!-- Sem sa dynamicky vložia boxy podľa výberu -->
  </div>

  <!-- Resetovacie tlačidlo -->
  <button class="reset-button"><i class="fas fa-sync-alt"></i> Resetovať obsah</button>

  <!-- Interaktívne tlačidlo -->
  <button class="interactive-button">
    <span class="icon">🌙</span> Režim tmavého svetla
  </button>

  <!-- Footer -->
  <footer>
    <p>&copy; 2023 Konšpiračné teórie. Všetky práva vyhradené.</p>
  </footer>

  <!-- Zvukový efekt (načítaný z externého zdroja) -->
  <audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2215/2215-preview.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
