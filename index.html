<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Webpage</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
        }
        .sidebar {
            height: 100vh;
            width: 150px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #000;
            padding-top: 20px;
        }
        .sidebar a {
            padding: 15px 10px;
            text-decoration: none;
            font-size: 16px;
            color: white;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }
        .sidebar a:hover {
            background-color: #333;
        }
        .sidebar .profile {
            display: flex;
            align-items: center;
            padding: 10px 10px;
        }
        .sidebar .profile img {
            border-radius: 50%;
            margin-right: 10px;
        }
        .icon {
            margin-right: 10px;
        }
        .main {
            margin-left: 150px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="profile">
            <img src="profile-pic-url.jpg" alt="Profile Picture" width="40" height="40">
            <span>Kevin</span>
        </div>
        <a href="#"><i class="fas fa-play icon"></i> Watch Now</a>
        <a href="#"><i class="fas fa-th icon"></i> Browse</a>
        <a href="#"><i class="fas fa-search icon"></i> Search</a>
        <a href="#"><i class="fas fa-calendar-alt icon"></i> Latest</a>
        <a href="#"><i class="fas fa-tv icon"></i> TV Shows</a>
        <a href="#"><i class="fas fa-film icon"></i> Movies</a>
        <a href="#"><i class="fas fa-plus icon"></i> My List</a>
        <a href="#"><i class="fas fa-cog icon"></i> Settings</a>
        <a href="#"><i class="fas fa-sign-out-alt icon"></i> Exit Netflix</a>
    </div>
    <div class="main">
        <!-- Main content goes here -->
    </div>
</body>
</html>
