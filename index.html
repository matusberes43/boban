<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Žebříček recenzentů</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f4f6f8;
      padding: 40px;
      color: #222;
    }
    h1 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 30px;
      color: #004080;
    }
    table {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      border-collapse: collapse;
      background-color: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
    }
    th, td {
      padding: 14px 20px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }
    thead {
      background-color: #004080;
      color: #fff;
    }
    tr:hover {
      background-color: #f0f8ff;
    }
    .skull {
      color: red;
    }
    tr.overcome {
      background-color: #ffe5e5;
    }
  </style>
</head>
<body>
  <h1>Žebříček recenzentů (tempo: 40 recenzí/den)</h1>
  <table>
    <thead>
      <tr>
        <th>Pořadí</th>
        <th>Uživatel</th>
        <th>Počet recenzí</th>
        <th>Dní do překonání</th>
        <th>Datum překonání</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>corpSy 🥇</td><td>23867</td><td>482</td><td>29.08.2026</td></tr>
      <tr><td>2</td><td>T2 🥈</td><td>19982</td><td>385</td><td>24.05.2026</td></tr>
      <tr><td>3</td><td>Marze 🥉</td><td>19026</td><td>361</td><td>30.04.2026</td></tr>
      <tr><td>4</td><td>rivah 🥔</td><td>18302</td><td>343</td><td>12.04.2026</td></tr>
      <!-- PŘIDEJ DALŠÍ ŘÁDKY Z TABULKY ZDE -->
      <tr class="overcome"><td>90</td><td>blondboss <span class="skull">&#9760;</span></td><td>4619</td><td>1</td><td>05.05.2025</td></tr>
    </tbody>
  </table>
</body>
</html>
