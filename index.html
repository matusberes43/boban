<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conspiracy Theories Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Conspiracy Theories Hub</h1>
        <nav>
            <button id="loginBtn">Login</button>
            <button id="registerBtn">Register</button>
        </nav>
    </header>

    <aside>
        <nav>
            <ul>
                <li><a href="#theories">Theories</a></li>
                <li><a href="#add-theory">Add New Theory</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <section id="theories">
            <h2>Theories</h2>
            <div id="theoryList"></div>
        </section>
        <section id="add-theory">
            <h2>Add New Theory</h2>
            <form id="addTheoryForm">
                <input type="text" id="theoryTitle" placeholder="Title" required>
                <textarea id="theoryContent" placeholder="Content" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
