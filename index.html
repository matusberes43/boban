<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uživatelský profil</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #12132D;
            font-family: Arial, sans-serif;
            color: #FFFFFF;
            padding: 20px;
        }

        .profile-box {
            width: 350px;
            border-radius: 10px;
            padding: 15px;
            background: linear-gradient(135deg, #1C1D40, #292A50);
            box-shadow: 0px 0px 10px rgba(78, 139, 255, 0.5);
        }

        .username {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .favorite-icon {
            width: 22px;
            height: 22px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            background-image: url('https://i.postimg.cc/02GqG3J2/IMG-7860.jpg');
            background-size: cover;
            border-radius: 8px;
            border: 2px solid red;
            margin-bottom: 15px;
        }

        .info {
            font-size: 14px;
            margin-bottom: 20px;
            background: rgba(78, 139, 255, 0.1);
            padding: 10px;
            border-radius: 6px;
        }

        .button-container {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            background: #4E8BFF;
            border-radius: 8px;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #3A72D9;
            transform: scale(1.05);
        }

        .btn-icon {
            filter: brightness(0) invert(1);
            margin-right: 6px;
            width: 16px;
            height: 16px;
        }

        .footer-links {
            font-size: 14px;
            margin-top: 15px;
            text-align: center;
        }

        /* MENU */
        .menu {
            display: flex;
            justify-content: center;
            padding: 10px;
            background-color: #161738;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .menu a {
            color: #4E8BFF;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
            transition: color 0.3s;
        }

        .menu a:hover {
            color: #FFFFFF;
        }

    </style>
</head>
<body>

<div class="menu">
    <a href="#">Hodnocení</a> |
    <a href="#">Sledováno</a> |
    <a href="#">Seriály v Bedně</a>
</div>

<div class="profile-box">
    <div class="username">
        kenkaku
        <img src="https://img.icons8.com/ios-filled/50/CCCCCC/ok--v1.png" class="favorite-icon" alt="Neoblíbený">
    </div>
    <div class="avatar"></div>
    <div class="info">
        <strong>Registrace:</strong> před 7 lety<br>
        <strong>Sledováno:</strong> 6 měsíců 22 dní 22 hodin 23 minut (6607 epizod, 183 seriálů)
    </div>

    <div class="button-container">
        <button class="btn">
            <img src="https://img.icons8.com/ios/50/FFFFFF/speech-bubble--v1.png" class="btn-icon">
            Poslat zprávu
        </button>
        <button class="btn">
            <img src="https://img.icons8.com/ios/50/FFFFFF/star--v1.png" class="btn-icon">
            Přidat do oblíbených
        </button>
    </div>
</div>

</body>
</html>
