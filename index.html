<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Flappy Blcha vs. Benny — s Menu</title>
<style>
  :root{
    --bg:#0f172a; --bg2:#0b1220; --ui:#e5e7eb; --muted:#9aa5b1;
    --flea:#22d3ee; --pipe1:#f8bf42; --pipe2:#b57409; --ground:#1f2937;
    --benny1:#f3d47a; --benny2:#d1a84b;
    --panel:#0b1220dd; --accent:#0ea5b7; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background: radial-gradient(1200px 800px at 70% -10%, #1e293b 0%, var(--bg2) 40%, var(--bg) 100%);
    color:var(--ui); font:600 16px/1.3 system-ui,-apple-system,Segoe UI,Roboto,Arial;
    display:flex; align-items:center; justify-content:center; -webkit-user-select:none; user-select:none;
  }
  .wrap{ width:min(100vw, 560px); height:100dvh; max-height:100vh; display:flex; flex-direction:column; padding:10px }
  header{display:flex; align-items:center; justify-content:space-between; color:var(--muted); font-weight:600; margin-bottom:8px}
  header .title{color:var(--ui); font-weight:800; letter-spacing:.2px}
  .menuBtn{
    appearance:none; border:0; border-radius:10px; padding:8px 12px; font:700 14px/1 system-ui;
    background:var(--accent); color:#001018; box-shadow:0 6px 16px rgba(14,165,183,.3); cursor:pointer;
  }
  .stage{
    position:relative; flex:1 1 auto; border-radius:16px; overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.06);
    background:linear-gradient(#0b1020 0 75%, #0d1326 75% 100%);
    touch-action:none;
  }
  canvas{display:block; width:100%; height:100%}
  .panel{
    position:absolute; inset:0; display:none; place-items:center; background:rgba(0,0,0,.45);
  }
  .panel.show{display:grid}
  .card{
    width:min(92%, 440px); border-radius:16px; padding:18px; background:var(--panel);
    box-shadow:0 10px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .card h2{margin:0 0 10px 0; font-size:20px}
  .list{display:grid; gap:10px}
  .btn{
    width:100%; appearance:none; border:0; border-radius:12px; padding:14px 16px; font:800 16px/1 system-ui; letter-spacing:.2px;
    background:#12243a; color:#e5f9ff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .btn.primary{background:var(--accent); color:#001018; box-shadow:0 10px 22px rgba(14,165,183,.35)}
  .row{display:grid; gap:6px; margin:8px 0}
  label{font-size:14px; color:var(--muted)}
  input[type="range"]{width:100%}
  .row .val{font-weight:800; color:#b8eaff}
  .card .close{
    width:100%; margin-top:10px; appearance:none; border:0; border-radius:12px; padding:12px 16px; font:700 14px/1 system-ui;
    background:#243244; color:#c9d7e7; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  footer{margin-top:8px; text-align:center; color:var(--muted); font-size:13px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">Flappy Blcha vs. Benny</div>
      <button class="menuBtn" id="openMenu">Menu</button>
    </header>

    <div class="stage" id="stage">
      <canvas id="game"></canvas>

      <div class="panel show" id="menuPanel">
        <div class="card">
          <h2>Menu</h2>
          <div class="list">
            <button class="btn primary" id="newGameBtn">Nová hra</button>
            <button class="btn" id="aboutBtn">Autor</button>
          </div>
        </div>
      </div>

      <div class="panel" id="aboutPanel">
        <div class="card">
          <h2>Autor</h2>
          <div style="margin:6px 0 14px 0">Matúš Bereš</div>
          <button class="close" id="closeAbout">Späť</button>
        </div>
      </div>
    </div>

    <footer>📱 Tap = skok • Tap po „Koniec“ = reštart</footer>
  </div>

<script>
(()=>{

const stage = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const menuPanel = document.getElementById('menuPanel');
const aboutPanel = document.getElementById('aboutPanel');
const openMenu = document.getElementById('openMenu');
const newGameBtn = document.getElementById('newGameBtn');
const aboutBtn = document.getElementById('aboutBtn');
const closeAbout = document.getElementById('closeAbout');

const STATE = { MENU:'menu', READY:'ready', PLAY:'play', OVER:'over' };
let state = STATE.MENU;

let W=0,H=0,DPR=1;
let gravity, jumpV, flea, pipes, gap, speed, groundH, bennyProb;
let best=0, score=0;

function resetGame(full=true){
  DPR = window.devicePixelRatio||1;
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  canvas.width=W*DPR; canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);

  groundH = H*0.1;
  gravity = H*0.0013;
  jumpV = -H*0.022; // jemný skok
  gap = H*0.28;
  speed = H*0.004;
  bennyProb = 0.4;

  flea={x:W*0.25,y:H/2,vy:0,r:H*0.025};
  pipes=[];
  if(full) score=0;
}

function spawnPipe(){
  const margin=H*0.15;
  const gy=Math.random()*(H-groundH-2*margin-gap)+margin+gap/2;
  const pipe={x:W,gy};
  if(Math.random()<bennyProb) pipe.benny={y:gy,w:H*0.09,h:H*0.07};
  pipes.push(pipe);
}

function drawFlea(x,y,r){
  ctx.fillStyle='#22d3ee';
  ctx.beginPath(); ctx.ellipse(x,y,r*1.2,r,0,0,Math.PI*2); ctx.fill();
}
function drawBenny(x,y,w,h){
  ctx.fillStyle='#f3d47a';
  ctx.fillRect(x-w/2,y-h/2,w,h);
}

function loop(){
  ctx.fillStyle='#0b1020'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1f2937'; ctx.fillRect(0,H-groundH,W,groundH);

  if(state===STATE.PLAY){
    flea.vy+=gravity;
    flea.y+=flea.vy;
    if(flea.y>H-groundH-flea.r) state=STATE.OVER;

    for(let i=pipes.length-1;i>=0;i--){
      let p=pipes[i];
      p.x-=speed*16;
      if(p.x+H*0.08<0) pipes.splice(i,1);
      if(p.x===Math.floor(flea.x)) score++;
      if(flea.x+flea.r>p.x && flea.x-flea.r<p.x+H*0.08){
        if(flea.y-flea.r<p.gy-gap/2 || flea.y+flea.r>p.gy+gap/2) state=STATE.OVER;
      }
    }
    if(pipes.length<3) spawnPipe();
  }

  for(const p of pipes){
    ctx.fillStyle='#f8bf42';
    ctx.fillRect(p.x,0,H*0.08,p.gy-gap/2);
    ctx.fillRect(p.x,p.gy+gap/2,H*0.08,H-groundH-(p.gy+gap/2));
    if(p.benny) drawBenny(p.x+H*0.04,p.benny.y,p.benny.w,p.benny.h);
  }

  drawFlea(flea.x,flea.y,flea.r);

  ctx.fillStyle='#fff';
  ctx.fillText(`Skóre: ${score}`,10,20);

  if(state===STATE.MENU || state===STATE.READY || state===STATE.OVER){
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    ctx.textAlign='center';
    ctx.fillText(state===STATE.OVER?'Koniec hry':'Ťukni pre štart',W/2,H/2);
    ctx.textAlign='start';
  }

  requestAnimationFrame(loop);
}

function startPlay(){
  hideAll();
  state=STATE.READY;
  resetGame(true);
  state=STATE.PLAY;
  flea.vy=jumpV;
}

function hideAll(){ menuPanel.classList.remove('show'); aboutPanel.classList.remove('show'); }
function showMenu(){ hideAll(); menuPanel.classList.add('show'); state=STATE.MENU; }
function showAbout(){ hideAll(); aboutPanel.classList.add('show'); }

function onTap(e){
  e.preventDefault();
  if(menuPanel.classList.contains('show')||aboutPanel.classList.contains('show')){
    startPlay(); return;
  }
  if(state===STATE.OVER){ startPlay(); return; }
  if(state===STATE.PLAY){ flea.vy=jumpV; }
}

stage.addEventListener('pointerdown',onTap,{passive:false});
openMenu.addEventListener('click',showMenu);
newGameBtn.addEventListener('click',startPlay);
aboutBtn.addEventListener('click',showAbout);
closeAbout.addEventListener('click',showMenu);

resetGame(true);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
