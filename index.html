<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Žebříček recenzentů</title>
  <style>
    /* CSS proměnné */
    :root {
      --primary-color: #1e3a8a;
      --secondary-color: #48bb78;
      --danger-color: #f56565;
      --warning-color: #f6ad55;
      --background-dark: #0f172a;
      --text-dark: #f8fafc;
      --surface-dark: #1e293b;
      --border-dark: #334155;
      --shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      --transition: all 0.3s ease;
    }

    /* Obecné štýly */
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background-dark);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    /* Fixovaná hlavička */
    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--background-dark);
      z-index: 999;
      padding: 1rem 1rem;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    body.fixed-padding {
      padding-top: 120px; /* Výška fixného bloku */
    }

    /* Hamburger menu */
    #menu-toggle {
      width: 1.5rem;
      height: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 100;
    }

    #menu-toggle .bar {
      height: 3px;
      width: 100%;
      background-color: var(--text-dark);
      border-radius: 2px;
      transition: var(--transition);
    }

    #menu-toggle.active .top {
      transform: rotate(45deg) translateY(7px);
    }

    #menu-toggle.active .middle {
      opacity: 0;
    }

    #menu-toggle.active .bottom {
      transform: rotate(-45deg) translateY(-7px);
    }

    /* Rozbalovací menu */
    #dropdown-menu {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      background: var(--surface-dark);
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      padding: 0.5rem 0;
      box-shadow: var(--shadow);
      z-index: 99;
      display: none;
      text-align: center;
    }

    #dropdown-menu.show {
      display: block;
    }

    #dropdown-menu a.menu-item {
      display: block;
      padding: 0.75rem 1rem;
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    #dropdown-menu a.menu-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    /* Ikona lupy */
    .search-icon {
      width: 1.5rem;
      height: 1.5rem;
      cursor: pointer;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 0 0 1.48-8.99 6.52 6.52 0 0 0-9.22 0 6.52 6.52 0 0 0 0 9.22 6.5 6.5 0 0 0 8.99-1.48l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>') no-repeat center;
      background-size: contain;
    }

    /* Vyhledávací panel */
    #search-container {
      display: none;
      padding: 1rem;
      background: var(--surface-dark);
      border-radius: 8px;
      margin: 1rem;
    }

    #search-container.show {
      display: block;
    }

    #searchInput {
      padding: 0.75rem;
      font-size: 1rem;
      width: 100%;
      border: 1px solid var(--border-dark);
      border-radius: 8px;
      background: var(--surface-dark);
      color: var(--text-dark);
      transition: var(--transition);
    }

    #searchInput:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.2);
    }

    /* Legenda nad textem */
    .search-legend-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin: 1rem;
      flex-wrap: wrap;
      background: var(--surface-dark);
      padding: 1rem;
      border-radius: 8px;
    }

    .legend {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .legend-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-dark);
    }

    .legend-square {
      width: 1rem;
      height: 1rem;
      border-radius: 4px;
    }

    .legend-square.danger {
      background-color: var(--danger-color);
      animation: pulse 1.5s infinite;
    }

    .legend-square.warning {
      background-color: var(--warning-color);
      animation: pulse 2.5s infinite;
    }

    /* Animace blikání */
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Responzívní tabulka */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 0 auto;
      padding-top: 1rem;
    }

    table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      background: var(--surface-dark);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      text-align: center;
      font-size: 0.9rem;
      padding: 0.75rem;
      border-bottom: 1px solid var(--border-dark);
    }

    thead {
      background: var(--primary-color);
      color: #ffffff;
    }

    th {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      position: sticky;
      top: 0;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr {
      transition: background-color 0.3s ease;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* Responzivní úpravy */
    @media (max-width: 768px) {
      .fixed-header {
        padding: 0.5rem;
      }

      #menu-toggle {
        margin: 0;
      }

      #dropdown-menu {
        top: 50px;
      }

      .search-legend-container {
        flex-direction: column;
        gap: 0.5rem;
      }

      .legend-item {
        flex-direction: row;
        gap: 0.5rem;
      }

      th, td {
        font-size: 0.8rem;
        padding: 0.5rem;
      }

      table {
        min-width: 400px;
      }
    }

    @media (max-width: 480px) {
      th, td {
        font-size: 0.7rem;
        padding: 0.3rem;
      }

      .legend-square {
        width: 0.8rem;
        height: 0.8rem;
      }
    }
  </style>
</head>
<body class="fixed-padding">
  <div class="fixed-header">
    <div id="menu-toggle" onclick="toggleMenu()">
      <div class="bar top"></div>
      <div class="bar middle"></div>
      <div class="bar bottom"></div>
    </div>
    <div class="search-icon" onclick="toggleSearch()"></div>
  </div>

  <div id="dropdown-menu">
    <a href="2012.html" target="_blank" class="menu-item">PunisherEDNA</a>
    <a href="#" class="menu-item">Žebříček ČSFD</a>
    <a href="trollove.html" target="_blank" class="menu-item">Trollové</a>
  </div>

  <div id="search-container">
    <input type="text" id="searchInput" placeholder="Hledej uživatele..." onkeyup="filterTable()">
  </div>

  <div class="search-legend-container">
    <div class="legend">
      <div class="legend-item">
        <div class="legend-square danger"></div>
        <span>Překonání do 24 hodin</span>
      </div>
      <div class="legend-item">
        <div class="legend-square warning"></div>
        <span>Překonání do 1 měsíce</span>
      </div>
    </div>
  </div>

  <div class="table-wrapper">
    <table id="reviewTable">
      <thead>
        <tr>
          <th scope="col">Pořadí</th>
          <th scope="col">Uživatel</th>
          <th scope="col">Počet recenzí</th>
          <th scope="col">Dní do překonání</th>
          <th scope="col">Datum překonání</th>
          <th scope="col">Odpočet</th>
        </tr>
      </thead>
      <tbody>
        <!-- Tu budú dynamicky vkladané riadky -->
      </tbody>
    </table>
  </div>

  <script>
    // Načítanie pevných dát (nahradené dynamickým načítaním pri API integrácii)
    const data = [
      { username: "corpSy", flag: "🇸🇰", reviews: 23872, daysToOvertake: 482, overtakeDate: "2026-08-29" },
      { username: "T2", flag: "🇸🇰", reviews: 19983, daysToOvertake: 385, overtakeDate: "2026-05-24" },
      // Pridajte ďalšie údaje podľa potreby
    ];

    // Vykreslenie tabulky
    function renderTable() {
      const tbody = document.querySelector("#reviewTable tbody");
      tbody.innerHTML = "";
      data.forEach((user, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${index + 1}</td>
          <td class="tooltip"><span class="flag">${user.flag}</span>${user.username}<span class="tooltip-text">Počet recenzí: ${user.reviews}<br>Datum překonání: ${user.overtakeDate}<br>Zbývá: ${user.daysToOvertake} dní</span></td>
          <td>${user.reviews}</td>
          <td>${user.daysToOvertake}</td>
          <td>${user.overtakeDate}</td>
          <td><span id="countdown-${index + 1}" data-target-date="${user.overtakeDate}"></span></td>`;
        tbody.appendChild(row);
      });
      updateAllCountdowns();
    }

    // Filtrovanie tabulky
    function filterTable() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#reviewTable tbody tr");
      rows.forEach(row => {
        const username = row.cells[1].textContent.toLowerCase();
        row.style.display = username.includes(input) ? "" : "none";
      });
    }

    // Odpočet
    function updateAllCountdowns() {
      document.querySelectorAll("[id^=countdown]").forEach(span => {
        const targetDate = span.dataset.targetDate;
        const target = new Date(targetDate);
        const now = new Date();
        const diff = target - now;
        const row = span.closest("tr");

        row.classList.remove("month-warning");
        span.classList.remove("urgent-countdown", "prekonan");

        if (diff <= 0) {
          span.innerText = "Překonán!";
          span.classList.add("prekonan");
          return;
        }

        if (diff <= 24 * 60 * 60 * 1000) {
          span.classList.add("urgent-countdown");
        } else if (diff <= 30 * 24 * 60 * 60 * 1000) {
          row.classList.add("month-warning");
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        span.innerText = `${days}d ${hours}h ${minutes}m`;
      });
    }
    setInterval(updateAllCountdowns, 1000);

    // Toggle menu
    function toggleMenu() {
      const toggle = document.getElementById('menu-toggle');
      const menu = document.getElementById('dropdown-menu');
      toggle.classList.toggle('active');
      menu.classList.toggle('show');
    }

    // Toggle search
    function toggleSearch() {
      const searchContainer = document.getElementById('search-container');
      searchContainer.classList.toggle('show');
    }

    // Inicializácia
    document.addEventListener("DOMContentLoaded", () => {
      renderTable();
      document.querySelectorAll('#dropdown-menu a').forEach(link => {
        link.addEventListener('click', () => {
          document.getElementById('menu-toggle').classList.remove('active');
          document.getElementById('dropdown-menu').classList.remove('show');
        });
      });

      // Skrytie menu a tooltipov pri scrollovaní
      window.addEventListener('scroll', () => {
        const menu = document.getElementById('dropdown-menu');
        const toggle = document.getElementById('menu-toggle');
        if (menu.classList.contains('show')) {
          menu.classList.remove('show');
          toggle.classList.remove('active');
        }
        document.querySelectorAll('.tooltip .tooltip-text').forEach(el => {
          el.style.visibility = 'hidden';
          el.style.opacity = '0';
        });
      });
    });
  </script>
</body>
</html>
