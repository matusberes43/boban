<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>TROLLOVÉ Z EDNY</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: #1b1b1b;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      background: linear-gradient(to right, #222, #333);
      width: 100%;
      padding: 25px 0;
      text-align: center;
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 6px;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      color: #ff3b3f;
    }

    .back-button-container {
      width: 100%;
      max-width: 800px;
      margin-top: 15px;
      padding-left: 5px;
    }

    .back-button-container button {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 14px;
      text-transform: uppercase;
    }

    .troll-list {
      width: 100%;
      max-width: 800px;
      margin-top: 20px;
      background-color: rgba(35,35,35,0.9);
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      border-radius: 4px;
    }

    .troll-item {
      display: grid;
      grid-template-columns: 50px 120px auto 100px;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #444;
      text-decoration: none;
      color: inherit;
      transition: background 0.3s;
    }

    .troll-item:hover {
      background-color: rgba(255,255,255,0.05);
    }

    .rank {
      font-weight: 700;
      text-align: center;
    }

    .rating {
      font-weight: 700;
      color: #ffeb3b;
      background-color: #444;
      padding: 4px;
      border-radius: 3px;
      text-align: center;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .name {
      font-weight: 500;
      padding-left: 10px;
    }

    .region {
      text-align: center;
      font-size: 0.8rem;
      color: #ff9800;
    }
  </style>
</head>
<body>

  <div class="header">TROLLOVÉ Z EDNY</div>

  <div class="back-button-container">
    <button onclick="history.back()">← Zpět</button>
  </div>

  <div class="troll-list">
    <a href="#" class="troll-item"><div class="rank">#1</div><div class="rating">0</div><div class="name">Orchoose</div><div class="region">AT</div></a>
    <a href="#" class="troll-item"><div class="rank">#2</div><div class="rating">0</div><div class="name">MilloH</div><div class="region">PT</div></a>
    <a href="#" class="troll-item"><div class="rank">#3</div><div class="rating">0</div><div class="name">Tron1000</div><div class="region">AT</div></a>
    <a href="#" class="troll-item"><div class="rank">#4</div><div class="rating">0</div><div class="name">myp2p</div><div class="region">PT</div></a>
    <a href="#" class="troll-item"><div class="rank">#5</div><div class="rating">0</div><div class="name">Dragon94</div><div class="region">AT</div></a>
    <a href="#" class="troll-item"><div class="rank">#6</div><div class="rating">0</div><div class="name">PecaCZE</div><div class="region">PT</div></a>
    <a href="#" class="troll-item"><div class="rank">#7</div><div class="rating">0</div><div class="name">Zilwicky</div><div class="region">AT</div></a>
    <a href="#" class="troll-item"><div class="rank">#8</div><div class="rating">0</div><div class="name">hyeana</div><div class="region">PT</div></a>
    <a href="#" class="troll-item"><div class="rank">#9</div><div class="rating">0</div><div class="name">rhobos</div><div class="region">AT</div></a>
    <a href="#" class="troll-item"><div class="rank">#10</div><div class="rating">0</div><div class="name">Punisehr bude trestat</div><div class="region">PT</div></a>
    <a href="#" class="troll-item"><div class="rank">#11</div><div class="rating">0</div><div class="name">nikolperse</div><div class="region">AT</div></a>
    <a href="#" class="troll-item"><div class="rank">#12</div><div class="rating">0</div><div class="name">Darnwell</div><div class="region">PT</div></a>
  </div>

</body>
</html>
