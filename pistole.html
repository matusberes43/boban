<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pištole</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0A1624;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .container {
            text-align: center;
            background-color: #102C4A;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .container img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .container img:hover {
            transform: scale(1.05);
        }

        .container h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #6CFF47;
            cursor: pointer;
        }

        .container h2:hover {
            color: #ffffff;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #6CFF47;
            color: #0A1624;
            border-radius: 50px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #5BCC40;
        }
    </style>
</head>
<body>

    <!-- Karta Glock 17 -->
    <div class="container">
        <a href="glock17.html">
            <img src="https://i.postimg.cc/7PnFC1TB/IMG-7641.jpg" alt="GLOCK 17">
            <h2>GLOCK 17</h2>
        </a>
        <a href="glock17.html" class="btn">Viac informácií</a>
    </div>

    <!-- Karta Beretta 92FS -->
    <div class="container">
        <a href="beretta92fs.html">
            <img src="https://i.postimg.cc/x1P39GjL/IMG-7644.jpg" alt="BERETTA 92FS">
            <h2>BERETTA 92FS</h2>
        </a>
        <a href="beretta92fs.html" class="btn">Viac informácií</a>
    </div>

    <!-- Karta CZ 75 -->
    <div class="container">
        <a href="cz75.html">
            <img src="https://i.postimg.cc/qvfmLfGw/IMG-7645.jpg" alt="CZ 75">
            <h2>CZ 75</h2>
        </a>
        <a href="cz75.html" class="btn">Viac informácií</a>
    </div>

</body>
</html>
