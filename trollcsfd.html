<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Trollové</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 300px;
      background-color: #ffffff;
      border-right: 1px solid #e2e8f0;
      padding: 1rem;
      overflow-y: auto;
    }

    .sidebar h2 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #1e3a8a;
    }

    .user {
      display: flex;
      align-items: center;
      padding: 0.75rem;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .user:hover {
      background-color: #e2e8f0;
    }

    .user img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 1rem;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-info .name {
      font-weight: bold;
      color: #111827;
    }

    .user-info .username {
      font-size: 0.9rem;
      color: #6b7280;
    }

    .details {
      flex: 1;
      padding: 2rem;
    }

    .details h3 {
      margin-top: 0;
      color: #1e293b;
    }

    .details p {
      font-size: 1rem;
      color: #374151;
    }

    .placeholder {
      color: #9ca3af;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Trollové</h2>
    <div class="user" onclick="showDetails('user123')">
      <img src="https://via.placeholder.com/40" alt="avatar">
      <div class="user-info">
        <div class="name">Troll</div>
        <div class="username">user123</div>
      </div>
    </div>
    <div class="user" onclick="showDetails('edgy_poster')">
      <img src="https://via.placeholder.com/40" alt="avatar">
      <div class="user-info">
        <div class="name">Troll</div>
        <div class="username">edgy_poster</div>
      </div>
    </div>
    <div class="user" onclick="showDetails('HotTake87')">
      <img src="https://via.placeholder.com/40" alt="avatar">
      <div class="user-info">
        <div class="name">Troll</div>
        <div class="username">HotTake87</div>
      </div>
    </div>
    <div class="user" onclick="showDetails('spammer456')">
      <img src="https://via.placeholder.com/40" alt="avatar">
      <div class="user-info">
        <div class="name">Spammer456</div>
        <div class="username">spammer456</div>
      </div>
    </div>
  </div>

  <div class="details" id="details">
    <p class="placeholder">Klikni na uživatele vlevo pro zobrazení detailů.</p>
  </div>

  <script>
    const users = {
      user123: {
        name: "Troll (user123)",
        reason: "Provokuje pod každou recenzí, cílí na konkrétní uživatele.",
        joined: "leden 2024",
        activity: "30+ spamových komentářů"
      },
      edgy_poster: {
        name: "Troll (edgy_poster)",
        reason: "Záměrně kontroverzní příspěvky bez argumentace.",
        joined: "únor 2024",
        activity: "Hlášeno 12x komunitou"
      },
      HotTake87: {
        name: "Troll (HotTake87)",
        reason: "Neustálé urážky jiných recenzentů.",
        joined: "březen 2024",
        activity: "Ignoruje varování"
      },
      spammer456: {
        name: "Spammer456",
        reason: "Opakované vkládání odkazů a nevyžádaných zpráv.",
        joined: "duben 2024",
        activity: "Zabanován, stále si zakládá nové účty"
      }
    };

    function showDetails(username) {
      const data = users[username];
      const container = document.getElementById('details');
      container.innerHTML = `
        <h3>${data.name}</h3>
        <p><strong>Důvod zařazení:</strong> ${data.reason}</p>
        <p><strong>Datum registrace:</strong> ${data.joined}</p>
        <p><strong>Aktivita:</strong> ${data.activity}</p>
      `;
    }
  </script>

</body>
</html>
