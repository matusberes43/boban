<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Trollové</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
    }

    .header {
      background-color: #1e3a8a;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      border-bottom: 1px solid #334155;
    }

    .troll-list {
      max-width: 600px;
      margin: 2rem auto;
      background-color: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .troll-item {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #334155;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s;
    }

    .troll-item:hover {
      background-color: #273549;
    }

    .troll-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #475569;
      margin-right: 1rem;
    }

    .troll-info {
      display: flex;
      flex-direction: column;
    }

    .troll-name {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .troll-username {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .last-item {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="header">Trollové</div>

  <div class="troll-list">
    <a href="troll-user123.html" class="troll-item">
      <div class="troll-avatar"></div>
      <div class="troll-info">
        <div class="troll-name">Troll</div>
        <div class="troll-username">user123</div>
      </div>
    </a>
    <a href="troll-edgy_poster.html" class="troll-item">
      <div class="troll-avatar"></div>
      <div class="troll-info">
        <div class="troll-name">Troll</div>
        <div class="troll-username">edgy_poster</div>
      </div>
    </a>
    <a href="troll-HotTake87.html" class="troll-item">
      <div class="troll-avatar"></div>
      <div class="troll-info">
        <div class="troll-name">Troll</div>
        <div class="troll-username">HotTake87</div>
      </div>
    </a>
    <a href="troll-spammer456.html" class="troll-item last-item">
      <div class="troll-avatar"></div>
      <div class="troll-info">
        <div class="troll-name">Spammer456</div>
        <div class="troll-username">spammer456</div>
      </div>
    </a>
  </div>

</body>
</html>
