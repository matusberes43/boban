    .header {
      background-color: #1e3a8a;
      padding: 1rem 2rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: white;
      border-bottom: 1px solid #334155;
    }
    .troll-list {
      max-width: 600px;
      margin: 2rem auto;
      background-color: #1e293b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }
    .troll-item {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #334155;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background 0.2s;
    }
    .troll-item:hover {
      background-color: #273549;
    }
    .troll-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #475569;
      margin-right: 1rem;
    }
    .troll-info {
      display: flex;
      flex-direction: column;
    }
    .troll-name {
      font-weight: bold;
      font-size: 1.05rem;
    }
    .troll-username {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .last-item {

    }
  </style>
