<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLCHAGUNS - Join Form</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: #0A1624;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background-color: #0E2436;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .back-arrow {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            background-color: #102C4A;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        .back-arrow:hover {
            background-color: #6CFF47;
        }

        .back-arrow img {
            width: 20px;
            height: 20px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .login-methods {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .login-methods div {
            width: 50px;
            height: 50px;
            background-color: #0078d4;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .login-methods div img {
            width: 24px;
            height: 24px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #102C4A;
            border: none;
            border-radius: 5px;
            color: #ffffff;
        }

        .promo-code {
            background: #0C1E32;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
            border-radius: 5px;
            cursor: pointer;
        }

        .promo-code:hover {
            background: #142F49;
        }

        .sign-up-button {
            width: 100%;
            padding: 15px;
            background-color: #6CFF47;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            color: #0A1624;
            cursor: pointer;
        }

        .terms {
            margin-top: 20px;
            font-size: 12px;
            color: #A0A0A0;
            text-align: center;
        }

        .terms a {
            color: #0078d4;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="form-container">
    <!-- Moderná spätná šípka -->
    <div class="back-arrow" onclick="goBack()">
        <img src="https://img.icons8.com/ios-filled/50/ffffff/left.png" alt="Back">
    </div>

    <h2>Create an Account</h2>

    <!-- Select Login Method -->
    <div class="login-methods">
        <div><img src="https://img.icons8.com/ios-filled/50/ffffff/email.png" alt="Email"></div>
        <div><img src="https://img.icons8.com/ios-filled/50/ffffff/mac-os.png" alt="Apple"></div>
        <div><img src="https://img.icons8.com/ios-filled/50/ffffff/google-logo.png" alt="

Google"></div>
    </div>

    <!-- Input Fields -->
    <input type="text" placeholder="Choose a Username">
    <input type="email" placeholder="Enter Your Email Address">
    <input type="password" placeholder="Create a Password">

    <!-- Promo / Referral Code -->
    <div class="promo-code">+ PROMO / REFERRAL CODE</div>

    <!-- Sign Up Button -->
    <div class="sign-up-button">Sign Up</div>

    <!-- Terms and Conditions -->
    <div class="terms">
        By signing up, you agree to the <a href="#">Terms of Service</a>, <a href="#">Privacy Policy</a>, and <a href="#">Unofficial Application Notice</a>.
    </div>
</div>

<!-- JavaScript -->
<script>
    function goBack() {
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
